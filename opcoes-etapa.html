<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GeloPro · Formato da Etapa</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
/* Mostruário para o Pedro escolher o formato do cartão da Etapa. O app abaixo é o app real (iframe, modo Amostra);
   só o estilo dos cartões das opções ([data-opcoes]) muda. Topo, cabeçalho da pergunta e dock não são tocados. */
html, body { margin: 0; background: #e6eaef; color: #091e42; font: 500 16px/22px 'Roboto', system-ui, sans-serif; }
.topo { position: sticky; top: 0; z-index: 2; box-sizing: border-box; padding: 8px 12px 6px; background: #e6eaef; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.chaves { display: flex; gap: 8px; }
.chaves button { min-width: 96px; min-height: 48px; padding: 0 14px; border-radius: 12px; border: 2px solid #19365c; background: #ffffff; color: #19365c; font: 700 16px/20px 'Roboto', system-ui, sans-serif; cursor: pointer; }
.chaves button[aria-pressed="true"] { background: #19365c; color: #ffffff; }
.chaves button:focus-visible, .recomecar:focus-visible { outline: 3px solid #2563eb; outline-offset: 2px; }
.nota { max-width: 390px; margin: 0; text-align: center; font-size: 16px; line-height: 22px; font-weight: 500; color: #44546f; }
.recomecar { min-height: 48px; padding: 0 10px; border: 0; background: transparent; color: #19365c; font: 700 16px/20px 'Roboto', system-ui, sans-serif; text-decoration: underline; cursor: pointer; }
.palco { display: flex; justify-content: center; padding: 0 0 16px; }
.moldura { width: 390px; height: 844px; transform-origin: top center; }
.moldura iframe { display: block; width: 390px; height: 844px; border: 0; border-radius: 12px; box-shadow: 0 6px 24px rgba(9, 30, 66, .25); background: #091e42; }
</style>
</head>
<body>
<div class="topo">
  <div class="chaves" role="group" aria-label="Formato do cartão da Etapa">
    <button type="button" data-k="A" aria-pressed="false">Opção A</button>
    <button type="button" data-k="B" aria-pressed="false">Opção B ✓</button>
    <button type="button" data-k="C" aria-pressed="false">Opção C</button>
  </div>
  <p class="nota" id="nota" aria-live="polite"></p>
  <button type="button" class="recomecar" id="recomecar">Voltar para Pinga água → Pergunta 1</button>
</div>
<div class="palco" id="palco">
  <div class="moldura" id="moldura">
    <iframe id="app" title="GeloPro, app real em modo Amostra" src="app/GeloPro%20App%20v5.2.dc.html?amostra=1"></iframe>
  </div>
</div>
<script>
// Base comum: os três formatos mantêm os cartões empilhados (1 coluna), como a Etapa do app.
const BASE = '[data-opcoes]{grid-template-columns:minmax(0,1fr)!important;}';
// Barra de 1 linha: rótulo 18 px e legenda 16 px lado a lado, sem quebra.
// O app já usa a opção B (escolhida pelo Pedro). A e C desfazem o cartão em linha e voltam à barra embaixo.
const COLUNA = '[data-opcoes]>button{flex-direction:column!important;}[data-quadro]{flex:1 1 auto!important;width:100%!important;}'
  + '[data-barra]{flex:none!important;width:100%!important;flex-direction:row!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.22)!important;}[data-barra]>span:first-child{flex-wrap:nowrap!important;}';
// Barra de 1 linha: rótulo 18 px e legenda 16 px lado a lado, sem quebra.
const UMA_LINHA = (h) => `[data-barra]{min-height:${h}px!important;height:${h}px;padding:0 10px!important;flex-wrap:nowrap!important;column-gap:6px!important;overflow:hidden;}`
  + '[data-barra]>span:first-child>span{font-size:18px!important;line-height:22px!important;}[data-barra] svg{width:20px;height:20px;}'
  + '[data-legenda]{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}';
const FORMATOS = {
  A: {
    nota: 'A · Empilhado, imagem ampliada (128 %) e barra de 1 linha com 38 px. O selo da arte vai para o canto superior esquerdo.',
    css: BASE + COLUNA + UMA_LINHA(38) + '[data-legenda]::before{content:"· ";}'
      + '[data-cena]{background-size:128% auto!important;background-position:center 58%!important;}'
      // Selo da própria arte (faixa do topo da imagem, x 48–568 e y 8–88 em 640) reposicionado no canto do quadro.
      + '[data-cena]::before{content:"";position:absolute;left:6px;top:6px;width:208px;height:32px;border-radius:8px;background-color:#f8fafc;background-image:inherit;background-repeat:no-repeat;background-size:256px auto;background-position:-19px -3px;box-shadow:0 1px 3px rgba(9,30,66,.3);}',
  },
  B: {
    nota: 'B · Escolhida: imagem inteira (contain) na altura toda do cartão e coluna de resposta de 136 px à direita, em camadas (ícone e rótulo; legenda), sem hífen e sem diminuir a fonte. É o app como está.',
    css: BASE,
  },
  C: {
    nota: 'C · Empilhado, imagem inteira (contain, sem zoom) e pílula de 1 linha com 34 px flutuando no fundo branco do cartão.',
    css: BASE + COLUNA + UMA_LINHA(34)
      + '[data-opcoes]>button{background:#f8fafc!important;}'
      + '[data-barra]{width:auto!important;margin:0 6px 6px;border-radius:999px;}'
      + '[data-legenda]::before{content:"— ";}',
  },
};

const app = document.getElementById('app');
const nota = document.getElementById('nota');
const chaves = [...document.querySelectorAll('.chaves button')];
let atual = (location.hash.slice(1) || 'B').toUpperCase();
if (!FORMATOS[atual]) atual = 'B';

function aplicar(k) {
  atual = k;
  try { history.replaceState(null, '', '#' + k); } catch (e) {}
  chaves.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.k === k)));
  nota.textContent = FORMATOS[k].nota;
  const d = app.contentDocument;
  if (!d || !d.head) return;
  let st = d.getElementById('formato-etapa');
  if (!st) { st = d.createElement('style'); st.id = 'formato-etapa'; d.head.appendChild(st); }
  st.textContent = FORMATOS[k].css;
}

// Abre "Pinga água → Pergunta 1" no app real depois que a base técnica (CSVs de percurso) terminou de carregar.
// Se o toque chegar cedo e o app mostrar "Percurso … ainda não cadastrado", volta e tenta de novo.
function abrirPinga() {
  let n = 0;
  const t = setInterval(() => {
    const d = app.contentDocument, w = app.contentWindow;
    n++;
    if (!d || n > 160) { if (n > 160) clearInterval(t); return; }
    aplicar(atual);
    if (d.querySelector('[data-opcoes]')) { clearInterval(t); return; }
    const base = w.performance.getEntriesByType('resource').some(r => /percursos_tecnico_resultados\.csv/.test(r.name) && r.responseEnd > 0);
    if (!base) return;
    const bt = (nome) => [...d.querySelectorAll('button')].find(x => (x.getAttribute('aria-label') || x.innerText || '').trim() === nome);
    if (/ainda não cadastrado/.test(d.body.innerText)) { const v = bt('Voltar'); if (v) v.click(); return; }
    const b = bt('Pinga água');
    if (b) b.click();
  }, 250);
}

// No celular mais estreito que 390 px, o aparelho inteiro encolhe na mesma proporção.
function encaixar() {
  const s = Math.min(1, (window.innerWidth - 8) / 390);
  const m = document.getElementById('moldura');
  m.style.transform = s < 1 ? `scale(${s})` : 'none';
  document.getElementById('palco').style.height = Math.ceil(844 * s + 16) + 'px';
}

chaves.forEach(b => b.addEventListener('click', () => aplicar(b.dataset.k)));
document.getElementById('recomecar').addEventListener('click', () => { app.src = app.src; });
app.addEventListener('load', () => { aplicar(atual); abrirPinga(); });
window.addEventListener('resize', encaixar);
encaixar();
aplicar(atual);
</script>
</body>
</html>
