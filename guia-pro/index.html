<title>GeloPRO · Fichas de Diagnóstico</title>
<!--
  14 Fichas de Diagnóstico em 7 camadas na moldura do GeloPRO v148. Ilustrações Duotone aprovadas pelo Pedro (imagens/*.webp, cópia de
  ../app/imagens/fichas/) e ícones recortados delas (imagens/icones/). Nenhuma foto 3D antiga da pasta de cenas.
  Orçamento Nº 1001: gerado NESTA página pelo motor real do app (../app/pdf-gelopro.js + ../app/gelopro-pix.js + QR do vendor), com a mesma
  numeração do app (gelopro.seq) e o titular do app (gelopro.titular). Dentro do app (?embed=1) o pedido vai para o fechamento do próprio app.
  Bônus: dados lidos dos CSVs completos de ../base-tecnica/. Sem emoji; SVG só para ícone de interface 24×24 (class="ic").
-->
<style>
@font-face{font-family:'Roboto';font-style:normal;font-display:swap;font-weight:400 800;src:url(../app/fontes/roboto-latin-wght-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
@font-face{font-family:'Roboto';font-style:normal;font-display:swap;font-weight:400 800;src:url(../app/fontes/roboto-latin-ext-wght-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+20A0-20AB,U+20AD-20C0,U+2113,U+A720-A7FF;}
@font-face{font-family:'Figtree';font-style:normal;font-display:swap;font-weight:700 800;src:url(../app/fontes/figtree-latin-wght-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
@font-face{font-family:'Figtree';font-style:normal;font-display:swap;font-weight:700 800;src:url(../app/fontes/figtree-latin-ext-wght-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+20A0-20AB,U+20AD-20C0,U+2113,U+A720-A7FF;}
@font-face{font-family:'Roboto Mono';font-style:normal;font-display:swap;font-weight:600 800;src:url(../app/fontes/roboto-mono-latin-wght-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+2212;}

*{box-sizing:border-box;margin:0;padding:0}
:root{--f-tit:'Figtree','Roboto',system-ui,sans-serif;--f-txt:'Roboto',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;--f-mono:'Roboto Mono',ui-monospace,Menlo,Consolas,monospace;
  --navy:#091E42;--folha:#F4F6F9;--cartao:#FFFFFF;--linha:#CBD5E1;--linha2:#E2E8F0;--txt:#0F172A;--txt2:#334155;--txt3:#64748B;--sel:#E0F2FE;--cab-claro:#DCE3EC}
html[data-tema="lua"]{--folha:#0F172A;--cartao:#111C2E;--linha:#24466F;--linha2:#1E2E48;--txt:#E2E8F0;--txt2:#CBD5E1;--txt3:#94A3B8;--sel:#173463;--cab-claro:#19365C}
html,body{height:100%}
body{overflow:hidden;font-family:var(--f-txt);color:var(--txt);background-color:#c1c0c1;background-image:url("../app/ref/acetinado-sedoso.svg");background-repeat:no-repeat;background-position:center;background-size:100% 100%;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
img{display:block;max-width:100%}
:focus-visible{outline:3px solid #67C6FF;outline-offset:2px}
.ic{display:block;flex-shrink:0}

/* ── Moldura GeloPRO: topo 50px · visor no chassi acetinado · dock 3D 58px ── */
#topo{position:fixed;top:0;left:0;right:0;height:50px;z-index:40;display:flex;align-items:center;gap:8px;padding:0 10px;background:#091E42;color:#FFFFFF;box-shadow:0 2px 0 #D4D4D4,0 3px 6px rgba(4,12,28,.35)}
.marca{display:flex;align-items:center;gap:6px;flex-shrink:0}
.marca .mascote{width:30px;height:30px;border-radius:8px;background:#0A182D;border:1.5px solid #D4D4D4;padding:1px}
.marca .wordmark{height:15px;width:auto}
.voltar{display:none;flex-shrink:0;align-items:center;gap:2px;height:34px;padding:0 8px 0 4px;border-radius:9px;background:#19365C;border:1px solid #24466F;font-family:var(--f-tit);font-size:12.5px;font-weight:800}
html[data-embed="1"] .voltar{display:flex}
html[data-embed="1"] .marca .wordmark{display:none}
.ficha-sel{flex:1;min-width:0;height:38px;display:flex;align-items:center;gap:6px;padding:0 8px;border-radius:9px;background:linear-gradient(180deg,#0f1724 0%,#1a2333 100%) #1d2430;border:2px solid #071224;box-shadow:inset 0 3px 8px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.35);text-align:left}
.ficha-sel .txt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.1}
.ficha-sel .cod{font-family:var(--f-mono);font-size:10px;font-weight:800;color:#67C6FF;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ficha-sel .nome{font-family:var(--f-tit);font-size:12.5px;font-weight:800;color:#FFFFFF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tema{flex-shrink:0;position:relative;width:52px;height:28px;border-radius:999px;background:#0A182D;border:2px solid #24466F;display:flex;align-items:center;justify-content:space-between;padding:0 5px}
.tema .bola{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:linear-gradient(180deg,#F8FAFC,#D4D4D4);box-shadow:0 1px 2px rgba(0,0,0,.5);transition:transform .2s}
html[data-tema="lua"] .tema .bola{transform:translateX(24px)}
#visor{position:fixed;top:50px;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:10;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:8px 8px 16px}
#dock{position:fixed;left:0;right:0;bottom:0;z-index:40;height:calc(58px + env(safe-area-inset-bottom));padding:6px 8px calc(9px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr 1.45fr;gap:7px;background:#091E42;box-shadow:0 -2px 0 #D4D4D4}
.tecla{display:flex;align-items:center;justify-content:center;gap:6px;min-width:0;border-radius:11px;color:#FFFFFF;font-family:var(--f-tit);font-size:11.5px;font-weight:800;line-height:1.1;text-align:left;padding:0 7px;
  background:linear-gradient(180deg,#28559e 0%,#1c3f7a 54%,#122a54 100%);border:2px solid #071633;box-shadow:inset 0 2px 1px rgba(147,197,253,.48),inset 0 -4px 6px rgba(2,8,23,.62),0 4px 0 #071633,0 5.5px 0 rgba(255,255,255,.68),0 8px 14px rgba(4,12,28,.42);transition:transform .08s,box-shadow .08s}
.tecla:active{transform:translateY(3px);box-shadow:inset 0 2px 1px rgba(147,197,253,.48),inset 0 -4px 6px rgba(2,8,23,.62),0 1px 0 #071633,0 2px 0 rgba(255,255,255,.5)}
.tecla.verde{background:linear-gradient(180deg,#00b100 0%,#009900 54%,#006b00 100%);border-color:#003d00;box-shadow:inset 0 2px 1px rgba(187,247,208,.48),inset 0 -4px 6px rgba(0,35,0,.58),0 4px 0 #003d00,0 5.5px 0 rgba(255,255,255,.68),0 8px 14px rgba(0,40,0,.38)}
.tecla.verde:active{box-shadow:inset 0 2px 1px rgba(187,247,208,.48),inset 0 -4px 6px rgba(0,35,0,.58),0 1px 0 #003d00,0 2px 0 rgba(255,255,255,.5)}
.tecla.vermelha{background:linear-gradient(180deg,#DC2626 0%,#B91C1C 54%,#7F1D1D 100%);border-color:#450A0A;box-shadow:inset 0 2px 1px rgba(254,202,202,.45),inset 0 -4px 6px rgba(40,0,0,.55),0 4px 0 #450A0A,0 5.5px 0 rgba(255,255,255,.6),0 8px 14px rgba(40,0,0,.35)}
.tecla[disabled]{opacity:.55;cursor:wait}
.tecla span{min-width:0}
.tecla span:has(> .ic){flex-shrink:0;min-width:auto;display:flex}

/* ── Ficha em 7 camadas ── */
.ficha{max-width:820px;margin:0 auto;background:var(--folha);border-radius:14px;overflow:hidden;box-shadow:0 2px 0 rgba(255,255,255,.7),0 8px 22px rgba(4,12,28,.28);border:2px solid #071633}
.c1{display:flex;justify-content:space-between;gap:10px;background:#091E42;color:#FFFFFF;padding:7px 10px;font-family:var(--f-tit);font-size:9.5px;font-weight:800;letter-spacing:.02em;text-transform:uppercase}
.c1 span{min-width:0}
.c1 b{white-space:nowrap}
.c2{padding:10px 10px 2px}
.c2 h1{font-family:var(--f-tit);font-weight:800;text-transform:uppercase;color:var(--navy);font-size:clamp(28px,8.6vw,56px);line-height:.96;letter-spacing:-.02em}
html[data-tema="lua"] .c2 h1{color:#FFFFFF}
.c2 p{font-family:var(--f-txt);font-style:italic;font-weight:600;font-size:clamp(14px,3.9vw,20px);line-height:1.3;color:var(--txt2);margin-top:6px}
.c3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 10px 10px}
.chip{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0;background:var(--cartao);border:1.5px solid var(--linha);border-radius:8px;padding:6px}
.chip .tile{width:36px;height:36px;flex-shrink:0;border-radius:6px;background:#FFFFFF;border:1px solid #E2E8F0;overflow:hidden}
.chip .tile img{width:100%;height:100%;object-fit:cover}
.chip .t{min-width:0;display:flex;flex-direction:column;line-height:1.15}
.chip .k{font-size:9px;font-weight:700;color:var(--txt3);letter-spacing:.03em;text-transform:uppercase}
.chip .v{font-size:10.5px;font-weight:800;color:var(--txt)}
.c4{margin:0 10px;background:#FFFFFF;border:1.5px solid var(--linha);border-radius:10px;overflow:hidden}
.ilustra{position:relative}
.ilustra img{width:100%;height:auto}
/* Diâmetro das bolinhas 01–05 nas artes 1672×941 (≈74 px = 4,5% da largura). */
.alvo{position:absolute;width:4.5%;aspect-ratio:1/1;transform:translate(-50%,-50%);border-radius:50%}
.alvo::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2.5px solid #0EA5E9;opacity:0;animation:pulso 1.8s ease-out infinite}
.alvo.sel::after{border-color:#F59E0B;opacity:1;animation:none;box-shadow:0 0 0 3px rgba(245,158,11,.45)}
@keyframes pulso{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.55)}}
.det{display:none;margin:8px 10px 0;border-radius:12px;background:#0F172A;color:#E2E8F0;padding:10px;font-size:13px;line-height:1.4}
.det.on{display:block;animation:surge .22s ease-out}
@keyframes surge{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
/* Lupa: recorte limpo da própria arte (260%), centrado entre a bolinha e a peça que a linha ciano aponta. Sem marcador por cima. */
.lupa{position:relative;width:100%;aspect-ratio:16/9;border-radius:9px;background-color:#FFFFFF;background-repeat:no-repeat;background-size:260% auto;border:2px solid #F59E0B;margin-bottom:9px}
.lupa span{position:absolute;left:6px;top:6px;font-family:var(--f-tit);font-size:11px;font-weight:800;color:#FFFFFF;background:#091E42;border-radius:6px;padding:2px 7px}
.det .cab{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px}
.det .cab .num{width:26px;height:26px;border-radius:50%;font-size:12.5px;flex-shrink:0}
.det .cab h4{font-family:var(--f-tit);font-size:15px;font-weight:800;color:#FFFFFF;line-height:1.25;min-width:0}
.det .exp{display:flex;gap:6px;align-items:flex-start;background:#14532D;color:#DCFCE7;border-radius:8px;padding:7px 9px;font-weight:600}
.det .liga{margin-top:8px;font-size:12.5px;color:#CBD5E1}
.det .liga b{color:#FFFFFF}
.det .teclas{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.det .teclas .tecla{height:46px;font-size:12.5px;justify-content:center;text-align:center}
.num{display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-tit);font-weight:800;color:#FFFFFF;background:#1D9BF0}
.c5{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 10px 0;align-items:start}
.c5 > section{min-width:0}
.bloco-h{background:#091E42;color:#FFFFFF;font-family:var(--f-tit);font-weight:800;font-size:10.5px;letter-spacing:.02em;text-transform:uppercase;padding:6px 7px;border-radius:4px 4px 0 0;line-height:1.15}
.causa{display:grid;grid-template-columns:20px 28px 1fr;align-items:start;gap:5px;width:100%;text-align:left;padding:6px 3px;border-bottom:1px solid var(--linha2);border-radius:5px;transition:background .2s}
.causa .num{width:20px;height:20px;border-radius:4px;font-size:10.5px;margin-top:1px}
.causa .ico{width:28px;height:28px;border-radius:5px;background:#FFFFFF;border:1px solid #E2E8F0;overflow:hidden}
.causa .ico img{width:100%;height:100%;object-fit:cover}
.causa .t{min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.causa .nm{font-family:var(--f-tit);font-weight:800;font-size:11px;color:var(--txt);line-height:1.2}
.pilula{font-family:var(--f-tit);font-size:8.5px;font-weight:800;letter-spacing:.03em;border-radius:999px;padding:1px 6px;border:1.5px solid;background:var(--cartao);white-space:nowrap}
.pilula.p1{border-color:#D97706;color:#D97706}
.pilula.p2{border-color:#334155;color:#334155}
.pilula.p3{border-color:#64748B;color:#64748B}
html[data-tema="lua"] .pilula.p2{border-color:#CBD5E1;color:#CBD5E1}
html[data-tema="lua"] .pilula.p3{border-color:#94A3B8;color:#94A3B8}
.causa.sel,.verif.sel{background:var(--sel)}
.causa.conf{background:#FEE2E2}
.causa.conf .num{background:#DC2626}
html[data-tema="lua"] .causa.conf{background:#4C1D1D}
.verif{position:relative;display:grid;grid-template-columns:22px 1fr;gap:6px;width:100%;text-align:left;padding:6px 3px;border-bottom:1px solid var(--linha2);border-radius:5px;transition:background .2s}
.verif .bol{position:relative;z-index:1;width:22px;height:22px;border-radius:50%;background:#1D9BF0;color:#FFFFFF;font-family:var(--f-tit);font-weight:800;font-size:10.5px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--folha)}
.verif.ok .bol{background:#16A34A}.verif.def .bol{background:#DC2626}
.verif:not(:last-child)::before{content:"";position:absolute;left:13px;top:28px;bottom:-8px;width:2px;background:#1D9BF0}
.verif .tt{display:block;font-family:var(--f-tit);font-weight:800;font-size:11px;color:var(--txt);line-height:1.2}
.verif .ln{display:flex;gap:4px;align-items:flex-start;font-size:10.5px;color:var(--txt2);margin-top:3px;line-height:1.3}
.c6{margin:10px 10px 0;border:1.5px solid var(--linha);border-radius:8px;overflow:hidden;background:var(--cartao)}
.c6 h3{background:var(--cab-claro);color:var(--navy);font-family:var(--f-tit);font-weight:800;font-size:16px;text-transform:uppercase;padding:6px 10px}
html[data-tema="lua"] .c6 h3{color:#FFFFFF}
.prox{display:grid;grid-template-columns:1fr 20px 1.15fr;align-items:center;gap:7px;width:100%;text-align:left;padding:8px 10px;border-top:1px solid var(--linha2);font-size:12.5px;line-height:1.3}
.prox .se{font-weight:700;color:var(--txt)}
.prox .se b{font-weight:800}
.prox .entao{color:var(--txt2)}
.prox .acao{display:block;font-size:11px;font-weight:800;color:#008A00;margin-top:2px}
.c7{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:center;margin:10px 10px 0;background:linear-gradient(180deg,#F07A12,#E2650A);border-radius:8px;padding:10px;color:#FFFFFF}
.c7 .tri{border-right:2px solid rgba(255,255,255,.45);padding-right:8px}
.c7 b{display:block;font-family:var(--f-tit);font-weight:800;font-size:14px;letter-spacing:.03em;text-transform:uppercase}
.c7 p{font-size:12.5px;font-weight:700;line-height:1.35;margin-top:2px}
.rodape{display:flex;justify-content:space-between;gap:10px;margin-top:10px;background:#091E42;color:#FFFFFF;padding:8px 10px;font-family:var(--f-tit);font-size:10.5px;font-weight:800;letter-spacing:.03em}
.rodape span{min-width:0}

/* ── Folhas (índice, causa, orçamento, bônus) ── */
.fundo{position:fixed;inset:0;background:rgba(9,30,66,.55);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.fundo.aberto{opacity:1;pointer-events:auto}
.folha{position:fixed;left:0;right:0;bottom:0;z-index:61;max-height:92dvh;overflow-y:auto;background:#FFFFFF;color:#0F172A;border-radius:18px 18px 0 0;transform:translateY(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-width:720px;margin:0 auto;padding:8px 14px calc(22px + env(safe-area-inset-bottom))}
.folha.aberto{transform:none}
.folha .alca{width:44px;height:5px;border-radius:3px;background:#CBD5E1;margin:2px auto 10px}
.folha .fechar{position:absolute;right:10px;top:8px;width:36px;height:36px;border-radius:50%;background:#F1F5F9;display:flex;align-items:center;justify-content:center}
.folha h3{font-family:var(--f-tit);font-size:19px;font-weight:800;color:#091E42;line-height:1.25;margin:0 44px 8px 0}
.folha h4{font-family:var(--f-tit);font-size:15px;font-weight:800;color:#091E42;margin:14px 0 6px}
.folha .sub{font-size:13px;color:#475569;margin-bottom:12px;line-height:1.4}
.folha .pilha{display:grid;gap:10px}
.folha .tecla{height:50px;font-size:14px;justify-content:center;text-align:center}
.folha .tecla.clara{background:#F1F5F9;color:#091E42;border:1.5px solid #CBD5E1;box-shadow:none}
.busca{display:flex;align-items:center;gap:8px;background:#FFFFFF;border:1.5px solid #CBD5E1;border-radius:12px;padding:0 12px;height:44px}
.busca input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:15px}
.blocos{display:flex;gap:6px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none}
.blocos::-webkit-scrollbar{display:none}
.blocos button{flex-shrink:0;padding:6px 11px;border-radius:999px;border:1px solid #CBD5E1;font-size:12.5px;font-weight:700;white-space:nowrap}
.blocos button[aria-pressed="true"]{background:#091E42;border-color:#091E42;color:#FFFFFF}
.grupo-h{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#475569;background:#F1F5F9;border-radius:6px;padding:5px 8px;margin-top:10px}
.item-ficha{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:center;width:100%;text-align:left;padding:8px 2px;border-bottom:1px solid #F1F5F9}
.item-ficha .ico{width:72px;height:41px;border-radius:8px;overflow:hidden;background:#FFFFFF;border:1px solid #E2E8F0}
.item-ficha .ico img{width:100%;height:100%;object-fit:cover}
.item-ficha .cod{font-family:var(--f-mono);font-size:10.5px;font-weight:800;color:#1D9BF0}
.item-ficha .nm{font-family:var(--f-tit);font-size:14.5px;font-weight:800;color:#0F172A;line-height:1.2}
.item-ficha .sb{font-size:12px;color:#64748B;line-height:1.3}
.item-ficha.atual{background:#E0F2FE;border-radius:10px}
.vazio{border:1px dashed #CBD5E1;border-radius:12px;padding:14px;text-align:center;font-size:14px;color:#334155}
.vazio .pilha{margin-top:10px}
.confirmada{border-radius:12px;background:#FEF2F2;border:2px solid #DC2626;padding:12px;margin-bottom:12px}
.confirmada .k{font-size:11px;font-weight:800;letter-spacing:.08em;color:#B91C1C}
.confirmada .v{font-family:var(--f-tit);font-size:17px;font-weight:800;color:#7F1D1D;margin-top:2px;line-height:1.25}

const proximoNumero = (gravar) => {

  const docs = lerJSON('gelopro.docs'); if (Array.isArray(docs)) docs.forEach(d => { const s = String(d && d.numero || ''); if (/^\d{1,9}$/.test(s)) n = Math.max(n, Number(s)); });

  if (gravar) guardar('gelopro.seq', String(n0));

};

const qrMatriz = (txt) => { try { if (!window.qrcode || !txt) return null; const q = window.qrcode(0, 'M'); q.addData(txt); q.make(); const n = q.getModuleCount(); return Array.from({ length: n }, (_, r) => Array.from({ length: n }, (_, c) => (q.isDark(r, c) ? '1' : '0')).join('')); } catch (e) { return null; } };

function desenharQr(cv, txt) {
  const M = qrMatriz(txt), x = cv.getContext('2d'); if (!M) { cv.width = cv.height = 1; return; }
  const n = M.length, e = 4; cv.width = cv.height = n + e * 2; x.fillStyle = '#FFFFFF'; x.fillRect(0, 0, n + e * 2, n + e * 2); x.fillStyle = '#091E42';
  M.forEach((lin, r) => [...lin].forEach((b, c) => { if (b === '1') x.fillRect(c + e, r + e, 1, 1); }));
}
function painelAssinatura(cv, aoMudar) {
  let ult = null, assinado = false;
  requestAnimationFrame(() => { const r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1; cv.width = r.width * d; cv.height = r.height * d; const c = cv.getContext('2d'); c.scale(d, d); c.lineWidth = 2.4; c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = '#091E42'; });
  const pos = (e) => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  cv.addEventListener('pointerdown', (e) => { cv.setPointerCapture(e.pointerId); ult = pos(e); const d = cv.parentNode.querySelector('.dica'); if (d) d.style.display = 'none'; });
  cv.addEventListener('pointermove', (e) => { if (!ult) return; const c = cv.getContext('2d'), q = pos(e); c.beginPath(); c.moveTo(ult[0], ult[1]); c.lineTo(q[0], q[1]); c.stroke(); ult = q; assinado = true; });
  const soltar = () => { if (ult) { ult = null; aoMudar && aoMudar(); } };
  cv.addEventListener('pointerup', soltar); cv.addEventListener('pointercancel', soltar);
  return { limpar: () => { cv.getContext('2d').clearRect(0, 0, cv.width, cv.height); assinado = false; const d = cv.parentNode.querySelector('.dica'); if (d) d.style.display = ''; }, imagem: () => assinado ? cv.toDataURL('image/png') : null };
}

// ───────────── Moldura: ícones, tema e dock ─────────────
$('#sel-seta').innerHTML = ic('baixo', '#67C6FF', 18); $('#ic-voltar').innerHTML = ic('esquerda', '#FFFFFF', 18);
$('#ic-sol').innerHTML = ic('sol', '#F5B800', 14); $('#ic-lua').innerHTML = ic('lua', '#CBD5E1', 14);
$('#ic-d1').innerHTML = ic('lista', '#FFFFFF', 20); $('#ic-d2').innerHTML = ic('presente', '#FFFFFF', 20); $('#ic-d3').innerHTML = ic('doc', '#FFFFFF', 20);
const aplicarTema = (t) => { document.documentElement.dataset.tema = t; guardar('guiapro.tema', t); };
aplicarTema(ler('guiapro.tema') === 'lua' ? 'lua' : 'sol');
$('#b-tema').addEventListener('click', () => aplicarTema(document.documentElement.dataset.tema === 'lua' ? 'sol' : 'lua'));
$('#b-voltar').addEventListener('click', () => { if (EMBED) window.parent.postMessage({ gelopro: 'fechar' }, location.origin === 'null' ? '*' : location.origin); });
$('#b-ficha').addEventListener('click', abrirIndice);
$('#d-indice').addEventListener('click', abrirIndice);
$('#d-bonus').addEventListener('click', abrirMenuBonus);
$('#d-orcar').addEventListener('click', () => abrirOrcamento(servicoAtual()));

// Início: #D-001 (padrão) ou o código de qualquer uma das 14 fichas no endereço (#D-040, #S-04…).
function iniciar() { const m = location.hash.match(/[DS]-\d{2,3}/); const i = m ? F.findIndex(f => f.id === m[0]) : 0; montarFicha(i >= 0 ? i : 0); }
window.addEventListener('hashchange', iniciar);
iniciar();
</script>
