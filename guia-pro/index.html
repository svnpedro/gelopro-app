<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#091e42">
<title>GeloPRO · Guia Pro — Comparativo de Entrada</title>
<!--
  Guia Pro (v01-polo): Prancha de Diagnóstico Interativa dentro da moldura oficial do app GeloPRO
  (topo fixo 52px + corpo rolável com chassi de 8px + dock fixo 60px) e 3 variações de entrada (V1 · V2 · V3).
  Arquivo isolado: lê imagens de ../app/imagens/cenas/ e ../app/marca/ sem alterar nada de ../app/.
  Nenhum equipamento desenhado em SVG: os pontos ①②③ usam as cenas reais .webp (pares Normal ✓ × Defeito ✗).
  Imagem principal opcional: se existir guia-pro/imagens/prancha_NN.webp (ou .png), ela assume o quadro principal.
-->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#091E42;color:#0F172A;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid #67C6FF;outline-offset:2px}
img{display:block;max-width:100%}

/* ── Moldura do app: topo 52px · corpo rolável · dock 60px ── */
#topo{position:fixed;top:0;left:0;right:0;height:52px;z-index:40;display:flex;align-items:center;gap:5px;padding:0 6px;background:linear-gradient(180deg,#0E2A57 0%,#091E42 100%);color:#FFFFFF}
#topo::after,#dock::before{content:"";position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,#8E959E 0%,#F3F4F6 30%,#D4D4D4 55%,#F8FAFC 75%,#8E959E 100%)}
#topo::after{bottom:0}
#dock::before{top:0}
.cracha{display:flex;align-items:center;gap:6px;flex-shrink:0}
.cracha img.mascote{width:30px;height:30px;border-radius:9px;background:#0A182D;border:1.5px solid #D4D4D4;padding:1px}
.cracha img.wordmark{height:17px;width:auto;display:none}
.indice{flex-shrink:0;height:34px;padding:0 6px;border-radius:8px;background:#19365C;border:1px solid #24466F;font-size:10.5px;font-weight:800;line-height:1.1;text-align:center}
.seletor{flex:1;min-width:0;display:flex;align-items:center;gap:2px;height:36px;background:#0A182D;border:1px solid #24466F;border-radius:10px;padding:0 2px}
.seletor .seta{flex-shrink:0;width:22px;height:30px;border-radius:7px;font-size:18px;font-weight:800;color:#67C6FF;line-height:1}
.seletor .atual{flex:1;min-width:0;height:34px;display:flex;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:800;line-height:1.15;padding:0 1px;text-align:center}
.seletor .atual span{overflow:hidden;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.seletor .atual b{color:#67C6FF;flex-shrink:0}
.variacoes{flex-shrink:0;display:flex;background:#0A182D;border:1px solid #24466F;border-radius:8px;padding:2px}
.variacoes button{width:22px;height:26px;border-radius:6px;font-size:11px;font-weight:900;color:#94A3B8}
.variacoes button[aria-pressed="true"]{background:linear-gradient(180deg,#F8FAFC,#D4D4D4);color:#091E42}
#corpo{position:fixed;top:52px;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom));z-index:10;background:#E9EEF5;border-left:8px solid #D4D4D4;border-right:8px solid #D4D4D4;box-shadow:inset 1px 0 0 #A3A3A3,inset -1px 0 0 #A3A3A3;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#dock{position:fixed;left:0;right:0;bottom:0;z-index:40;height:calc(60px + env(safe-area-inset-bottom));padding:7px 8px calc(6px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:6px;background:linear-gradient(180deg,#0E2A57 0%,#091E42 100%)}
.doc{display:flex;align-items:center;justify-content:center;gap:5px;border-radius:11px;background:#19365C;border:1px solid #24466F;color:#FFFFFF;font-size:11.5px;font-weight:800;line-height:1.15;text-align:left;padding:0 6px;min-width:0}
.doc .ic{font-size:17px;flex-shrink:0}
.doc span:last-child{min-width:0}
.doc.verde{background:linear-gradient(180deg,#1ED41E 0%,#00B100 55%,#009A00 100%);border:1px solid #007A00;box-shadow:0 3px 0 #006400,inset 0 1px 0 rgba(255,255,255,.45);text-shadow:0 1px 0 rgba(0,0,0,.25);transform:translateY(-2px)}
.doc.verde:active{transform:translateY(0);box-shadow:0 1px 0 #006400,inset 0 1px 0 rgba(255,255,255,.35)}

/* ── V1: Painel de bancada (grade com miniatura real) ── */
.v-topo{padding:10px 10px 6px;background:#F4F6F9;border-bottom:1px solid #E2E8F0;position:sticky;top:0;z-index:4}
.busca{display:flex;align-items:center;gap:8px;background:#FFFFFF;border:1.5px solid #CBD5E1;border-radius:12px;padding:0 12px;height:44px}
.busca:focus-within{border-color:#091E42}
.busca input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:15px}
.pilulas{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.pilulas::-webkit-scrollbar{display:none}
.pilula{flex-shrink:0;padding:7px 11px;border-radius:999px;background:#FFFFFF;border:1px solid #CBD5E1;font-size:12.5px;font-weight:700;color:#334155;white-space:nowrap}
.pilula[aria-pressed="true"]{background:#091E42;border-color:#091E42;color:#FFFFFF}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:10px 10px 24px;background:#F4F6F9}
.cartao{background:#FFFFFF;border:1px solid #E2E8F0;border-radius:14px;overflow:hidden;text-align:left;display:flex;flex-direction:column;box-shadow:0 1px 2px rgba(15,23,42,.05)}
.cartao:active{transform:scale(.985)}
.cartao .mini{position:relative;aspect-ratio:1/1;background:#F8FAFC;overflow:hidden}
.cartao .mini img{width:100%;height:100%;object-fit:cover}
.cartao .mini .pct{position:absolute;right:6px;bottom:6px;background:#E11D48;color:#FFFFFF;font-size:12px;font-weight:900;border-radius:7px;padding:3px 6px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.cartao .corpo{padding:8px 10px 10px;display:flex;flex-direction:column;flex:1;gap:6px}
.cartao .num{font-size:10.5px;font-weight:900;color:#64748B;letter-spacing:.06em}
.cartao h3{font-size:13.5px;line-height:1.25;color:#091E42}
.barra-mini{display:flex;height:7px;border-radius:4px;overflow:hidden;background:#E2E8F0;margin-top:auto}
.legenda-mini{font-size:11px;color:#475569;line-height:1.3}
.vazio{grid-column:1/-1;background:#FFFFFF;border:1px dashed #CBD5E1;border-radius:14px;padding:16px;text-align:center;color:#334155;font-size:14px}
.vazio .acoes{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}

/* ── V3: Lista escaneável ── */
.bonus-linha{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.bonus-linha::-webkit-scrollbar{display:none}
.bonus-linha button{flex-shrink:0;font-size:12px;font-weight:800;color:#92400E;background:#FEF3C7;border:1px solid #FDE68A;border-radius:8px;padding:6px 9px;white-space:nowrap}
.grupo h4{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#475569;padding:7px 12px;background:#F1F5F9;border-top:1px solid #E2E8F0}
.lista-v3{background:#FFFFFF;padding-bottom:20px}
.linha-item{display:grid;grid-template-columns:52px 1fr 14px;gap:3px 10px;align-items:center;width:100%;text-align:left;padding:9px 12px;border-bottom:1px solid #F1F5F9;background:#FFFFFF}
.linha-item:active{background:#F1F5F9}
.linha-item .foto{grid-row:1/3;width:52px;height:52px;border-radius:10px;overflow:hidden;position:relative;background:#F1F5F9}
.linha-item .foto img{width:100%;height:100%;object-fit:cover}
.linha-item .foto b{position:absolute;left:3px;top:3px;background:#091E42;color:#FFFFFF;font-size:10px;border-radius:5px;padding:1px 4px}
.linha-item .t{font-size:14px;font-weight:800;color:#0F172A;line-height:1.25;min-width:0}
.linha-item .m{grid-column:2/4;display:flex;gap:5px;flex-wrap:wrap;font-size:11px}
.linha-item .seta{grid-row:1;grid-column:3;color:#94A3B8;font-size:18px}
.etq{display:inline-flex;align-items:center;gap:3px;border-radius:5px;padding:2px 6px;font-weight:800;white-space:nowrap}
.etq.c1{background:#FFE4E6;color:#9F1239}
.etq.t{background:#FEF3C7;color:#92400E}
.etq.i{background:#E0F2FE;color:#075985}

/* ── Prancha de Diagnóstico Limpa ── */
.prancha{max-width:900px;margin:0 auto;padding:8px 6px 22px}
.p-cab{background:#091E42;color:#FFFFFF;border-radius:14px 14px 0 0;padding:11px 13px}
.p-etq{font-size:10.5px;font-weight:900;letter-spacing:.08em;color:#67C6FF}
.p-cab h2{font-size:20px;line-height:1.2;margin-top:3px;letter-spacing:-.01em}
.p-alerta{display:flex;gap:7px;align-items:flex-start;background:#FEF3C7;color:#78350F;font-size:12.5px;line-height:1.35;font-weight:600;padding:8px 12px;border-left:4px solid #F59E0B}
.p-folha{background:#FFFFFF;border-radius:0 0 14px 14px;box-shadow:0 2px 10px rgba(9,30,66,.08);overflow:hidden}
.p-sec{padding:11px 12px}
.p-tit{font-size:10.5px;font-weight:900;letter-spacing:.08em;color:#64748B;text-transform:uppercase;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.p-tit em{font-style:normal;font-weight:600;letter-spacing:0;text-transform:none;color:#94A3B8;font-size:11.5px}
.prob{display:grid;gap:6px}
.prob button{display:grid;grid-template-columns:50px 1fr;align-items:center;gap:8px;text-align:left;padding:6px 8px;border-radius:10px;border:1.5px solid #E2E8F0;background:#FFFFFF;transition:border-color .2s,background .2s}
.prob .pct{font-size:20px;font-weight:900;letter-spacing:-.02em}
.prob .lado{min-width:0}
.prob .nome{font-size:12px;font-weight:900;letter-spacing:.03em;color:#0F172A;display:flex;justify-content:space-between;gap:6px}
.prob .nome small{font-weight:800;color:#64748B;letter-spacing:0;white-space:nowrap}
.prob .trilho{height:10px;border-radius:5px;background:#EEF2F6;margin-top:4px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(15,23,42,.12)}
.prob .trilho i{display:block;height:100%;border-radius:5px}
.prob button.ativo{border-color:#091E42;background:#F8FAFC}

/* Painel visual de 3 pontos (cenas reais) */
.painel{padding:0 12px 12px}
.painel-grade{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:6px}
.painel.com-heroi .painel-grade{grid-template-columns:repeat(3,1fr);grid-template-rows:auto}
.heroi{display:none;border-radius:12px;overflow:hidden;margin-bottom:6px;border:1px solid #CBD5E1;background:#F8FAFC}
.painel.com-heroi .heroi{display:block}
.heroi img{width:100%;height:auto}
.quadro{position:relative;border-radius:12px;overflow:hidden;background:#F8FAFC;border:2px solid #CBD5E1;aspect-ratio:1/1;text-align:left;transition:border-color .2s,box-shadow .2s}
.quadro.principal{grid-row:1/3}
.painel.com-heroi .quadro.principal{grid-row:auto}
.quadro img{width:100%;height:100%;object-fit:cover}
.quadro.sel{border-color:#F59E0B;box-shadow:0 0 0 3px rgba(245,158,11,.35)}
.selo{position:absolute;right:6px;top:16%;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;color:#FFFFFF;background:radial-gradient(circle at 35% 30%,#24466F 0%,#091E42 70%);border:2.5px solid #F59E0B;box-shadow:0 0 0 2px #D4D4D4,0 2px 6px rgba(0,0,0,.35)}
.quadro.sel .selo{animation:pulso 1.6s ease-out infinite}
@keyframes pulso{0%{box-shadow:0 0 0 2px #D4D4D4,0 0 0 0 rgba(245,158,11,.7)}100%{box-shadow:0 0 0 2px #D4D4D4,0 0 0 12px rgba(245,158,11,0)}}
.legenda{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:5px;padding:18px 7px 6px;background:linear-gradient(180deg,rgba(9,30,66,0) 0%,rgba(9,30,66,.9) 40%);color:#FFFFFF}
.legenda .linha1{display:flex;justify-content:space-between;align-items:center;gap:6px;min-width:0}
.legenda .nm{min-width:0;font-size:11.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.visor{flex-shrink:0;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12px;font-weight:800;color:#0F172A;background:#C7F0D2;border:2px solid #1F2937;border-radius:6px;padding:2px 6px;white-space:nowrap;box-shadow:inset 0 1px 2px rgba(0,0,0,.2)}
.quadro:not(.principal) .linha1{display:none}
.painel.com-heroi .quadro .linha1{display:none!important}
.quadro:not(.principal) .legenda .nm{font-size:10.5px}
.estado{flex-shrink:0;font-size:10.5px;font-weight:900;border-radius:6px;padding:2px 6px;color:#FFFFFF;white-space:nowrap}
.estado.ok{background:#15803D}.estado.def{background:#DC2626}
.detalhe{margin-top:8px;border-radius:12px;background:#0F172A;color:#E2E8F0;padding:11px 12px;font-size:13px;line-height:1.4}
.detalhe .cab{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.detalhe .cab .n{width:24px;height:24px;border-radius:50%;background:#F59E0B;color:#0F172A;font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.detalhe .cab h5{font-size:14.5px;color:#FFFFFF;flex:1 1 140px;min-width:0;overflow-wrap:anywhere}
.alterna{display:flex;background:#1E293B;border-radius:8px;padding:2px;flex-shrink:0}
.alterna button{font-size:11.5px;font-weight:800;padding:5px 8px;border-radius:6px;color:#94A3B8;white-space:nowrap}
.alterna button[aria-pressed="true"].ok{background:#15803D;color:#FFFFFF}
.alterna button[aria-pressed="true"].def{background:#DC2626;color:#FFFFFF}
.detalhe dl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px}
.detalhe dt{font-weight:900;white-space:nowrap}
.detalhe dd{min-width:0}
.detalhe .esperado{margin-top:8px;background:#14532D;color:#DCFCE7;border-radius:8px;padding:7px 9px;font-weight:700}
.detalhe .rodape{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:7px;flex-wrap:wrap}
.detalhe .fonte{font-size:11px;color:#94A3B8;min-width:0}
.detalhe .ir{font-weight:900;color:#67C6FF;font-size:12.5px;white-space:nowrap}

/* Passos */
.passos{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:9px}
.passo{border:1.5px solid #E2E8F0;border-radius:13px;padding:10px 11px;background:#FFFFFF;display:flex;flex-direction:column;gap:7px;transition:border-color .25s,box-shadow .25s}
.passo.foco{border-color:#091E42;box-shadow:0 0 0 3px #BFDBFE}
.passo.flash{animation:flash 1.1s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 0 #F59E0B}40%{box-shadow:0 0 0 7px rgba(245,158,11,.55)}100%{box-shadow:0 0 0 3px #BFDBFE}}
.passo.ok{border-color:#16A34A;background:#F0FDF4}
.passo.def{border-color:#DC2626;background:#FEF2F2}
.passo .topo{display:flex;align-items:center;gap:8px}
.passo .bol{width:26px;height:26px;border-radius:50%;background:#091E42;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;flex-shrink:0}
.passo.ok .bol{background:#16A34A}.passo.def .bol{background:#DC2626}
.passo h6{font-size:14px;line-height:1.2;color:#091E42;min-width:0}
.passo p{font-size:12.5px;line-height:1.38;color:#334155}
.passo .ref{font-size:12px;background:#F1F5F9;border-radius:8px;padding:6px 8px;color:#0F172A}
.passo .ref b{color:#166534}
.passo .ver{font-size:12px;font-weight:800;color:#0369A1;text-align:left}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:auto}
.btn-ok,.btn-def{border-radius:10px;padding:8px 7px;font-size:12.5px;font-weight:900;line-height:1.2;text-align:center;min-height:54px;color:#FFFFFF}
.btn-ok{background:#15803D}.btn-def{background:#DC2626}
.btn-ok small,.btn-def small{display:block;font-weight:600;font-size:11px;opacity:.95;margin-top:2px}
.erro-caro{margin:2px 12px 14px;border:2px solid #DC2626;background:#FEF2F2;border-radius:12px;padding:10px 12px;color:#7F1D1D;font-size:13px;line-height:1.4}
.erro-caro b{display:block;color:#B91C1C;font-size:12.5px;letter-spacing:.04em;margin-bottom:3px}

/* ── Botões, gaveta e modal ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:12px 14px;font-weight:800;font-size:14.5px;line-height:1.2;text-align:center}
.btn.verde{background:#00B100;color:#FFFFFF;box-shadow:0 3px 0 #006400}
.btn.marinho{background:#091E42;color:#FFFFFF}
.btn.claro{background:#F1F5F9;color:#091E42;border:1px solid #CBD5E1}
.btn.cheio{width:100%}
.fundo{position:fixed;inset:0;background:rgba(9,30,66,.5);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.fundo.aberto{opacity:1;pointer-events:auto}
.folha-baixo{position:fixed;left:0;right:0;bottom:0;z-index:61;max-height:88dvh;overflow-y:auto;background:#FFFFFF;border-radius:18px 18px 0 0;transform:translateY(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-width:640px;margin:0 auto;padding:6px 14px calc(20px + env(safe-area-inset-bottom))}
.folha-baixo.aberto{transform:none}
.folha-baixo .alca{width:44px;height:5px;border-radius:3px;background:#CBD5E1;margin:4px auto 10px}
.folha-baixo .fechar{position:absolute;right:10px;top:8px;width:36px;height:36px;border-radius:50%;background:#F1F5F9;font-size:18px;font-weight:800;color:#334155}
.folha-baixo h3{font-size:18.5px;color:#091E42;line-height:1.25;margin:0 42px 8px 0}
.folha-baixo .sub{font-size:13px;color:#475569;margin-bottom:12px;line-height:1.4}
#gaveta .lista{margin:0 -14px}
.confirmada{border-radius:14px;background:#FEF2F2;border:2px solid #DC2626;padding:12px;margin-bottom:12px}
.confirmada .k{font-size:11px;font-weight:900;letter-spacing:.08em;color:#B91C1C}
.confirmada .v{font-size:17px;font-weight:800;color:#7F1D1D;margin-top:2px;line-height:1.25}
.servico{border:1px solid #E2E8F0;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13.5px;line-height:1.4}
.servico .faixa{display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-weight:800;color:#091E42;flex-wrap:wrap}
.servico .ref{font-size:11.5px;color:#64748B;margin-top:4px}
.pilha{display:grid;gap:8px}
.form{display:grid;gap:10px;margin:6px 0 12px}
.form label{display:grid;gap:4px;font-size:13px;font-weight:700;color:#334155}
.form input[type=number],.form select,.form input[type=text]{height:46px;border:1.5px solid #CBD5E1;border-radius:10px;padding:0 12px;font-size:16px;background:#FFFFFF;width:100%;min-width:0}
.form .chk{display:flex;align-items:center;gap:10px;font-weight:600;border:1px solid #E2E8F0;border-radius:10px;padding:10px 12px}
.form .chk input{width:22px;height:22px;flex-shrink:0}
.veredito{border-radius:12px;padding:11px 12px;font-weight:800;font-size:15px;line-height:1.3;margin-bottom:12px}
.veredito.ok{background:#DCFCE7;color:#14532D}.veredito.def{background:#FEE2E2;color:#7F1D1D}.veredito.neutro{background:#F1F5F9;color:#334155}
.veredito small{display:block;font-weight:600;font-size:12.5px;margin-top:3px}
.tabela{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:12px}
.tabela th,.tabela td{text-align:left;padding:7px 6px;border-bottom:1px solid #E2E8F0;vertical-align:top}
.tabela th{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:#64748B}
.tabela td.f{color:#64748B;font-size:11px;white-space:nowrap}
.menu-bonus{display:grid;gap:8px}

// ───────────── Utilidades ─────────────
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (t) => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const norm = (t) => String(t).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const brl = (v) => 'R$ ' + Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const guardar = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const ler = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const corpo = $('#corpo');

// Estado global: variação (V1/V2/V3), prancha atual e o defeito confirmado em cada prancha (preenche o Orçar Reparo do dock).
const S = { v: 1, idx: 0, aberta: false, defeito: {} };
const servicoAtual = () => { const p = P[S.idx]; if (S.defeito[p.id]) return S.defeito[p.id]; const pt = p.prob[0][2]; return p.passos.find(s => s.ponto === pt).servico; };

// Imagem principal opcional (pacote GPT): guia-pro/imagens/prancha_NN.webp ou .png. Cacheia o resultado da tentativa.
const HEROI = {};
function procurarHeroi(id, cb) {
  if (id in HEROI) return cb(HEROI[id]);
  const tentar = (exts) => { if (!exts.length) { HEROI[id] = null; return cb(null); }
    const src = `imagens/prancha_${id}.${exts[0]}`, im = new Image();
    im.onload = () => { HEROI[id] = src; cb(src); }; im.onerror = () => tentar(exts.slice(1)); im.src = src; };
  tentar(['webp', 'png']);
}

// ───────────── Prancha de Diagnóstico Limpa ─────────────
function montarPrancha(idx) {
  const p = P[idx];
  const est = { passos: p.passos.map(() => 'pend'), ponto: p.prob[0][2], lado: 0 };
  const quadro = (pt) => `<button class="quadro" data-n="${pt.n}" aria-label="Ponto ${pt.n}: ${esc(pt.nome)}">
      <img src="${CENA(pt.img[0])}" alt="${esc(pt.nome)}" loading="lazy" decoding="async">
      <span class="selo">${pt.n}</span>
      <span class="legenda"><span class="linha1"><span class="estado ok">✓ NORMAL</span><span class="visor">${esc(pt.visor)}</span></span><span class="nm">${CIRC[pt.n - 1]} ${esc(pt.nome)}</span></span></button>`;
  corpo.innerHTML = `<article class="prancha" data-prancha="${p.id}" ${p.calibrar ? 'data-calibrar="1"' : ''}>
    <div class="p-cab"><div class="p-etq">DIAGNÓSTICO #${p.id} · ${p.area}</div><h2>${esc(p.titulo)}</h2></div>
    <div class="p-folha">
      <div class="p-alerta"><span aria-hidden="true">⚡</span><span>${esc(p.alerta)}</span></div>
      <div class="p-sec">
        <div class="p-tit">Onde está o defeito <em>toque na barra</em></div>
        <div class="prob">${p.prob.map((b, i) => `<button data-ponto="${b[2]}" aria-label="${b[0]}% ${esc(b[1])}">
          <span class="pct" style="color:${COR_PROB[i]}">${b[0]}%</span>
          <span class="lado"><span class="nome">${esc(b[1])}<small>${CIRC[b[2] - 1]} Passo ${p.passos.findIndex(s => s.ponto === b[2]) + 1}</small></span><span class="trilho"><i style="width:${b[0]}%;background:${COR_PROB[i]}"></i></span></span></button>`).join('')}</div>
      </div>
      <div class="painel" data-img-slot="prancha-${p.id}">
        <div class="p-tit">Os 3 pontos de medição <em>toque no quadro</em></div>
        <div class="heroi"></div>
        <div class="painel-grade">${p.pontos.map(quadro).join('')}</div>
        <div class="detalhe"></div>
      </div>
      <div class="p-sec">
        <div class="p-tit">Passo a passo · se der isso, faz aquilo <em>${esc(p.instr)} · ⚡ ${p.tempo}</em></div>
        <div class="passos">${p.passos.map((s, i) => `<section class="passo${i === 0 ? ' foco' : ''}" data-i="${i}">
            <div class="topo"><span class="bol">${i + 1}</span><h6>${esc(s.titulo)}</h6></div>
            <p>${esc(s.como)}</p>
            <div class="ref">Normal: <b>${esc(p.pontos[s.ponto - 1].esperado)}</b></div>
            <button class="ver" data-ponto="${s.ponto}">${CIRC[s.ponto - 1]} Ver o ponto na foto ›</button>
            <div class="dupla"><button class="btn-ok">✓ Normal<small>(${esc(s.normal)})</small></button><button class="btn-def">✗ Defeito<small>(${esc(s.defeito)})</small></button></div>
          </section>`).join('')}</div>
      </div>
      <div class="erro-caro"><b>🛑 ERRO CARO A EVITAR</b>${esc(p.erro)}</div>
    </div></article>`;
  corpo.scrollTop = 0;
  const painel = $('.painel', corpo), grade = $('.painel-grade', corpo), det = $('.detalhe', corpo);

  procurarHeroi(p.id, (src) => { if (!src || !painel.isConnected) return; $('.heroi', painel).innerHTML = `<img src="${src}" alt="Prancha ${p.id}">`; painel.classList.add('com-heroi'); });

  const pintarDetalhe = () => {
    const pt = p.pontos[est.ponto - 1], iP = p.passos.findIndex(s => s.ponto === pt.n);
    det.innerHTML = `<div class="cab"><span class="n">${pt.n}</span><h5>${esc(pt.nome)}</h5>
        <div class="alterna" role="group" aria-label="Ver normal ou defeito"><button class="ok" data-l="0" aria-pressed="${est.lado === 0}">✓ Normal</button><button class="def" data-l="1" aria-pressed="${est.lado === 1}">✗ Defeito</button></div></div>
      <dl>${pt.vermelho ? `<dt style="color:#F87171">● VERMELHA</dt><dd>${esc(pt.vermelho)}</dd><dt style="color:#E5E7EB">● PRETA</dt><dd>${esc(pt.preto)}</dd>` : `<dt style="color:#67C6FF">Onde</dt><dd>${esc(pt.onde)}</dd>`}<dt style="color:#94A3B8">Escala</dt><dd>${esc(pt.escala)}</dd></dl>
      <div class="esperado">Leitura esperada: ${esc(pt.esperado)}</div>
      <div class="rodape"><span class="fonte">Fonte: ${esc(pt.fonte)}</span><button class="ir" data-passo="${iP}">Ir ao Passo ${iP + 1} ↓</button></div>`;
    $$('.alterna button', det).forEach(b => b.addEventListener('click', () => { est.lado = +b.dataset.l; pintarQuadros(); pintarDetalhe(); }));
    $('.ir', det).addEventListener('click', () => destacarPasso(iP, true));
  };
  const pintarQuadros = () => {
    // O ponto escolhido vira o quadro principal (primeiro da grade); a foto alterna Normal ✓ / Defeito ✗.
    const ordem = [est.ponto, ...[1, 2, 3].filter(n => n !== est.ponto)];
    ordem.forEach(n => grade.appendChild($(`.quadro[data-n="${n}"]`, grade)));
    $$('.quadro', grade).forEach(q => {
      const n = +q.dataset.n, pt = p.pontos[n - 1], sel = n === est.ponto, lado = sel ? est.lado : 0;
      q.classList.toggle('principal', sel); q.classList.toggle('sel', sel);
      const img = $('img', q), alvo = CENA(pt.img[lado]); if (!img.src.endsWith(alvo.slice(2))) img.src = alvo;
      const e = $('.estado', q); e.className = 'estado ' + (lado ? 'def' : 'ok'); e.textContent = lado ? '✗ DEFEITO' : '✓ NORMAL';
    });
    $$('.prob button', corpo).forEach(b => b.classList.toggle('ativo', +b.dataset.ponto === est.ponto));
  };
  const selecionar = (n, lado = 0) => { est.ponto = n; est.lado = lado; pintarQuadros(); pintarDetalhe(); };
  const destacarPasso = (i, rolar) => {
    $$('.passo', corpo).forEach((c, k) => c.classList.toggle('foco', k === i));
    const c = $$('.passo', corpo)[i]; if (!c) return;
    c.classList.remove('flash'); void c.offsetWidth; c.classList.add('flash');
    if (rolar) setTimeout(() => c.scrollIntoView({ behavior: 'smooth', block: 'center' }), 450);
  };
  const marcar = (i, st) => { est.passos[i] = st; const c = $$('.passo', corpo)[i]; c.classList.remove('ok', 'def'); c.classList.add(st); $('.bol', c).textContent = st === 'ok' ? '✓' : '✗'; };

  $$('.quadro', grade).forEach(q => q.addEventListener('click', () => selecionar(+q.dataset.n, +q.dataset.n === est.ponto ? est.lado : 0)));
  $$('.prob button', corpo).forEach(b => b.addEventListener('click', () => { const n = +b.dataset.ponto; selecionar(n); destacarPasso(p.passos.findIndex(s => s.ponto === n), true); }));
  $$('.passo', corpo).forEach((c, i) => {
    const s = p.passos[i];
    $('.ver', c).addEventListener('click', () => { selecionar(s.ponto); painel.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
    $('.btn-ok', c).addEventListener('click', () => { marcar(i, 'ok'); if (i + 1 < p.passos.length) { selecionar(p.passos[i + 1].ponto); destacarPasso(i + 1, true); } else abrirFim(p); });
    $('.btn-def', c).addEventListener('click', () => { marcar(i, 'def'); selecionar(s.ponto, 1); S.defeito[p.id] = s.servico; abrirCausa(p, i); });
  });
  selecionar(est.ponto);
}

// ───────────── Folhas (gaveta e modal) ─────────────
const fundo = $('#fundo'), modal = $('#modal'), gaveta = $('#gaveta');
const fecharTudo = () => { [modal, gaveta].forEach(f => f.classList.remove('aberto')); fundo.classList.remove('aberto'); };
function abrirFolha(el, html, depois) {
  [modal, gaveta].forEach(f => f !== el && f.classList.remove('aberto'));
  el.innerHTML = `<div class="alca"></div><button class="fechar" aria-label="Fechar">×</button>${html}`;
  el.classList.add('aberto'); fundo.classList.add('aberto'); el.scrollTop = 0;
  $('.fechar', el).addEventListener('click', fecharTudo);
  if (depois) depois(el);
}
const abrirModal = (html, depois) => abrirFolha(modal, html, depois);
fundo.addEventListener('click', fecharTudo);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') fecharTudo(); });

const blocoServico = (id) => { const s = PRECOS[id]; return `<div class="servico"><b>${esc(s[0])}</b><div class="faixa"><span>Faixa: ${brl(s[1])} a ${brl(s[3])}</span><span>Típico: ${brl(s[2])}</span></div><div class="ref">Tabela de preços GeloPro 2026 · referência de campo</div></div>`; };
function abrirCausa(p, i) {
  const s = p.passos[i];
  abrirModal(`<h3>Causa Confirmada</h3>
    <div class="confirmada"><div class="k">DIAGNÓSTICO #${p.id} · PASSO ${i + 1}</div><div class="v">${esc(s.causa)}</div></div>
    ${blocoServico(s.servico)}
    <div class="pilha"><button class="btn verde cheio" data-a="orc">📄 Gerar Orçamento PDF Nº 1001 com Pix</button><button class="btn marinho cheio" data-a="afer">🧮 Abrir Aferidor Vivo deste componente</button><button class="btn claro cheio" data-a="voltar">Voltar à prancha</button></div>`, (m) => {
    $('[data-a=orc]', m).addEventListener('click', () => abrirOrcamento(s.servico, p));
    $('[data-a=afer]', m).addEventListener('click', () => abrirAferidor(p, i));
    $('[data-a=voltar]', m).addEventListener('click', fecharTudo);
  });
}
function abrirFim(p) {
  const prox = P[(P.indexOf(p) + 1) % P.length];
  abrirModal(`<h3>Os 3 pontos deram normal</h3><div class="sub">A prancha #${p.id} descartou as 3 causas mais frequentes. Feche a visita com o diagnóstico instrumentado e siga para o sintoma vizinho.</div>
    ${blocoServico('visita_diag')}
    <div class="pilha"><button class="btn verde cheio" data-a="orc">📄 Gerar Orçamento PDF Nº 1001 com Pix</button><button class="btn marinho cheio" data-a="prox">Abrir #${prox.id}: ${esc(prox.curto)} ›</button><button class="btn claro cheio" data-a="cod">Conferir Códigos de Erro (Bônus 2)</button></div>`, (m) => {
    $('[data-a=orc]', m).addEventListener('click', () => abrirOrcamento('visita_diag', p));
    $('[data-a=prox]', m).addEventListener('click', () => { fecharTudo(); abrirPrancha(P.indexOf(prox)); });
    $('[data-a=cod]', m).addEventListener('click', () => abrirBonus(1));
  });
}

// ───────────── Aferidores vivos ─────────────
// Faixas com fonte: tensão ±10% e SH/ΔT (F14 Elgin), P-N (F20 Midea), NTC (F18/F24/F26), capacitor −5% (regra do Pedro).
const NTC_OPS = [['Samsung 10K (±2%)', 10, 2], ['Midea/Springer/Carrier 10K (±3%)', 10, 3], ['Daikin 10K (9,90 a 10,10 kΩ)', 10, 1]];
const AFERIDORES = {
  tensao: { tit: 'Aferidor de Tensão L-N', campos: [['nom', 'Tensão de placa do aparelho', 'sel', [['220', '220 V'], ['127', '127 V']]], ['med', 'Tensão medida (V)', 'num']],
    calc: (v) => { const n = +v.nom, m = +v.med; if (!m) return null; const lo = n * 0.9, hi = n * 1.1; return { ok: m >= lo && m <= hi, txt: `Faixa: ${lo.toFixed(0)} a ${hi.toFixed(0)} V (±10% da placa, F14)` }; } },
  cap: { tit: 'Aferidor de Capacitor (µF)', campos: [['nom', 'µF da etiqueta', 'num'], ['med', 'µF medido', 'num']],
    calc: (v) => { const n = +v.nom, m = +v.med; if (!n || !m) return null; const lim = n * 0.95, d = (m - n) / n * 100; return { ok: m >= lim, txt: `Mínimo aceito: ${lim.toFixed(1)} µF (−5% da etiqueta) · desvio medido ${d.toFixed(1)}%` }; } },
  csr: { tit: 'Aferidor do Compressor C-S-R', campos: [['cs', 'C-S (Ω)', 'num'], ['cr', 'C-R (Ω)', 'num'], ['sr', 'S-R (Ω)', 'num'], ['massa', 'Algum pino tem continuidade com a carcaça', 'chk']],
    calc: (v) => { if (v.massa) return { ok: false, txt: 'Compressor em massa: condenar com laudo' }; const cs = +v.cs, cr = +v.cr, sr = +v.sr; if (!cs || !cr || !sr) return null; return { ok: null, txt: `C-S + C-R = ${(cs + cr).toFixed(2)} Ω · S-R medido = ${sr.toFixed(2)} Ω. Bateu a soma e sem massa: enrolamentos íntegros. Compare com a tabela do compressor.` }; } },
  deltat: { tit: 'Aferidor ΔT Retorno × Insuflamento', campos: [['ret', 'Retorno (°C)', 'num'], ['ins', 'Insuflamento (°C)', 'num']],
    calc: (v) => { if (v.ret === '' || v.ins === '') return null; const d = +v.ret - +v.ins; return { ok: d >= 10 && d <= 15, txt: `ΔT = ${d.toFixed(1)} °C · faixa 10 a 15 °C (F14). Acima de 15 °C: pouca vazão de ar (filtro, serpentina, turbina). Abaixo de 10 °C: pouca troca (fluido ou serpentina congelada).` }; } },
  sh: { tit: 'Aferidor de Superaquecimento (R-410A)', campos: [['tsuc', 'Temperatura do tubo de sucção (°C)', 'num'], ['tev', 'Temperatura de evaporação pela pressão (°C)', 'num']],
    calc: (v) => { if (v.tsuc === '' || v.tev === '') return null; const sh = +v.tsuc - +v.tev; return { ok: sh >= 7 && sh <= 11, txt: `SH = ${sh.toFixed(1)} °C · faixa 7 a 11 °C (F14). Acima de 11 °C: adicionar fluido na fase líquida. Abaixo de 7 °C: recolher fluido.` }; } },
  pn: { tit: 'Aferidor do Barramento P-N', campos: [['med', 'Tensão P-N medida (V CC)', 'num']],
    calc: (v) => { const m = +v.med; if (!m) return null; return { ok: m >= 290 && m <= 330, txt: 'Faixa em espera: 290 a 330 V CC; cerca de 310 V CC em 208–230 V (F20)' }; } },
  ipm: { tit: 'Aferidor do Módulo IPM', campos: ['P → N', 'P → U', 'P → V', 'P → W', 'U → N', 'V → N', 'W → N'].map((k, i) => ['p' + i, `${k}: leitura baixa (não deu infinito)`, 'chk']),
    calc: (v) => { const r = Object.values(v).filter(Boolean).length; return { ok: r === 0, txt: r ? `${r} par(es) com leitura baixa: IPM em curto (F20 p. 85)` : 'Todos os pares em infinito: IPM sem curto (F20 p. 85)' }; } },
  ntc: { tit: 'Aferidor de Sensor NTC (a 25 °C)', campos: [['tipo', 'Sensor', 'sel', NTC_OPS.map((o, i) => [String(i), o[0]])], ['med', 'Resistência medida a 25 °C (kΩ)', 'num']],
    calc: (v) => { const o = NTC_OPS[+v.tipo], m = +v.med; if (!m) return null; const lo = o[1] * (1 - o[2] / 100), hi = o[1] * (1 + o[2] / 100); return { ok: m >= lo && m <= hi, txt: `Faixa a 25 °C: ${lo.toFixed(2)} a ${hi.toFixed(2)} kΩ. Em outra temperatura, compare na curva da marca (ferramenta Sensor NTC do app).` }; } },
  massa: { tit: 'Aferidor de Isolamento C-S-R → Carcaça', campos: ['C', 'S', 'R'].map(k => ['m' + k, `Pino ${k} tem continuidade com a carcaça`, 'chk']),
    calc: (v) => { const r = Object.values(v).filter(Boolean).length; return { ok: r === 0, txt: r ? 'Compressor em massa: não religar, condenar com laudo' : 'Sem fuga para a carcaça: siga para a corrente (Passo 2)' }; } },
  corrente: { tit: 'Aferidor de Corrente (alicate)', campos: [['nom', 'Corrente nominal da etiqueta (A)', 'num'], ['med', 'Corrente medida (A)', 'num']],
    calc: (v) => { const n = +v.nom, m = +v.med; if (!n || !m) return null; return { ok: m <= n, txt: `Medido ${m.toFixed(1)} A · etiqueta ${n.toFixed(1)} A${m > n ? ` · ${((m / n - 1) * 100).toFixed(0)}% acima` : ''}` }; } },
  lista: { tit: 'Checklist do ponto', campos: [], calc: (v) => { const r = Object.values(v).filter(Boolean).length; return { ok: r === 0, txt: r ? `${r} sinal(is) de defeito confirmado(s)` : 'Nenhum sinal de defeito marcado' }; } },
};
function abrirAferidor(p, i) {
  const s = p.passos[i], a = AFERIDORES[s.aferidor];
  const campos = s.aferidor === 'lista' ? s.check.map((t, k) => ['c' + k, t, 'chk']) : a.campos;
  const html = campos.map(([id, rot, tipo, ops]) => tipo === 'chk' ? `<label class="chk"><input type="checkbox" data-id="${id}"> ${esc(rot)}</label>`
    : tipo === 'sel' ? `<label>${esc(rot)}<select data-id="${id}">${ops.map(o => `<option value="${o[0]}">${esc(o[1])}</option>`).join('')}</select></label>`
    : `<label>${esc(rot)}<input type="number" inputmode="decimal" step="any" data-id="${id}"></label>`).join('');
  abrirModal(`<h3>🧮 ${esc(a.tit)}</h3><div class="sub">Prancha #${p.id} · ${esc(s.titulo)}</div>
    <div class="form">${html}</div><div class="veredito neutro" aria-live="polite">Preencha a medição para ver o veredito.</div>
    ${blocoServico(s.servico)}
    <div class="pilha"><button class="btn verde cheio" data-a="orc">📄 Gerar Orçamento PDF Nº 1001 com Pix</button><button class="btn claro cheio" data-a="voltar">Voltar à prancha</button></div>`, (m) => {
    const ver = $('.veredito', m);
    const atualizar = () => {
      const v = {}; $$('[data-id]', m).forEach(el => { v[el.dataset.id] = el.type === 'checkbox' ? el.checked : el.value; });
      const r = a.calc(v);
      if (!r) { ver.className = 'veredito neutro'; ver.textContent = 'Preencha a medição para ver o veredito.'; return; }
      ver.className = 'veredito ' + (r.ok === null ? 'neutro' : r.ok ? 'ok' : 'def');
      ver.innerHTML = (r.ok === null ? 'Leitura registrada' : r.ok ? '✓ DENTRO DA FAIXA' : '✗ DEFEITO CONFIRMADO: ' + esc(s.causa)) + `<small>${esc(r.txt.replace(/(\d)\.(\d)/g, '$1,$2'))}</small>`;
    };
    $$('[data-id]', m).forEach(el => el.addEventListener('input', atualizar));
    if (['lista', 'ipm', 'massa'].includes(s.aferidor)) atualizar();
    $('[data-a=orc]', m).addEventListener('click', () => abrirOrcamento(s.servico, p));
    $('[data-a=voltar]', m).addEventListener('click', fecharTudo);
  });
}

// ───────────── Orçamento Nº 1001 com assinatura na tela ─────────────
function qrPrevia(cv, semente) {
  // Prévia visual do QR (o QR Pix real sai no app com a chave e o valor). Desenhado em canvas, sem SVG.
  let h = 2166136261; for (const c of semente) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; }
  const rnd = () => { h ^= h << 13; h >>>= 0; h ^= h >> 17; h ^= h << 5; h >>>= 0; return h / 4294967296; };
  const N = 25, ctx = cv.getContext('2d'); cv.width = N + 2; cv.height = N + 2;
  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, N + 2, N + 2); ctx.fillStyle = '#091E42';
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { const canto = (x < 8 && y < 8) || (x > 16 && y < 8) || (x < 8 && y > 16); if (!canto && rnd() > 0.52) ctx.fillRect(x + 1, y + 1, 1, 1); }
  [[0, 0], [18, 0], [0, 18]].forEach(([x, y]) => { ctx.fillStyle = '#091E42'; ctx.fillRect(x + 1, y + 1, 7, 7); ctx.fillStyle = '#FFFFFF'; ctx.fillRect(x + 2, y + 2, 5, 5); ctx.fillStyle = '#091E42'; ctx.fillRect(x + 3, y + 3, 3, 3); });
}

    <div class="form">

      <label>Valor (R$)<input type="number" inputmode="decimal" step="any" data-o="val"></label>
      <div><div style="font-size:13px;font-weight:700;color:#334155;margin-bottom:6px">Garantia do serviço</div><div class="prazos">${['7 dias', '15 dias', '30 dias', '60 dias', '90 dias'].map((g, k) => `<button data-g="${g}" aria-pressed="${k === 4}">${g}</button>`).join('')}</div></div>

    let garantia = '90 dias', assinado = false;
    const val = $('[data-o=val]', m), srv = $('[data-o=srv]', m), cli = $('[data-o=cli]', m), orc = $('#orc-print', m);
    const cv = $('.assinatura canvas', m), dica = $('.assinatura .dica', m);
    const ajustar = () => { const r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1; cv.width = r.width * d; cv.height = r.height * d; const c = cv.getContext('2d'); c.scale(d, d); c.lineWidth = 2.4; c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = '#091E42'; };
    requestAnimationFrame(ajustar);
    let ult = null;
    const pos = (e) => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    cv.addEventListener('pointerdown', (e) => { cv.setPointerCapture(e.pointerId); ult = pos(e); dica.style.display = 'none'; });
    cv.addEventListener('pointermove', (e) => { if (!ult) return; const c = cv.getContext('2d'), q = pos(e); c.beginPath(); c.moveTo(ult[0], ult[1]); c.lineTo(q[0], q[1]); c.stroke(); ult = q; assinado = true; });
    const soltar = () => { if (ult) { ult = null; desenhar(); } };
    cv.addEventListener('pointerup', soltar); cv.addEventListener('pointercancel', soltar);
    $('.assinatura .limpar', m).addEventListener('click', () => { cv.getContext('2d').clearRect(0, 0, cv.width, cv.height); assinado = false; dica.style.display = ''; desenhar(); });
    const preencher = () => { val.value = PRECOS[srv.value][2]; };
    const desenhar = () => {
      const s = PRECOS[srv.value], v = +val.value || 0;

      qrPrevia($('.pix canvas', orc), srv.value + v);
    };
    preencher(); desenhar();
    srv.addEventListener('change', () => { preencher(); desenhar(); });
    [val, cli].forEach(el => el.addEventListener('input', desenhar));
    $$('.prazos button', m).forEach(b => b.addEventListener('click', () => { garantia = b.dataset.g; $$('.prazos button', m).forEach(x => x.setAttribute('aria-pressed', x === b)); desenhar(); }));
    $('[data-a=pdf]', m).addEventListener('click', () => { desenhar(); document.body.classList.add('imprimir'); setTimeout(() => { window.print(); document.body.classList.remove('imprimir'); }, 30); });
    $('[data-a=zap]', m).addEventListener('click', () => {
      const s = PRECOS[srv.value], txt = `Orçamento Nº 1001 · GeloPRO\n${s[0]}\nValor: ${brl(+val.value || 0)}\nGarantia: ${garantia}\nPagamento no Pix ao aprovar.`;
      window.open('https://wa.me/?text=' + encodeURIComponent(txt), '_blank', 'noopener');
    });
  });
}

}

// ───────────── Catálogo (busca por sintoma / código e 8 blocos) ─────────────
const filtrar = (q, bloco) => { const t = norm(q.trim()); return P.map((p, i) => i).filter(i => { const p = P[i], txt = norm(`${p.titulo} ${p.curto} ${p.busca} ${p.id} #${p.id}`); return (bloco === 'todos' || p.blocos.includes(bloco)) && (!t || txt.includes(t) || t.split(/\s+/).every(w => txt.includes(w))); }); };
const fotoCapa = (p) => { const pt = p.pontos[p.prob[0][2] - 1]; return CENA(pt.img[1]); };
const pilulas = (atual) => BLOCOS.map(([id, rot]) => `<button class="pilula" data-b="${id}" aria-pressed="${id === atual}">${rot}</button>`).join('');
const vazio = () => `<div class="vazio">Nenhuma prancha-piloto com esse termo.<div class="acoes"><button class="btn marinho" data-limpar>Ver as 6 pranchas</button><button class="btn claro" data-cod>Buscar nos Códigos de Erro</button></div></div>`;
const miniBarra = (p) => `<div class="barra-mini">${p.prob.map((b, i) => `<i style="width:${b[0]}%;background:${COR_PROB[i]}"></i>`).join('')}</div><div class="legenda-mini">${p.prob.map(b => `${b[0]}% ${esc(b[3])}`).join(' · ')}</div>`;
const linhaItem = (i) => { const p = P[i], c1 = p.prob[0]; return `<button class="linha-item" data-i="${i}"><span class="foto"><img src="${fotoCapa(p)}" alt="" loading="lazy"><b>#${p.id}</b></span><span class="t">${esc(p.titulo)}</span><span class="seta">›</span><span class="m"><span class="etq c1">${c1[0]}% ${esc(c1[3])}</span><span class="etq t">⚡ ${p.tempo}</span><span class="etq i">${esc(p.instr)}</span></span></button>`; };
let bloco = 'todos', termo = '';
function ligarCatalogo(raiz, render) {
  const inp = $('input[type=search]', raiz);
  if (inp) inp.addEventListener('input', () => { termo = inp.value; render(); });
  $$('.pilula', raiz).forEach(b => b.addEventListener('click', () => { bloco = b.dataset.b; $$('.pilula', raiz).forEach(x => x.setAttribute('aria-pressed', x === b)); render(); }));
}
function ligarLista(el, aoEscolher, limpar) {
  $$('[data-i]', el).forEach(c => c.addEventListener('click', () => aoEscolher(+c.dataset.i)));
  const a = $('[data-limpar]', el), c = $('[data-cod]', el); if (a) a.addEventListener('click', limpar); if (c) c.addEventListener('click', () => abrirBonus(1));
}
function catalogoV1() {
  corpo.innerHTML = `<div class="v-topo"><label class="busca"><span aria-hidden="true">🔎</span><input type="search" placeholder="Digite o sintoma ou código: ex. não gela, E1, pingando..." autocomplete="off" value="${esc(termo)}"></label><div class="pilulas">${pilulas(bloco)}</div></div><div class="grade"></div>`;
  const g = $('.grade', corpo);
  const render = () => { const ids = filtrar(termo, bloco);
    g.innerHTML = ids.length ? ids.map(i => { const p = P[i]; return `<button class="cartao" data-i="${i}"><span class="mini"><img src="${fotoCapa(p)}" alt="" loading="lazy"><span class="pct">${p.prob[0][0]}% ${esc(p.prob[0][3])}</span></span><span class="corpo"><span class="num">#${p.id} · ${p.area}</span><h3>${esc(p.titulo)}</h3>${miniBarra(p)}</span></button>`; }).join('') : vazio();
    ligarLista(g, abrirPrancha, () => { termo = ''; $('input', corpo).value = ''; render(); }); };
  ligarCatalogo(corpo, render); render();
}
function catalogoV3() {
  corpo.innerHTML = `<div class="v-topo"><label class="busca"><span aria-hidden="true">🔎</span><input type="search" placeholder="Sintoma ou código..." autocomplete="off" value="${esc(termo)}"></label><div class="bonus-linha">${BONUS.map((b, i) => `<button data-bn="${i}">B${i + 1} · ${esc(b[0])}</button>`).join('')}</div></div><div class="lista-v3"></div>`;
  $$('[data-bn]', corpo).forEach(b => b.addEventListener('click', () => abrirBonus(+b.dataset.bn)));
  const l = $('.lista-v3', corpo);
  const render = () => { const grupos = BLOCOS.slice(1).map(([id, rot]) => [rot, filtrar(termo, id)]).filter(g => g[1].length);
    l.innerHTML = grupos.length ? grupos.map(([rot, ids]) => `<section class="grupo"><h4>${rot} · ${ids.length}</h4>${ids.map(linhaItem).join('')}</section>`).join('') : `<div style="padding:12px">${vazio()}</div>`;
    ligarLista(l, abrirPrancha, () => { termo = ''; $('input', corpo).value = ''; render(); }); };
  ligarCatalogo(corpo, render); render();
}
function abrirGaveta() {
  abrirFolha(gaveta, `<h3>📑 Índice · 120+ Diagnósticos</h3><div class="sub">6 pranchas-piloto prontas neste comparativo. Busque por sintoma ou código.</div>
    <label class="busca"><span aria-hidden="true">🔎</span><input type="search" placeholder="Sintoma ou código: não gela, E1, pingando..." autocomplete="off" value="${esc(termo)}"></label>
    <div class="pilulas">${pilulas(bloco)}</div><div class="lista"></div>`, (g) => {
    const l = $('.lista', g);
    const render = () => { const ids = filtrar(termo, bloco); l.innerHTML = ids.length ? ids.map(linhaItem).join('') : `<div style="padding:12px">${vazio()}</div>`; ligarLista(l, (i) => { fecharTudo(); abrirPrancha(i); }, () => { termo = ''; $('input', g).value = ''; render(); }); };
    ligarCatalogo(g, render); render();
  });
}

// ───────────── Navegação da moldura ─────────────
function atualizarTopo() {
  const p = P[S.idx];
  $('#atual-txt').textContent = `#${p.id} ${p.curto}`;
  $$('.variacoes button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.v === S.v));
}
function hash() { const h = '#v' + S.v + (S.aberta ? '&p=' + P[S.idx].id : ''); try { history.replaceState(null, '', h); } catch (e) {} }
function abrirPrancha(i) { S.idx = i; S.aberta = true; fecharTudo(); montarPrancha(i); atualizarTopo(); hash(); }
function abrirIndice() {
  fecharTudo();
  if (S.v === 1) { S.aberta = false; catalogoV1(); corpo.scrollTop = 0; }
  else if (S.v === 3) { S.aberta = false; catalogoV3(); corpo.scrollTop = 0; }
  else abrirGaveta();
  atualizarTopo(); hash();
}
function trocarVariacao(v) {
  S.v = v; guardar('guiapro.v', String(v)); fecharTudo();
  if (v === 2) abrirPrancha(S.idx); else { S.aberta = false; v === 1 ? catalogoV1() : catalogoV3(); corpo.scrollTop = 0; }
  atualizarTopo(); hash();
}
$('#b-indice').addEventListener('click', abrirIndice);
$('#d-diag').addEventListener('click', abrirIndice);
$('#b-atual').addEventListener('click', abrirGaveta);
$('#b-ant').addEventListener('click', () => abrirPrancha((S.idx + P.length - 1) % P.length));
$('#b-prox').addEventListener('click', () => abrirPrancha((S.idx + 1) % P.length));
$('#d-bonus').addEventListener('click', abrirMenuBonus);
$('#d-orcar').addEventListener('click', () => abrirOrcamento(servicoAtual(), P[S.idx]));
$$('.variacoes button').forEach(b => b.addEventListener('click', () => trocarVariacao(+b.dataset.v)));

// Início: #v1 / #v2 / #v3 (e &p=04 abre a prancha). Sem hash, volta à última variação escolhida (padrão V2).
function iniciar() {
  const h = location.hash.slice(1), m = h.match(/[vl]([123])/), pm = h.match(/p=(\d\d)/);
  const i = pm ? P.findIndex(p => p.id === pm[1]) : -1; if (i >= 0) S.idx = i;
  trocarVariacao(m ? +m[1] : (+ler('guiapro.v') || 2));
  if (i >= 0 && S.v !== 2) abrirPrancha(i);
}
window.addEventListener('hashchange', iniciar);
iniciar();
</script>
</body>
</html>
