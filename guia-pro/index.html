<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#091e42">
<title>GeloPRO · Guia Pro — Comparativo de Entrada</title>
<!--
  Guia Pro (v01-polo): comparativo dos 3 layouts de entrada do app + Prancha de Diagnóstico Interativa Viva.
  Arquivo isolado: não importa nem altera nada de ../app/. Sem CDN, sem dependência: abre offline.
  Cores de SVG cravadas em hexadecimal nos atributos fill/stroke (CLAUDE.md regra 5).
  Encaixe de imagem gerada: preencha "img" na prancha (dados P abaixo); o quadro usa o atributo data-img-slot="prancha-NN".
-->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#F4F6F9;color:#0F172A;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{min-height:100dvh;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid #0EA5E9;outline-offset:2px}

/* ── Barra discreta de comparação ── */
#comparar{position:fixed;top:0;left:0;right:0;height:34px;z-index:60;display:flex;align-items:center;gap:8px;padding:0 10px;background:#0A182D;color:#CBD5E1;font-size:12px}
#comparar .rot{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1;opacity:.8}
#comparar .seg{display:flex;background:#132744;border-radius:8px;padding:2px;flex-shrink:0}
#comparar .seg button{padding:4px 9px;border-radius:6px;font-size:12px;font-weight:600;color:#94A3B8;white-space:nowrap}
#comparar .seg button[aria-pressed="true"]{background:#FFFFFF;color:#091E42}
.layout{display:none;padding-top:34px}
.layout.ativo{display:block}

/* ── Layout 1: Painel de Bancada ── */
#L1{background:#F4F6F9;min-height:100dvh}
.l1-topo{position:sticky;top:34px;z-index:5;background:#F4F6F9;padding:12px 16px 8px;border-bottom:1px solid #E2E8F0}
.marca-linha{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.marca{font-weight:800;letter-spacing:-.01em;color:#091E42;font-size:18px}
.marca small{font-weight:600;color:#64748B;font-size:12px;margin-left:6px}
.selo-plano{font-size:11px;font-weight:700;color:#166534;background:#DCFCE7;border-radius:999px;padding:3px 9px;white-space:nowrap}
.busca{display:flex;align-items:center;gap:8px;background:#FFFFFF;border:1.5px solid #CBD5E1;border-radius:12px;padding:0 12px;height:46px}
.busca:focus-within{border-color:#091E42}
.busca input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:15px}
.pilulas{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.pilulas::-webkit-scrollbar{display:none}
.pilula{flex-shrink:0;padding:7px 12px;border-radius:999px;background:#FFFFFF;border:1px solid #CBD5E1;font-size:13px;font-weight:600;color:#334155;white-space:nowrap}
.pilula[aria-pressed="true"]{background:#091E42;border-color:#091E42;color:#FFFFFF}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;padding:14px 16px 40px;max-width:1100px;margin:0 auto}
.cartao{background:#FFFFFF;border:1px solid #E2E8F0;border-radius:14px;overflow:hidden;text-align:left;display:flex;flex-direction:column;box-shadow:0 1px 2px rgba(15,23,42,.05);transition:transform .15s,box-shadow .15s}
.cartao:active{transform:scale(.985)}
.cartao:hover{box-shadow:0 6px 18px rgba(15,23,42,.08)}
.cartao .mini{background:#F8FAFC;border-bottom:1px solid #E2E8F0;aspect-ratio:300/260;display:block}
.cartao .mini svg{width:100%;height:100%;display:block}
.cartao .corpo{padding:9px 10px 11px;display:flex;flex-direction:column;flex:1}
.cartao .corpo .barra-mini{margin-top:auto}
.cartao .num{font-size:11px;font-weight:800;color:#64748B;letter-spacing:.06em}
.cartao h3{font-size:14px;line-height:1.25;margin:2px 0 8px;color:#091E42}
.barra-mini{display:flex;height:7px;border-radius:4px;overflow:hidden;background:#E2E8F0}
.legenda-mini{font-size:11.5px;color:#475569;margin-top:5px;line-height:1.3}
.vazio{grid-column:1/-1;background:#FFFFFF;border:1px dashed #CBD5E1;border-radius:14px;padding:18px;text-align:center;color:#334155}
.vazio .acoes{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}

/* ── Layout 2: Prancha Direta ── */
#L2{background:#E9EEF5}
.l2-barra{position:sticky;top:34px;z-index:5;height:44px;display:flex;align-items:center;gap:6px;padding:0 8px;background:#091E42;color:#FFFFFF}
.l2-barra .trocar{flex:1;min-width:0;display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:8px;background:#19365C;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l2-barra .trocar span{overflow:hidden;text-overflow:ellipsis}
.l2-barra .nav{height:32px;padding:0 9px;border-radius:8px;background:#19365C;font-size:12.5px;font-weight:700;white-space:nowrap;flex-shrink:0}
.l2-folha{height:calc(100dvh - 78px);overflow-y:auto;-webkit-overflow-scrolling:touch}
.gaveta-fundo{position:fixed;inset:0;background:rgba(9,30,66,.45);z-index:70;opacity:0;pointer-events:none;transition:opacity .2s}
.gaveta-fundo.aberta{opacity:1;pointer-events:auto}
.gaveta{position:fixed;left:0;right:0;bottom:0;max-height:82dvh;z-index:71;background:#FFFFFF;border-radius:18px 18px 0 0;transform:translateY(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;max-width:760px;margin:0 auto}
.gaveta.aberta{transform:none}
.gaveta .alca{width:44px;height:5px;border-radius:3px;background:#CBD5E1;margin:8px auto 4px}
.gaveta .cab{padding:4px 16px 8px}
.gaveta .lista{overflow-y:auto;padding:0 8px 18px}

/* ── Layout 3: Catálogo em lista ── */
#L3{background:#FFFFFF;min-height:100dvh}
.l3-topo{position:sticky;top:34px;z-index:5;background:#FFFFFF;border-bottom:1px solid #E2E8F0}
.l3-topo .linha{display:flex;align-items:center;gap:8px;padding:10px 12px 6px}
.l3-topo .busca{height:40px;flex:1;min-width:0}
.abas{display:flex;gap:2px;overflow-x:auto;padding:0 8px;scrollbar-width:none}
.abas::-webkit-scrollbar{display:none}
.aba{flex-shrink:0;padding:9px 10px 8px;font-size:12.5px;font-weight:700;color:#64748B;border-bottom:3px solid transparent;white-space:nowrap}
.aba[aria-selected="true"]{color:#091E42;border-bottom-color:#091E42}
.aba .b{display:inline-block;font-size:10px;background:#FEF3C7;color:#92400E;border-radius:4px;padding:1px 4px;margin-right:4px}
.l3-corpo{max-width:900px;margin:0 auto;padding-bottom:40px}
.grupo h4{position:sticky;top:122px;z-index:2;background:#F1F5F9;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:#475569;padding:6px 14px;border-top:1px solid #E2E8F0}
.linha-item{display:grid;grid-template-columns:40px 1fr auto;gap:2px 10px;align-items:center;width:100%;text-align:left;padding:10px 14px;border-bottom:1px solid #F1F5F9;min-height:62px}
.linha-item:active{background:#F1F5F9}
.linha-item .n{grid-row:1/3;font-size:13px;font-weight:800;color:#091E42;background:#E9F2FF;border-radius:8px;height:36px;display:flex;align-items:center;justify-content:center}
.linha-item .t{font-size:14.5px;font-weight:700;color:#0F172A;line-height:1.25;min-width:0}
.linha-item .m{grid-column:2/4;display:flex;gap:6px;flex-wrap:wrap;font-size:11.5px;color:#475569}
.linha-item .seta{grid-row:1;grid-column:3;color:#94A3B8;font-size:18px}
.etq{display:inline-flex;align-items:center;gap:3px;border-radius:5px;padding:2px 6px;font-weight:700;white-space:nowrap}
.etq.c1{background:#FFE4E6;color:#9F1239}
.etq.t{background:#FEF3C7;color:#92400E}
.etq.i{background:#E0F2FE;color:#075985}

/* ── Folha (prancha em tela cheia, layouts 1 e 3) ── */
#folha{position:fixed;top:34px;left:0;right:0;bottom:0;z-index:50;background:#E9EEF5;overflow-y:auto;-webkit-overflow-scrolling:touch;visibility:hidden;opacity:0;transform:scale(.98);transition:opacity .22s,transform .22s,visibility 0s .22s}
#folha.aberta{visibility:visible;opacity:1;transform:none;transition:opacity .22s,transform .22s}
#folha.deslizar{transform:translateX(100%);opacity:1}
#folha.deslizar.aberta{transform:none}
.folha-nav{position:sticky;top:0;z-index:6;display:flex;align-items:center;gap:6px;height:44px;padding:0 8px;background:#FFFFFF;border-bottom:1px solid #E2E8F0}
.folha-nav .voltar{font-weight:700;color:#091E42;font-size:14px;padding:6px 8px;white-space:nowrap}
.folha-nav .esp{flex:1}
.folha-nav .nav{height:32px;padding:0 10px;border-radius:8px;background:#F1F5F9;font-weight:700;font-size:12.5px;white-space:nowrap}

/* ── Prancha Interativa Viva ── */
.prancha{max-width:880px;margin:0 auto;padding:10px 10px 28px}
.p-cab{background:#091E42;color:#FFFFFF;border-radius:16px 16px 0 0;padding:12px 14px 12px}
.p-etq{font-size:11px;font-weight:800;letter-spacing:.08em;color:#67C6FF}
.p-cab h2{font-size:21px;line-height:1.2;margin:4px 0 0;letter-spacing:-.01em}
.p-alerta{display:flex;gap:8px;align-items:flex-start;background:#FEF3C7;color:#78350F;font-size:13px;line-height:1.35;font-weight:600;padding:9px 12px;border-left:4px solid #F59E0B}
.p-folha{background:#FFFFFF;border-radius:0 0 16px 16px;box-shadow:0 2px 10px rgba(9,30,66,.08);overflow:hidden}
.p-sec{padding:12px 14px}
.p-tit{font-size:11px;font-weight:800;letter-spacing:.08em;color:#64748B;text-transform:uppercase;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.p-tit em{font-style:normal;font-weight:600;letter-spacing:0;text-transform:none;color:#94A3B8}
.prob{display:grid;gap:6px}
.prob button{position:relative;display:grid;grid-template-columns:52px 1fr;align-items:center;gap:8px;text-align:left;padding:6px 8px;border-radius:10px;border:1.5px solid #E2E8F0;background:#FFFFFF;transition:border-color .2s,background .2s}
.prob button .pct{font-size:20px;font-weight:900;letter-spacing:-.02em}
.prob button .lado{min-width:0}
.prob button .nome{font-size:12.5px;font-weight:800;letter-spacing:.03em;color:#0F172A;display:flex;justify-content:space-between;gap:6px}
.prob button .nome small{font-weight:700;color:#64748B;letter-spacing:0;white-space:nowrap}
.prob button .trilho{height:9px;border-radius:5px;background:#F1F5F9;margin-top:4px;overflow:hidden}
.prob button .trilho i{display:block;height:100%;border-radius:5px}
.prob button.ativo{border-color:#091E42;background:#F8FAFC}
.quadro{position:relative;background:#F8FAFC;border-top:1px solid #E2E8F0;border-bottom:1px solid #E2E8F0}
.quadro svg.esq{display:block;width:100%;height:auto;max-height:62dvh;touch-action:manipulation}
.quadro .ver-tudo{position:absolute;right:8px;top:8px;background:#FFFFFF;border:1px solid #CBD5E1;border-radius:8px;font-size:12px;font-weight:700;padding:5px 8px;color:#091E42;opacity:0;pointer-events:none;transition:opacity .2s}
.quadro.zoom .ver-tudo{opacity:1;pointer-events:auto}
.quadro .dica{position:absolute;left:8px;top:8px;background:rgba(9,30,66,.86);color:#FFFFFF;border-radius:8px;font-size:11.5px;font-weight:600;padding:5px 8px;pointer-events:none;transition:opacity .3s}
.quadro.zoom .dica{opacity:0}
.ponto{cursor:pointer}
.ponto .pulso{transform-box:fill-box;transform-origin:center;animation:pulso 1.6s ease-out infinite}
@keyframes pulso{0%{transform:scale(1);opacity:.75}100%{transform:scale(2.1);opacity:0}}
.ponto.sel .halo{opacity:1}
.ponto .halo{opacity:0;transition:opacity .25s}
.lupa{cursor:pointer}
.lupa.sel circle.vidro{stroke-width:3}
.sonda{transition:d .5s cubic-bezier(.2,.8,.2,1)}
.ponta{transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.zoom-info{display:none;background:#0F172A;color:#E2E8F0;padding:12px 14px;font-size:13.5px;line-height:1.4}
.zoom-info.on{display:block;animation:surge .25s ease-out}
@keyframes surge{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.zoom-info h5{font-size:15px;color:#FFFFFF;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.zoom-info .bol{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:#F59E0B;color:#0F172A;font-weight:900;font-size:13px;flex-shrink:0}
.zoom-info dl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px}
.zoom-info dt{font-weight:800;white-space:nowrap}
.zoom-info dd{min-width:0}
.zoom-info .esperado{margin-top:8px;background:#14532D;color:#DCFCE7;border-radius:8px;padding:7px 9px;font-weight:700}
.zoom-info .fonte{margin-top:6px;font-size:11.5px;color:#94A3B8}
.zoom-info .ir{margin-top:8px;font-weight:800;color:#67C6FF;padding:4px 0}
.passos{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.passo{border:1.5px solid #E2E8F0;border-radius:14px;padding:11px 12px;background:#FFFFFF;display:flex;flex-direction:column;gap:8px;transition:border-color .25s,box-shadow .25s,opacity .25s}
.passo.foco{border-color:#091E42;box-shadow:0 0 0 3px #BFDBFE}
.passo.flash{animation:flash 1.1s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 0 #F59E0B}40%{box-shadow:0 0 0 7px rgba(245,158,11,.55)}100%{box-shadow:0 0 0 3px #BFDBFE}}
.passo.ok{border-color:#16A34A;background:#F0FDF4}
.passo.def{border-color:#DC2626;background:#FEF2F2}
.passo .topo{display:flex;align-items:center;gap:8px}
.passo .topo .bol{width:26px;height:26px;border-radius:50%;background:#091E42;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;flex-shrink:0}
.passo.ok .topo .bol{background:#16A34A}
.passo.def .topo .bol{background:#DC2626}
.passo h6{font-size:14.5px;line-height:1.2;color:#091E42;min-width:0}
.passo p{font-size:13px;line-height:1.38;color:#334155}
.passo .ref{font-size:12.5px;background:#F1F5F9;border-radius:8px;padding:6px 8px;color:#0F172A}
.passo .ref b{color:#166534}
.passo .ver{font-size:12px;font-weight:700;color:#0369A1;text-align:left;padding:0}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto}
.btn-ok,.btn-def{border-radius:10px;padding:9px 8px;font-size:12.5px;font-weight:800;line-height:1.2;text-align:center;min-height:56px;color:#FFFFFF}
.btn-ok{background:#15803D}
.btn-def{background:#DC2626}
.btn-ok small,.btn-def small{display:block;font-weight:600;font-size:11.5px;opacity:.95;margin-top:2px}
.erro-caro{margin:4px 14px 12px;border:2px solid #DC2626;background:#FEF2F2;border-radius:12px;padding:10px 12px;color:#7F1D1D;font-size:13.5px;line-height:1.4}
.erro-caro b{display:block;color:#B91C1C;font-size:13px;letter-spacing:.04em;margin-bottom:3px}
.bonus-barra{background:#091E42;padding:10px 12px 12px}
.bonus-barra .p-tit{color:#93C5FD}
.bonus-chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.bonus-chip{display:flex;align-items:center;gap:7px;background:#19365C;border:1px solid #24466F;color:#FFFFFF;border-radius:10px;padding:7px 9px;font-size:12px;font-weight:700;text-align:left;line-height:1.2;min-height:44px}
.bonus-chip .ic{flex-shrink:0;width:24px;height:24px;border-radius:6px;background:#67C6FF;color:#061224;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900}

/* ── Botões gerais ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;padding:12px 14px;font-weight:800;font-size:14.5px;line-height:1.2;text-align:center}
.btn.verde{background:#00B100;color:#FFFFFF}
.btn.marinho{background:#091E42;color:#FFFFFF}
.btn.claro{background:#F1F5F9;color:#091E42;border:1px solid #CBD5E1}
.btn.cheio{width:100%}

/* ── Modal (folha inferior no celular) ── */
#modal-fundo{position:fixed;inset:0;background:rgba(9,30,66,.5);z-index:80;opacity:0;pointer-events:none;transition:opacity .2s}
#modal-fundo.aberto{opacity:1;pointer-events:auto}
#modal{position:fixed;left:0;right:0;bottom:0;z-index:81;max-height:90dvh;overflow-y:auto;background:#FFFFFF;border-radius:18px 18px 0 0;transform:translateY(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-width:640px;margin:0 auto;padding:6px 16px 22px}
#modal.aberto{transform:none}
#modal .alca{width:44px;height:5px;border-radius:3px;background:#CBD5E1;margin:4px auto 10px}
#modal .fechar{position:absolute;right:10px;top:8px;width:36px;height:36px;border-radius:50%;background:#F1F5F9;font-size:18px;font-weight:700;color:#334155}
#modal h3{font-size:19px;color:#091E42;line-height:1.25;margin:0 40px 8px 0}
#modal .sub{font-size:13px;color:#475569;margin-bottom:12px;line-height:1.4}
.confirmada{border-radius:14px;background:#FEF2F2;border:2px solid #DC2626;padding:12px;margin-bottom:12px}
.confirmada .k{font-size:11px;font-weight:900;letter-spacing:.08em;color:#B91C1C}
.confirmada .v{font-size:17px;font-weight:800;color:#7F1D1D;margin-top:2px;line-height:1.25}
.servico{border:1px solid #E2E8F0;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13.5px;line-height:1.4}
.servico .faixa{display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-weight:800;color:#091E42;flex-wrap:wrap}
.servico .ref{font-size:11.5px;color:#64748B;margin-top:4px}
.pilha{display:grid;gap:8px}
.form{display:grid;gap:10px;margin:6px 0 12px}
.form label{display:grid;gap:4px;font-size:13px;font-weight:700;color:#334155}
.form input[type=number],.form select,.form input[type=text]{height:46px;border:1.5px solid #CBD5E1;border-radius:10px;padding:0 12px;font-size:16px;background:#FFFFFF;width:100%;min-width:0}
.form .chk{display:flex;align-items:center;gap:10px;font-weight:600;border:1px solid #E2E8F0;border-radius:10px;padding:10px 12px}
.form .chk input{width:22px;height:22px;flex-shrink:0}
.form .duas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.veredito{border-radius:12px;padding:11px 12px;font-weight:800;font-size:15px;line-height:1.3;margin-bottom:12px}
.veredito.ok{background:#DCFCE7;color:#14532D}
.veredito.def{background:#FEE2E2;color:#7F1D1D}
.veredito.neutro{background:#F1F5F9;color:#334155}
.veredito small{display:block;font-weight:600;font-size:12.5px;margin-top:3px}
.tabela{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:12px}
.tabela th,.tabela td{text-align:left;padding:7px 6px;border-bottom:1px solid #E2E8F0;vertical-align:top}
.tabela th{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:#64748B}
.tabela td.f{color:#64748B;font-size:11px;white-space:nowrap}
.orc{border:1px solid #CBD5E1;border-radius:12px;padding:14px;margin-bottom:12px}
.orc .cab{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;border-bottom:2px solid #091E42;padding-bottom:8px;margin-bottom:10px}
.orc .cab b{font-size:18px;color:#091E42}
.orc .cab span{font-size:12px;color:#475569;text-align:right}
.orc .item{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:6px 0;border-bottom:1px dashed #E2E8F0}
.orc .total{display:flex;justify-content:space-between;font-size:18px;font-weight:900;color:#091E42;padding-top:8px}
.orc .pix{display:flex;gap:12px;align-items:center;margin-top:12px;background:#F8FAFC;border-radius:10px;padding:10px}
.orc .pix svg{width:92px;height:92px;flex-shrink:0}
.orc .pix p{font-size:12.5px;color:#334155;line-height:1.4}
.prazos{display:flex;gap:6px;flex-wrap:wrap}

const caminhoSonda = (j, t) => `M${j[0]} ${j[1]}C${j[0]} ${j[1] + 26} ${t[0] - 60} ${Math.max(t[1], 200) + 40} ${t[0]} ${t[1]}`;
const REPOUSO = { r: [112, 226], b: [108, 244] };

function svgPrancha(p, uid, mini) {
  const fundo = p.img ? `<image href="${esc(p.img)}" x="0" y="0" width="400" height="260" preserveAspectRatio="xMidYMid slice"/>` : DESENHOS[p.desenho]();
  let s = `<svg class="${mini ? '' : 'esq'}" viewBox="${mini ? '100 0 300 260' : '0 0 400 260'}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Esquema técnico: ${esc(p.titulo)}" id="${uid}-svg">
    <defs><filter id="${uid}-brilho" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
    <rect x="0" y="0" width="400" height="260" fill="#F8FAFC"/>${fundo}`;
  if (!mini) {
    s += instrumento(uid);
    s += `<path id="${uid}-sb" class="sonda" d="${caminhoSonda(INSTR_X.com, REPOUSO.b)}" stroke="#111827" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path id="${uid}-sr" class="sonda" d="${caminhoSonda(INSTR_X.v, REPOUSO.r)}" stroke="#DC2626" stroke-width="3" fill="none" stroke-linecap="round"/>
      <g id="${uid}-pb" class="ponta" style="transform:translate(${REPOUSO.b[0]}px,${REPOUSO.b[1]}px)"><circle r="4.5" fill="#111827" stroke="#FFFFFF" stroke-width="1.5"/></g>
      <g id="${uid}-pr" class="ponta" style="transform:translate(${REPOUSO.r[0]}px,${REPOUSO.r[1]}px)"><circle r="4.5" fill="#DC2626" stroke="#FFFFFF" stroke-width="1.5"/></g>`;
  }
  p.pontos.forEach(pt => {
    if (!mini) s += `<g class="lupa" data-n="${pt.n}" role="button" tabindex="0" aria-label="Lupa no ponto ${pt.n}: ${esc(pt.nome)}">
        <circle class="vidro" cx="${pt.x}" cy="${pt.y}" r="17" fill="#FFFFFF" fill-opacity="0.08" stroke="#0EA5E9" stroke-width="2" stroke-dasharray="4 3"/>
        <path d="M${pt.x + 12} ${pt.y + 12}l8 8" stroke="#0EA5E9" stroke-width="3.5" stroke-linecap="round"/></g>`;
    s += `<path d="M${pt.bx} ${pt.by}L${pt.x} ${pt.y}" stroke="#091E42" stroke-width="1.2" stroke-dasharray="2 2"/>
      <g class="ponto" data-n="${pt.n}" ${mini ? '' : `role="button" tabindex="0" aria-label="Ponto ${pt.n}: ${esc(pt.nome)}"`}>
        <circle class="halo" cx="${pt.bx}" cy="${pt.by}" r="17" fill="#F59E0B" fill-opacity="0.35" filter="url(#${uid}-brilho)"/>
        ${mini ? '' : `<circle class="pulso" cx="${pt.bx}" cy="${pt.by}" r="10" fill="none" stroke="#F59E0B" stroke-width="2.5"/>`}
        <circle cx="${pt.bx}" cy="${pt.by}" r="10" fill="#091E42" stroke="#F59E0B" stroke-width="2"/>
        <text x="${pt.bx}" y="${pt.by + 4}" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle" font-family="system-ui,Arial,sans-serif">${pt.n}</text></g>`;
  });
  return s + '</svg>';
}

let UID = 0;
function montarPrancha(alvo, idx) {
  const p = P[idx], uid = 'pr' + (++UID);
  const estado = { passos: p.passos.map(() => 'pend'), foco: 0, ponto: 0 };
  alvo.innerHTML = `<article class="prancha" data-prancha="${p.id}" ${p.calibrar ? 'data-calibrar="1"' : ''}>
    <div class="p-cab">
      <div class="p-etq">DIAGNÓSTICO #${p.id} · ${p.area}</div>
      <h2>${esc(p.titulo)}</h2>
    </div>
    <div class="p-folha">
      <div class="p-alerta"><span aria-hidden="true">⚡</span><span><b>Segurança:</b> ${esc(p.alerta)}</span></div>
      <div class="p-sec">
        <div class="p-tit">Onde está o defeito <em>Toque na barra: o desenho mostra o ponto</em></div>
        <div class="prob">${p.prob.map((b, i) => `<button data-ponto="${b[2]}" aria-label="${b[0]}% ${esc(b[1])}: ver ponto ${b[2]}">
          <span class="pct" style="color:${COR_PROB[i]}">${b[0]}%</span>
          <span class="lado"><span class="nome">${esc(b[1])} <small>${CIRC[b[2] - 1]} Passo ${p.passos.findIndex(s => s.ponto === b[2]) + 1}</small></span><span class="trilho"><i style="width:${b[0]}%;background:${COR_PROB[i]}"></i></span></span></button>`).join('')}</div>
      </div>
      <figure class="quadro" data-img-slot="prancha-${p.id}">
        ${svgPrancha(p, uid, false)}
        <span class="dica">Toque nos números ①②③ ou nas lupas</span>
        <button class="ver-tudo">⤢ Esquema inteiro</button>
      </figure>
      <div class="zoom-info" aria-live="polite"></div>
      <div class="p-sec">
        <div class="p-tit">Passo a passo · se der isso, faz aquilo <em>${esc(p.instr)} · ⚡ ${p.tempo}</em></div>
        <div class="passos">${p.passos.map((s, i) => {
          const pt = p.pontos[s.ponto - 1];
          return `<section class="passo${i === 0 ? ' foco' : ''}" data-i="${i}">
            <div class="topo"><span class="bol">${i + 1}</span><h6>${esc(s.titulo)}</h6></div>
            <p>${esc(s.como)}</p>
            <div class="ref">Normal: <b>${esc(pt.esperado)}</b></div>
            <button class="ver" data-ponto="${s.ponto}">${CIRC[s.ponto - 1]} Ver onde encostar as pontas ›</button>
            <div class="dupla">
              <button class="btn-ok">✓ DEU NORMAL<small>(${esc(s.normal)})</small></button>
              <button class="btn-def">✗ DEU DEFEITO<small>(${esc(s.defeito)})</small></button>
            </div></section>`;
        }).join('')}</div>
      </div>
      <div class="erro-caro"><b>🛑 ERRO CARO A EVITAR</b>${esc(p.erro)}</div>
      <div class="bonus-barra">
        <div class="p-tit">6 Bônus Exclusivos do Plano Completo</div>
        <div class="bonus-chips">${BONUS.map((b, i) => `<button class="bonus-chip" data-b="${i}"><span class="ic">${i + 1}</span><span>${esc(b[1])}</span></button>`).join('')}</div>
      </div>
    </div></article>`;

  const svg = $('#' + uid + '-svg', alvo), quadro = $('.quadro', alvo), info = $('.zoom-info', alvo);
  let vb = [0, 0, 400, 260], anim = 0;
  const animarVB = (alvoVB) => {
    cancelAnimationFrame(anim);
    const de = vb.slice(), t0 = performance.now(), dur = 520;
    const passo = (t) => {
      const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      vb = de.map((v, i) => v + (alvoVB[i] - v) * e);
      svg.setAttribute('viewBox', vb.map(v => v.toFixed(1)).join(' '));
      if (k < 1) anim = requestAnimationFrame(passo);
    };
    anim = requestAnimationFrame(passo);
  };
  const moverPonta = (cor, alvoXY) => {
    const j = cor === 'r' ? INSTR_X.v : INSTR_X.com;
    $('#' + uid + '-s' + cor, alvo).setAttribute('d', caminhoSonda(j, alvoXY));
    $('#' + uid + '-p' + cor, alvo).style.transform = `translate(${alvoXY[0]}px,${alvoXY[1]}px)`;
  };
  const selecionar = (n) => {
    const pt = p.pontos[n - 1]; estado.ponto = n;
    $$('.ponto,.lupa', svg).forEach(g => g.classList.toggle('sel', +g.dataset.n === n));
    $$('.prob button', alvo).forEach(b => b.classList.toggle('ativo', +b.dataset.ponto === n));
    moverPonta('r', pt.r || REPOUSO.r); moverPonta('b', pt.b || REPOUSO.b);
    $('#' + uid + '-lcd', alvo).textContent = pt.lcd;
    $('#' + uid + '-instr', alvo).textContent = pt.instr;
    // Zoom real no ponto: janela 200×130 (mesma proporção) centrada no alvo, sem sair do quadro.
    const w = 200, h = 130, xs = [pt.x, pt.bx, ...(pt.r ? [pt.r[0], pt.b[0]] : [])], ys = [pt.y, pt.by, ...(pt.r ? [pt.r[1], pt.b[1]] : [])];
    const cx = (Math.min(...xs) + Math.max(...xs)) / 2, cy = (Math.min(...ys) + Math.max(...ys)) / 2;
    animarVB([Math.max(0, Math.min(400 - w, cx - w / 2)), Math.max(0, Math.min(260 - h, cy - h / 2)), w, h]);
    quadro.classList.add('zoom');
    const iPasso = p.passos.findIndex(s => s.ponto === n);
    info.innerHTML = `<h5><span class="bol">${n}</span>${esc(pt.nome)} <span style="font-weight:600;color:#94A3B8;font-size:12px">· ${esc(pt.escala)}</span></h5>
      <dl>${pt.r ? `<dt style="color:#F87171">● VERMELHA</dt><dd>${esc(pt.vermelho)}</dd><dt style="color:#E5E7EB">● PRETA</dt><dd>${esc(pt.preto)}</dd>` : `<dt style="color:#67C6FF">Onde</dt><dd>${esc(pt.onde)}</dd>`}</dl>
      <div class="esperado">Valor esperado: ${esc(pt.esperado)}</div>
      <div class="fonte">Fonte: ${esc(pt.fonte)}</div>
      <button class="ir" data-passo="${iPasso}">Ir ao Passo ${iPasso + 1} ↓</button>`;
    info.classList.add('on');
  };
  const verTudo = () => {
    animarVB([0, 0, 400, 260]); quadro.classList.remove('zoom'); info.classList.remove('on');
    $$('.ponto,.lupa', svg).forEach(g => g.classList.remove('sel')); $$('.prob button', alvo).forEach(b => b.classList.remove('ativo'));
    moverPonta('r', REPOUSO.r); moverPonta('b', REPOUSO.b); $('#' + uid + '-lcd', alvo).textContent = '---';
  };
  const destacarPasso = (i, rolar) => {
    estado.foco = i;
    $$('.passo', alvo).forEach((c, k) => c.classList.toggle('foco', k === i));
    const c = $$('.passo', alvo)[i]; if (!c) return;
    c.classList.remove('flash'); void c.offsetWidth; c.classList.add('flash');
    if (rolar) setTimeout(() => c.scrollIntoView({ behavior: 'smooth', block: 'center' }), 650);
  };
  const marcar = (i, st) => {
    estado.passos[i] = st;
    const c = $$('.passo', alvo)[i]; c.classList.remove('ok', 'def'); c.classList.add(st === 'ok' ? 'ok' : 'def');
    $('.bol', c).textContent = st === 'ok' ? '✓' : '✗';
  };

  $$('.ponto,.lupa', svg).forEach(g => {
    g.addEventListener('click', () => selecionar(+g.dataset.n));
    g.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selecionar(+g.dataset.n); } });
  });
  $$('.prob button', alvo).forEach(b => b.addEventListener('click', () => {
    const n = +b.dataset.ponto; selecionar(n); destacarPasso(p.passos.findIndex(s => s.ponto === n), true);
  }));
  $('.ver-tudo', alvo).addEventListener('click', verTudo);
  info.addEventListener('click', (e) => { const b = e.target.closest('.ir'); if (b) destacarPasso(+b.dataset.passo, true); });
  $$('.passo', alvo).forEach((c, i) => {
    const s = p.passos[i];
    $('.ver', c).addEventListener('click', () => { selecionar(s.ponto); destacarPasso(i, false); quadro.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
    $('.btn-ok', c).addEventListener('click', () => {
      marcar(i, 'ok');
      if (i + 1 < p.passos.length) { destacarPasso(i + 1, true); selecionar(p.passos[i + 1].ponto); }
      else abrirFim(p, estado);
    });
    $('.btn-def', c).addEventListener('click', () => { marcar(i, 'def'); destacarPasso(i, false); abrirCausa(p, i); });
  });
  $$('.bonus-chip', alvo).forEach(b => b.addEventListener('click', () => abrirBonus(+b.dataset.b, p)));
  return { selecionar, verTudo };
}

// ───────────── Aferidores vivos ─────────────
// Cada um: campos + cálculo → veredito (ok / def / neutro). Faixas com fonte: tensão ±10% e SH/ΔT (F14 Elgin), P-N (F20 Midea), NTC (F18/F24/F26), capacitor −5% (regra do Pedro).
const NTC_OPS = [['Samsung 10K (±2%)', 10, 2], ['Midea/Springer/Carrier 10K (±3%)', 10, 3], ['Daikin 10K (9,90 a 10,10 kΩ)', 10, 1]];
const AFERIDORES = {
  tensao: { tit: 'Aferidor de Tensão L-N', campos: [['nom', 'Tensão de placa do aparelho', 'sel', [['220', '220 V'], ['127', '127 V']]], ['med', 'Tensão medida (V)', 'num']],
    calc: (v) => { const n = +v.nom, m = +v.med; if (!m) return null; const lo = n * 0.9, hi = n * 1.1; return { ok: m >= lo && m <= hi, txt: `Faixa: ${lo.toFixed(0)} a ${hi.toFixed(0)} V (±10% da placa, F14)` }; } },
  cap: { tit: 'Aferidor de Capacitor (µF)', campos: [['nom', 'µF da etiqueta', 'num'], ['med', 'µF medido', 'num']],
    calc: (v) => { const n = +v.nom, m = +v.med; if (!n || !m) return null; const lim = n * 0.95, d = (m - n) / n * 100; return { ok: m >= lim, txt: `Mínimo aceito: ${lim.toFixed(1)} µF (−5% da etiqueta) · desvio medido ${d.toFixed(1)}%` }; } },
  csr: { tit: 'Aferidor do Compressor C-S-R', campos: [['cs', 'C-S (Ω)', 'num'], ['cr', 'C-R (Ω)', 'num'], ['sr', 'S-R (Ω)', 'num'], ['massa', 'Algum pino tem continuidade com a carcaça', 'chk']],
    calc: (v) => { if (v.massa) return { ok: false, txt: 'Compressor em massa: condenar com laudo' }; const cs = +v.cs, cr = +v.cr, sr = +v.sr; if (!cs || !cr || !sr) return null; return { ok: null, txt: `C-S + C-R = ${(cs + cr).toFixed(2)} Ω · S-R medido = ${sr.toFixed(2)} Ω. Bateu a soma e sem massa: enrolamentos íntegros. Compare com a tabela do compressor.` }; } },
  deltat: { tit: 'Aferidor ΔT Retorno × Insuflamento', campos: [['ret', 'Retorno (°C)', 'num'], ['ins', 'Insuflamento (°C)', 'num']],
    calc: (v) => { if (v.ret === '' || v.ins === '') return null; const d = +v.ret - +v.ins; return { ok: d >= 10 && d <= 15, txt: `ΔT = ${d.toFixed(1)} °C · faixa 10 a 15 °C (F14). Acima de 15 °C: pouca vazão de ar (filtro, serpentina, turbina). Abaixo de 10 °C: pouca troca (fluido ou serpentina congelada).` }; } },
  sh: { tit: 'Aferidor de Superaquecimento (R-410A)', campos: [['tsuc', 'Temperatura do tubo de sucção (°C)', 'num'], ['tev', 'Temperatura de evaporação pela pressão (°C)', 'num']],
    calc: (v) => { if (v.tsuc === '' || v.tev === '') return null; const sh = +v.tsuc - +v.tev; return { ok: sh >= 7 && sh <= 11, txt: `SH = ${sh.toFixed(1)} °C · faixa 7 a 11 °C (F14). Acima de 11 °C: adicionar fluido na fase líquida. Abaixo de 7 °C: recolher fluido.` }; } },
  pn: { tit: 'Aferidor do Barramento P-N', campos: [['med', 'Tensão P-N medida (V CC)', 'num']],

// ───────────── Orçamento Nº 1001 (prévia imprimível) ─────────────
function qrPrevia(semente) {
  let h = 2166136261; for (const c of semente) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; }
  const N = 25, rnd = () => { h ^= h << 13; h >>>= 0; h ^= h >> 17; h ^= h << 5; h >>>= 0; return h / 4294967296; };
  let r = '';
  const olho = (x, y) => `<rect x="${x}" y="${y}" width="7" height="7" fill="#091E42"/><rect x="${x + 1}" y="${y + 1}" width="5" height="5" fill="#FFFFFF"/><rect x="${x + 2}" y="${y + 2}" width="3" height="3" fill="#091E42"/>`;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { const canto = (x < 8 && y < 8) || (x > 16 && y < 8) || (x < 8 && y > 16); if (!canto && rnd() > 0.52) r += `<rect x="${x}" y="${y}" width="1" height="1" fill="#091E42"/>`; }
  return `<svg viewBox="-1 -1 27 27" xmlns="http://www.w3.org/2000/svg" aria-label="Prévia do QR Pix"><rect x="-1" y="-1" width="27" height="27" fill="#FFFFFF"/>${r}${olho(0, 0)}${olho(18, 0)}${olho(0, 18)}</svg>`;
}

  const q = $('#l3-busca').value, corpo = $('#l3-corpo');
  const grupos = BLOCOS.slice(1).map(([id, rot]) => [rot, filtrar(q, id)]).filter(g => g[1].length);
  corpo.innerHTML = grupos.length ? grupos.map(([rot, ids]) => `<section class="grupo"><h4>${rot} · ${ids.length}</h4>${ids.map(linhaItem).join('')}</section>`).join('') : `<div style="padding:16px">${vazio()}</div>`;
  $$('.linha-item', corpo).forEach(c => c.addEventListener('click', () => abrirFolha(+c.dataset.i, true)));
  ligarVazio(corpo, () => { $('#l3-busca').value = ''; renderL3(); });
}
$('#l3-busca').addEventListener('input', renderL3);

// Folha em tela cheia (layouts 1 e 3)
const folha = $('#folha');
let folhaIdx = 0;
function abrirFolha(i, deslizar) {
  folhaIdx = i; folha.classList.toggle('deslizar', deslizar);
  montarPrancha($('#folha-corpo'), i); folha.scrollTop = 0;
  requestAnimationFrame(() => { folha.classList.add('aberta'); folha.setAttribute('aria-hidden', 'false'); });
  atualizarHash(i);
}
function fecharFolha() { folha.classList.remove('aberta'); folha.setAttribute('aria-hidden', 'true'); atualizarHash(null); }
$('#folha-voltar').addEventListener('click', fecharFolha);
$('#folha-ant').addEventListener('click', () => { folhaIdx = (folhaIdx + P.length - 1) % P.length; montarPrancha($('#folha-corpo'), folhaIdx); folha.scrollTop = 0; atualizarHash(folhaIdx); });
$('#folha-prox').addEventListener('click', () => { folhaIdx = (folhaIdx + 1) % P.length; montarPrancha($('#folha-corpo'), folhaIdx); folha.scrollTop = 0; atualizarHash(folhaIdx); });

// ───────────── Troca de layout (barra discreta) ─────────────
let layout = 1;
function irPara(i) { if (layout === 2) { l2Idx = i; renderL2(); } else abrirFolha(i, layout === 3); }
function atualizarHash(i) { const h = '#l' + layout + (i !== null && i !== undefined && layout !== 2 ? '&p=' + P[i].id : ''); try { history.replaceState(null, '', h); } catch (e) { location.hash = h; } }
function trocarLayout(n) {
  layout = n; guardar('guiapro.layout', String(n));
  $$('#comparar .seg button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.l === n));
  $$('.layout').forEach(m => m.classList.toggle('ativo', m.id === 'L' + n));
  fecharFolha(); fecharGaveta(); fecharModal();
  if (n === 1) renderL1(); else if (n === 2) renderL2(); else renderL3();
  window.scrollTo(0, 0); atualizarHash(null);
}
$$('#comparar .seg button').forEach(b => b.addEventListener('click', () => trocarLayout(+b.dataset.l)));

// Início: #l1 / #l2 / #l3 (e &p=01 abre a prancha). Sem hash, volta ao último layout escolhido.
function iniciar() {
  const h = location.hash.slice(1), m = h.match(/l([123])/), pm = h.match(/p=(\d\d)/);
  trocarLayout(m ? +m[1] : (+ler('guiapro.layout') || 1));
  if (pm) { const i = P.findIndex(p => p.id === pm[1]); if (i >= 0) irPara(i); }
}
// Link colado na mesma aba (#l2, #l3&p=04) troca o layout sem recarregar.
window.addEventListener('hashchange', iniciar);
iniciar();
</script>
