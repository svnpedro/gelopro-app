<!doctype html>
<html lang="pt-BR" data-tema="sol">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#091e42">
<title>GeloPRO · Guia de Diagnóstico</title>
<!--
  Guia Pro (v01-polo) — Tela única: ficha de diagnóstico em 7 camadas (DNA da prancha de fundo branco do Pedro)
  dentro da moldura do GeloPRO v148 (chassi acetinado, topo 50px #091E42, dock 3D 58px).
  Isolado: lê ../app/ref, ../app/marca, ../app/fontes e ../app/imagens/cenas sem alterar nada de ../app/.
  Sem emoji e sem equipamento desenhado em SVG: equipamento só em arte .webp (imagens/) ou cena real; SVG só para ícone de interface 24×24 (class="ic").
-->
<style>
@font-face{font-family:'Roboto';font-style:normal;font-display:swap;font-weight:400 800;src:url(../app/fontes/roboto-latin-wght-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
@font-face{font-family:'Roboto';font-style:normal;font-display:swap;font-weight:400 800;src:url(../app/fontes/roboto-latin-ext-wght-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+20A0-20AB,U+20AD-20C0,U+2113,U+A720-A7FF;}
@font-face{font-family:'Figtree';font-style:normal;font-display:swap;font-weight:700 800;src:url(../app/fontes/figtree-latin-wght-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;}
@font-face{font-family:'Figtree';font-style:normal;font-display:swap;font-weight:700 800;src:url(../app/fontes/figtree-latin-ext-wght-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+20A0-20AB,U+20AD-20C0,U+2113,U+A720-A7FF;}
@font-face{font-family:'Roboto Mono';font-style:normal;font-display:swap;font-weight:600 800;src:url(../app/fontes/roboto-mono-latin-wght-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F,U+2212;}

*{box-sizing:border-box;margin:0;padding:0}
:root{--f-tit:'Figtree','Roboto',system-ui,sans-serif;--f-txt:'Roboto',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;--f-mono:'Roboto Mono',ui-monospace,Menlo,Consolas,monospace;
  --azul:#1D9BF0;--navy:#091E42;--folha:#F4F6F9;--cartao:#FFFFFF;--linha:#CBD5E1;--linha2:#E2E8F0;--txt:#0F172A;--txt2:#334155;--txt3:#64748B;--sel:#E0F2FE;--cab-claro:#DCE3EC}
html[data-tema="lua"]{--folha:#0F172A;--cartao:#111C2E;--linha:#24466F;--linha2:#1E2E48;--txt:#E2E8F0;--txt2:#CBD5E1;--txt3:#94A3B8;--sel:#173463;--cab-claro:#19365C}
html,body{height:100%}
body{overflow:hidden;font-family:var(--f-txt);color:var(--txt);background-color:#c1c0c1;background-image:url("../app/ref/acetinado-sedoso.svg");background-repeat:no-repeat;background-position:center;background-size:100% 100%;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
img{display:block;max-width:100%}
:focus-visible{outline:3px solid #67C6FF;outline-offset:2px}
.ic{display:block;flex-shrink:0}

/* ── Moldura GeloPRO: topo 50px · visor rolável no chassi acetinado · dock 3D 58px ── */
#topo{position:fixed;top:0;left:0;right:0;height:50px;z-index:40;display:flex;align-items:center;gap:8px;padding:0 10px;background:#091E42;color:#FFFFFF;box-shadow:0 2px 0 #D4D4D4,0 3px 6px rgba(4,12,28,.35)}
.marca{display:flex;align-items:center;gap:6px;flex-shrink:0}
.marca .mascote{width:30px;height:30px;border-radius:8px;background:#0A182D;border:1.5px solid #D4D4D4;padding:1px}
.marca .wordmark{height:15px;width:auto}
.ficha-sel{flex:1;min-width:0;height:38px;display:flex;align-items:center;gap:6px;padding:0 8px;border-radius:9px;background:linear-gradient(180deg,#0f1724 0%,#1a2333 100%) #1d2430;border:2px solid #071224;box-shadow:inset 0 3px 8px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.35);text-align:left}
.ficha-sel .txt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.1}
.ficha-sel .cod{font-family:var(--f-mono);font-size:10px;font-weight:800;color:#67C6FF;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ficha-sel .nome{font-family:var(--f-tit);font-size:12.5px;font-weight:800;color:#FFFFFF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tema{flex-shrink:0;position:relative;width:52px;height:28px;border-radius:999px;background:#0A182D;border:2px solid #24466F;display:flex;align-items:center;justify-content:space-between;padding:0 5px}
.tema .bola{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:linear-gradient(180deg,#F8FAFC,#D4D4D4);box-shadow:0 1px 2px rgba(0,0,0,.5);transition:transform .2s}
html[data-tema="lua"] .tema .bola{transform:translateX(24px)}
#visor{position:fixed;top:50px;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:10;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:10px 8px 16px}
#dock{position:fixed;left:0;right:0;bottom:0;z-index:40;height:calc(58px + env(safe-area-inset-bottom));padding:6px 8px calc(9px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr 1.45fr;gap:7px;background:#091E42;box-shadow:0 -2px 0 #D4D4D4}
.tecla{display:flex;align-items:center;justify-content:center;gap:6px;min-width:0;border-radius:11px;color:#FFFFFF;font-family:var(--f-tit);font-size:11.5px;font-weight:800;line-height:1.1;text-align:left;padding:0 7px;
  background:linear-gradient(180deg,#28559e 0%,#1c3f7a 54%,#122a54 100%);border:2px solid #071633;box-shadow:inset 0 2px 1px rgba(147,197,253,.48),inset 0 -4px 6px rgba(2,8,23,.62),0 4px 0 #071633,0 5.5px 0 rgba(255,255,255,.68),0 8px 14px rgba(4,12,28,.42);transition:transform .08s,box-shadow .08s}
.tecla:active{transform:translateY(3px);box-shadow:inset 0 2px 1px rgba(147,197,253,.48),inset 0 -4px 6px rgba(2,8,23,.62),0 1px 0 #071633,0 2px 0 rgba(255,255,255,.5)}
.tecla.verde{background:linear-gradient(180deg,#00b100 0%,#009900 54%,#006b00 100%);border-color:#003d00;box-shadow:inset 0 2px 1px rgba(187,247,208,.48),inset 0 -4px 6px rgba(0,35,0,.58),0 4px 0 #003d00,0 5.5px 0 rgba(255,255,255,.68),0 8px 14px rgba(0,40,0,.38)}
.tecla.verde:active{box-shadow:inset 0 2px 1px rgba(187,247,208,.48),inset 0 -4px 6px rgba(0,35,0,.58),0 1px 0 #003d00,0 2px 0 rgba(255,255,255,.5)}
.tecla.vermelha{background:linear-gradient(180deg,#DC2626 0%,#B91C1C 54%,#7F1D1D 100%);border-color:#450A0A;box-shadow:inset 0 2px 1px rgba(254,202,202,.45),inset 0 -4px 6px rgba(40,0,0,.55),0 4px 0 #450A0A,0 5.5px 0 rgba(255,255,255,.6),0 8px 14px rgba(40,0,0,.35)}
.tecla span{min-width:0}
.tecla span:has(> .ic){flex-shrink:0;min-width:auto;display:flex}

/* ── Ficha em 7 camadas ── */
.ficha{max-width:760px;margin:0 auto;background:var(--folha);border-radius:14px;overflow:hidden;box-shadow:0 2px 0 rgba(255,255,255,.7),0 8px 22px rgba(4,12,28,.28);border:2px solid #071633}
.c1{display:flex;justify-content:space-between;gap:10px;background:#091E42;color:#FFFFFF;padding:7px 12px;font-family:var(--f-tit);font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.c1 span{min-width:0}
.c1 b{white-space:nowrap}
.c2{padding:12px 12px 4px}
.c2 h1{font-family:var(--f-tit);font-weight:800;text-transform:uppercase;color:var(--navy);font-size:clamp(30px,9.4vw,62px);line-height:.95;letter-spacing:-.02em}
html[data-tema="lua"] .c2 h1{color:#FFFFFF}
.c2 p{font-family:var(--f-txt);font-weight:800;font-size:clamp(15px,4.3vw,24px);line-height:1.2;color:var(--txt);margin-top:6px}
.c3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 12px 10px}
.chip{display:flex;align-items:center;gap:6px;min-width:0;background:var(--cartao);border:1.5px solid var(--linha);border-radius:8px;padding:5px 6px}
.chip .tile{width:34px;height:34px;flex-shrink:0;border-radius:6px;background:#FFFFFF;display:flex;align-items:center;justify-content:center;overflow:hidden}
.chip .tile img{max-width:30px;max-height:30px;object-fit:contain}
.chip .tile img.foto{max-width:none;max-height:none;width:34px;height:34px;object-fit:cover}
.chip .t{min-width:0;display:flex;flex-direction:column;line-height:1.15}
.chip .k{font-size:9.5px;font-weight:700;color:var(--txt3);letter-spacing:.04em;text-transform:uppercase}
.chip .v{font-size:10.5px;font-weight:800;color:var(--txt);overflow-wrap:anywhere}
.c4{margin:0 12px;background:#FFFFFF;border:1.5px solid var(--linha);border-radius:10px;overflow:hidden}
.ilustra{position:relative}
.ilustra img{width:100%;height:auto}
.alvo{position:absolute;width:12%;max-width:58px;aspect-ratio:1/1;transform:translate(-50%,-50%);border-radius:50%;}
.alvo::after{content:"";position:absolute;inset:18%;border-radius:50%;border:3px solid #1D9BF0;opacity:0;animation:pulso 1.8s ease-out infinite}
.alvo.sel::after{border-color:#F59E0B;opacity:1;animation:none;box-shadow:0 0 0 4px rgba(245,158,11,.45),0 0 18px rgba(245,158,11,.75)}
@keyframes pulso{0%{opacity:.85;transform:scale(.9)}100%{opacity:0;transform:scale(1.7)}}
.fotos{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px}
.fotos button{position:relative;border-radius:8px;overflow:hidden;aspect-ratio:1/1;border:2px solid transparent}
.fotos button img{width:100%;height:100%;object-fit:cover}
.fotos button.sel{border-color:#F59E0B}
.fotos .n,.num{display:inline-flex;align-items:center;justify-content:center;font-family:var(--f-tit);font-weight:800;color:#FFFFFF;background:#1D9BF0}
.fotos .n{position:absolute;right:5px;top:18%;width:28px;height:28px;border-radius:50%;font-size:12.5px;border:2px solid #FFFFFF;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.det{display:none;margin:8px 12px 0;border-radius:12px;background:#0F172A;color:#E2E8F0;padding:11px 12px;font-size:13px;line-height:1.4}
.det.on{display:block;animation:surge .22s ease-out}
@keyframes surge{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.det .cab{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.det .cab .num{width:28px;height:28px;border-radius:6px;font-size:13px;flex-shrink:0}
.det .cab h4{font-family:var(--f-tit);font-size:15px;font-weight:800;color:#FFFFFF;flex:1 1 150px;min-width:0}
.det .par{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.det .par figure{position:relative;border-radius:8px;overflow:hidden;background:#FFFFFF}
.det .par img{width:100%;aspect-ratio:1/1;object-fit:cover}
.det .par figcaption{position:absolute;left:0;right:0;bottom:0;font-size:10.5px;font-weight:800;text-align:center;padding:3px;color:#FFFFFF}
.det .par .ok figcaption{background:rgba(21,128,61,.92)}
.det .par .df figcaption{background:rgba(185,28,28,.92)}
.det dl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px}
.det dt{font-weight:800;white-space:nowrap}
.det dd{min-width:0}
.det .esp{margin-top:8px;background:#14532D;color:#DCFCE7;border-radius:8px;padding:7px 9px;font-weight:700}
.det .fonte{font-size:11px;color:#94A3B8;margin-top:6px}
.det .teclas{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.det .teclas .tecla{height:46px;font-size:12.5px;justify-content:center;text-align:center}
.c5{display:grid;grid-template-columns:1fr;gap:10px;padding:12px 12px 0}
.bloco-h{background:#091E42;color:#FFFFFF;font-family:var(--f-tit);font-weight:800;font-size:14px;letter-spacing:.03em;text-transform:uppercase;padding:6px 10px}
.freq{display:flex;height:22px;margin:6px 0 4px;border-radius:6px;overflow:hidden;font-size:10.5px;font-weight:800;color:#FFFFFF}
.freq button{display:flex;align-items:center;justify-content:center;min-width:0;white-space:nowrap;overflow:hidden;padding:0 4px}
.freq-leg{font-size:10.5px;color:var(--txt3);margin-bottom:2px}
.causa{display:grid;grid-template-columns:34px 46px 1fr;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 6px;border-bottom:1px solid var(--linha2);border-radius:6px;transition:background .2s}
.causa .num{width:34px;height:34px;border-radius:5px;font-size:15px}
.causa .ico{width:46px;height:46px;border-radius:6px;background:#FFFFFF;display:flex;align-items:center;justify-content:center;overflow:hidden}
.causa .ico img{max-width:44px;max-height:44px;object-fit:contain}
.causa .ico img.foto{width:46px;height:46px;max-width:none;max-height:none;object-fit:cover}
.causa .t{min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.causa .nm{font-family:var(--f-tit);font-weight:800;font-size:14.5px;color:var(--txt);line-height:1.2}
.pilula{font-family:var(--f-tit);font-size:10.5px;font-weight:800;letter-spacing:.04em;border-radius:999px;padding:2px 12px;border:1.5px solid var(--linha);color:var(--txt2);background:var(--cartao);white-space:nowrap}
.pilula.medir{border-color:#F97316;color:#EA580C}
.pilula.ok{border-color:#16A34A;background:#DCFCE7;color:#14532D}
.pilula.def{border-color:#DC2626;background:#FEE2E2;color:#7F1D1D}
.causa.sel,.verif.sel{background:var(--sel)}
.verifs{position:relative;padding:4px 0 0}
.verif{position:relative;display:grid;grid-template-columns:40px 1fr;gap:10px;width:100%;text-align:left;padding:7px 6px;border-bottom:1px solid var(--linha2);border-radius:6px;transition:background .2s}
.verif .bol{position:relative;z-index:1;width:36px;height:36px;border-radius:50%;background:#1D9BF0;color:#FFFFFF;font-family:var(--f-tit);font-weight:800;font-size:13.5px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px var(--folha)}
.verif.ok .bol{background:#16A34A}.verif.def .bol{background:#DC2626}
.verif:not(:last-child)::before{content:"";position:absolute;left:23px;top:40px;bottom:-10px;width:3px;background:#1D9BF0}
.verif .tt{font-family:var(--f-tit);font-weight:800;font-size:14.5px;color:var(--txt);line-height:1.2}
.verif .ln{display:flex;gap:6px;align-items:flex-start;font-size:13px;color:var(--txt2);margin-top:3px;line-height:1.3}
.c6{margin:12px 12px 0;border:1.5px solid var(--linha);border-radius:8px;overflow:hidden;background:var(--cartao)}
.c6 h3{background:var(--cab-claro);color:var(--navy);font-family:var(--f-tit);font-weight:800;font-size:17px;text-transform:uppercase;padding:6px 12px}
html[data-tema="lua"] .c6 h3{color:#FFFFFF}
.prox{display:grid;grid-template-columns:1fr 22px 1.15fr;align-items:center;gap:8px;width:100%;text-align:left;padding:8px 12px;border-top:1px solid var(--linha2);font-size:13px}
.prox .se{font-weight:700;color:var(--txt)}
.prox .se b{font-weight:800}
.prox .entao{color:var(--txt2)}
.prox .preco{display:block;font-size:11.5px;font-weight:800;color:#008A00;margin-top:2px}
.c7{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;margin:12px 12px 0;background:linear-gradient(180deg,#F07A12,#E2650A);border-radius:8px;padding:10px 12px;color:#FFFFFF}
.c7 .tri{border-right:2px solid rgba(255,255,255,.45);padding-right:10px}
.c7 b{display:block;font-family:var(--f-tit);font-weight:800;font-size:15px;letter-spacing:.03em;text-transform:uppercase}
.c7 p{font-size:13px;font-weight:700;line-height:1.35;margin-top:2px}
.rodape{display:flex;justify-content:space-between;gap:10px;margin-top:12px;background:#091E42;color:#FFFFFF;padding:8px 12px;font-family:var(--f-tit);font-size:11px;font-weight:800;letter-spacing:.03em}
.rodape span{min-width:0}

/* ── Folhas (índice, causa, orçamento, bônus) ── */
.fundo{position:fixed;inset:0;background:rgba(9,30,66,.55);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.fundo.aberto{opacity:1;pointer-events:auto}
.folha{position:fixed;left:0;right:0;bottom:0;z-index:61;max-height:88dvh;overflow-y:auto;background:#FFFFFF;color:#0F172A;border-radius:18px 18px 0 0;transform:translateY(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-width:640px;margin:0 auto;padding:8px 14px calc(22px + env(safe-area-inset-bottom))}
.folha.aberto{transform:none}
.folha .alca{width:44px;height:5px;border-radius:3px;background:#CBD5E1;margin:2px auto 10px}
.folha .fechar{position:absolute;right:10px;top:8px;width:36px;height:36px;border-radius:50%;background:#F1F5F9;display:flex;align-items:center;justify-content:center}
.folha h3{font-family:var(--f-tit);font-size:19px;font-weight:800;color:#091E42;line-height:1.25;margin:0 44px 8px 0}
.folha .sub{font-size:13px;color:#475569;margin-bottom:12px;line-height:1.4}
.folha .pilha{display:grid;gap:10px}
.folha .tecla{height:50px;font-size:14px;justify-content:center;text-align:center}
.folha .tecla.clara{background:#F1F5F9;color:#091E42;border:1.5px solid #CBD5E1;box-shadow:none}
.busca{display:flex;align-items:center;gap:8px;background:#FFFFFF;border:1.5px solid #CBD5E1;border-radius:12px;padding:0 12px;height:44px}
.busca input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:15px}
.blocos{display:flex;gap:6px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none}
.blocos::-webkit-scrollbar{display:none}
.blocos button{flex-shrink:0;padding:6px 11px;border-radius:999px;border:1px solid #CBD5E1;font-size:12.5px;font-weight:700;white-space:nowrap}
.blocos button[aria-pressed="true"]{background:#091E42;border-color:#091E42;color:#FFFFFF}
.item-ficha{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center;width:100%;text-align:left;padding:9px 2px;border-bottom:1px solid #F1F5F9}
.item-ficha .ico{width:52px;height:52px;border-radius:10px;overflow:hidden;background:#F1F5F9}
.item-ficha .ico img{width:100%;height:100%;object-fit:cover}
.item-ficha .cod{font-family:var(--f-mono);font-size:10.5px;font-weight:800;color:#1D9BF0}
.item-ficha .nm{font-family:var(--f-tit);font-size:14.5px;font-weight:800;color:#0F172A;line-height:1.2}
.item-ficha .sb{font-size:12px;color:#64748B}
.item-ficha.atual{background:#E0F2FE;border-radius:10px}
.vazio{border:1px dashed #CBD5E1;border-radius:12px;padding:14px;text-align:center;font-size:14px;color:#334155}
.vazio .pilha{margin-top:10px}
.confirmada{border-radius:12px;background:#FEF2F2;border:2px solid #DC2626;padding:12px;margin-bottom:12px}
.confirmada .k{font-size:11px;font-weight:800;letter-spacing:.08em;color:#B91C1C}
.confirmada .v{font-family:var(--f-tit);font-size:17px;font-weight:800;color:#7F1D1D;margin-top:2px;line-height:1.25}
.servico{border:1px solid #E2E8F0;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13.5px;line-height:1.4}
.servico .faixa{display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-weight:800;color:#091E42;flex-wrap:wrap}
.servico .ref{font-size:11.5px;color:#64748B;margin-top:4px}
.form{display:grid;gap:10px;margin:6px 0 12px}

// ───────────── Utilidades e estado ─────────────
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (t) => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const norm = (t) => String(t).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const brl = (v) => 'R$ ' + Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const faixa = (id) => `R$\u00A0${PRECOS[id][1].toLocaleString('pt-BR')}\u00A0a R$\u00A0${PRECOS[id][3].toLocaleString('pt-BR')}`;
const nn = (i) => String(i).padStart(2, '0');
// Caixa alta preservando µ (toUpperCase/text-transform transformam µ em Μ grego, que lê como "M").
const caixaAlta = (t) => esc(t).split('µ').map(x => x.toUpperCase()).join('µ');
// R$ e o valor nunca quebram de linha.
const reais = (t) => esc(t).replace(/R\$ /g, 'R$\u00A0').replace(/ a R\$/g, '\u00A0a R$');
const guardar = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const ler = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const visor = $('#visor');
const S = { idx: 0, sel: 0, estado: {}, defeito: {} };   // estado[ficha][causa] = 'ok' | 'def'
const fichaAtual = () => F[S.idx];
const servicoAtual = () => { const f = fichaAtual(); return S.defeito[f.id] || f.causas[f.freq[0][2][0] - 1].servico; };
const icoCausa = (c) => c.ico ? `<img src="${c.ico}" alt="">` : `<img class="foto" src="${CENA(c.foto[1])}" alt="">`;

// ───────────── Ficha em 7 camadas ─────────────
function montarFicha(i) {
  S.idx = i; S.sel = 0; const f = F[i]; S.estado[f.id] = S.estado[f.id] || {};
  const st = S.estado[f.id];
  const pil = (k) => st[k] === 'ok' ? '<span class="pilula ok">DESCARTADA</span>' : st[k] === 'def' ? '<span class="pilula def">CONFIRMADA</span>' : `<span class="pilula${k === f.causas.findIndex((c, j) => !st[j + 1]) + 1 ? ' medir' : ''}">A VALIDAR</span>`;
  const quadro = f.ilustra
    ? `<div class="ilustra"><img src="${f.ilustra.src}" alt="Condensadora aberta com os 5 pontos de medição" width="${f.ilustra.w}" height="${f.ilustra.h}">${f.ilustra.alvos.map(([x, y], k) => `<button class="alvo" data-k="${k + 1}" style="left:${x}%;top:${y}%" aria-label="Ponto ${nn(k + 1)}: ${esc(f.causas[k].nome)}"></button>`).join('')}</div>`
    : `<div class="fotos">${f.causas.map((c, k) => `<button data-k="${k + 1}" aria-label="Ponto ${nn(k + 1)}: ${esc(c.nome)}"><img src="${CENA(c.foto[0])}" alt="${esc(c.nome)}"><span class="n">${nn(k + 1)}</span></button>`).join('')}</div>`;
  visor.innerHTML = `<article class="ficha" data-ficha="${f.id}" ${f.calibrar ? 'data-calibrar="1"' : ''}>
    <div class="c1"><span>+120 Diagnósticos · Ar-condicionado split</span><b>${f.n} · ${f.area}</b></div>
    <div class="c2"><h1>${esc(f.titulo)}</h1><p>${esc(f.sub)}</p></div>
    <div class="c3">${f.chips.map(([src, k, v]) => `<div class="chip"><span class="tile"><img ${src.includes('/cenas/') ? 'class="foto" ' : ''}src="${src}" alt=""></span><span class="t"><span class="k">${esc(k)}</span><span class="v">${caixaAlta(v)}</span></span></div>`).join('')}</div>
    <div class="c4" data-img-slot="ficha-${f.id}">${quadro}</div>
    <div class="det" aria-live="polite"></div>
    <div class="c5">
      <section><div class="bloco-h">Causas mais prováveis</div>
        <div class="freq" role="group" aria-label="Frequência das causas">${f.freq.map(([p, r, ks], j) => `<button data-k="${ks[0]}" style="width:${p}%;background:${COR_FREQ[j]}" aria-label="${p}% ${esc(r)}">${p}%</button>`).join('')}</div>
        <div class="freq-leg">${f.freq.map(([p, r]) => `${p}% ${esc(r)}`).join(' · ')}</div>
        ${f.causas.map((c, k) => `<button class="causa" data-k="${k + 1}"><span class="num">${nn(k + 1)}</span><span class="ico">${icoCausa(c)}</span><span class="t"><span class="nm">${esc(c.nome)}</span>${pil(k + 1)}</span></button>`).join('')}
      </section>
      <section><div class="bloco-h">Verificações na ordem</div>
        <div class="verifs">${f.causas.map((c, k) => `<button class="verif${st[k + 1] ? ' ' + st[k + 1] : ''}" data-k="${k + 1}"><span class="bol">${nn(k + 1)}</span><span><span class="tt">${esc(c.verif)}</span><span class="ln">${ic('check', '#16A34A', 18)}<span>${esc(c.linha)}</span></span></span></button>`).join('')}</div>
      </section>
    </div>
    <section class="c6"><h3>Próximo passo</h3>${f.proximo.map(([se, entao, srv]) => `<button class="prox" data-srv="${srv}"><span class="se"><b>SE</b> ${esc(se)}</span>${ic('seta', '#1D9BF0', 22)}<span class="entao">${esc(entao)}<span class="preco">Orçar: ${faixa(srv)}</span></span></button>`).join('')}</section>
    <div class="c7"><span class="tri">${alerta(42)}</span><div><b>Antes de trocar a peça:</b><p>${reais(f.antes)}</p></div></div>
    <div class="rodape"><span>GELOPRO · GUIA DE DIAGNÓSTICO</span><span>${esc(f.rodape)} · ${f.id}</span></div>
  </article>`;
  visor.scrollTop = 0;
  $('#sel-cod').textContent = `${f.id} · ${f.area}`; $('#sel-nome').textContent = f.titulo;
  $$('[data-k]', visor).forEach(b => b.addEventListener('click', () => selecionar(+b.dataset.k, !b.closest('.c4'))));
  $$('.prox', visor).forEach(b => b.addEventListener('click', () => abrirOrcamento(b.dataset.srv)));
  try { history.replaceState(null, '', '#' + f.id); } catch (e) {}
}
function selecionar(k, rolarAoQuadro) {
  const f = fichaAtual(), c = f.causas[k - 1]; S.sel = k;
  $$('.alvo,.fotos button,.causa,.verif', visor).forEach(e => e.classList.toggle('sel', +e.dataset.k === k));
  const det = $('.det', visor), st = S.estado[f.id];
  det.innerHTML = `<div class="cab"><span class="num">${nn(k)}</span><h4>${esc(c.nome)}</h4></div>
    ${c.foto ? `<div class="par"><figure class="ok"><img src="${CENA(c.foto[0])}" alt="Normal"><figcaption>NORMAL</figcaption></figure><figure class="df"><img src="${CENA(c.foto[1])}" alt="Defeito"><figcaption>DEFEITO</figcaption></figure></div>` : ''}
    <dl>${c.vermelho ? `<dt style="color:#F87171">Ponta vermelha</dt><dd>${esc(c.vermelho)}</dd><dt style="color:#E5E7EB">Ponta preta</dt><dd>${esc(c.preto)}</dd>` : `<dt style="color:#67C6FF">Onde</dt><dd>${esc(c.onde)}</dd>`}<dt style="color:#94A3B8">Escala</dt><dd>${esc(c.escala)}</dd></dl>
    <div class="esp">Leitura esperada: ${esc(c.esperado)}</div>
    <div class="fonte">Fonte: ${esc(c.fonte)}</div>
    <div class="teclas"><button class="tecla" data-r="ok">${ic('check', '#FFFFFF', 18)}<span>Normal</span></button><button class="tecla vermelha" data-r="def">${ic('x', '#FFFFFF', 18)}<span>Defeito</span></button></div>`;
  det.classList.add('on');
  $('[data-r=ok]', det).addEventListener('click', () => marcar(k, 'ok'));
  $('[data-r=def]', det).addEventListener('click', () => marcar(k, 'def'));
  if (rolarAoQuadro) $('.c4', visor).scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function marcar(k, r) {
  const f = fichaAtual(), st = S.estado[f.id]; st[k] = r;
  const sel = k; montarFicha(S.idx);
  if (r === 'def') { S.defeito[f.id] = f.causas[k - 1].servico; selecionar(sel); abrirCausa(f, k); return; }
  const prox = f.causas.findIndex((c, j) => !st[j + 1]) + 1;
  if (prox) { selecionar(prox); $('.c4', visor).scrollIntoView({ block: 'start' }); } else abrirFim(f);
}

// ───────────── Folhas ─────────────
const fundo = $('#fundo'), modal = $('#modal');
const fechar = () => { modal.classList.remove('aberto'); fundo.classList.remove('aberto'); };
function abrir(html, depois) {
  modal.innerHTML = `<div class="alca"></div><button class="fechar" aria-label="Fechar">${ic('x', '#334155', 18)}</button>${html}`;
  modal.classList.add('aberto'); fundo.classList.add('aberto'); modal.scrollTop = 0;
  $('.fechar', modal).addEventListener('click', fechar);
  if (depois) depois(modal);
}
fundo.addEventListener('click', fechar);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') fechar(); });
const blocoServico = (id) => { const s = PRECOS[id]; return `<div class="servico"><b>${esc(s[0])}</b><div class="faixa"><span>Faixa: ${brl(s[1])} a ${brl(s[3])}</span><span>Típico: ${brl(s[2])}</span></div><div class="ref">Tabela de preços GeloPro 2026 · referência de campo</div></div>`; };
const teclaOrcar = (rot = 'Orçar este Reparo (PDF Nº 1001 + Pix)') => `<button class="tecla verde" data-a="orc">${ic('doc', '#FFFFFF', 20)}<span>${rot}</span></button>`;

function abrirCausa(f, k) {
  const c = f.causas[k - 1];
  abrir(`<h3>Causa confirmada</h3><div class="confirmada"><div class="k">${f.id} · PONTO ${nn(k)}</div><div class="v">${esc(c.nome)}</div></div>${blocoServico(c.servico)}
    <div class="pilha">${teclaOrcar()}<button class="tecla" data-a="afer">${ic('calc', '#FFFFFF', 20)}<span>Aferidor deste componente</span></button><button class="tecla clara" data-a="voltar"><span>Voltar à ficha</span></button></div>`, (m) => {
    $('[data-a=orc]', m).addEventListener('click', () => abrirOrcamento(c.servico));
    $('[data-a=afer]', m).addEventListener('click', () => abrirAferidor(f, k));
    $('[data-a=voltar]', m).addEventListener('click', fechar);
  });
}
function abrirFim(f) {
  const prox = F[(F.indexOf(f) + 1) % F.length];
  abrir(`<h3>Todos os pontos deram normal</h3><div class="sub">A ficha ${f.id} descartou as causas mais prováveis. Feche a visita com o diagnóstico instrumentado e siga para a ficha vizinha.</div>${blocoServico('visita_diag')}
    <div class="pilha">${teclaOrcar('Orçar a visita (PDF Nº 1001 + Pix)')}<button class="tecla" data-a="prox"><span>Abrir ${prox.id} · ${esc(prox.titulo)}</span></button><button class="tecla clara" data-a="cod"><span>Conferir códigos de erro (Bônus 2)</span></button></div>`, (m) => {
    $('[data-a=orc]', m).addEventListener('click', () => abrirOrcamento('visita_diag'));
    $('[data-a=prox]', m).addEventListener('click', () => { fechar(); montarFicha(F.indexOf(prox)); });
    $('[data-a=cod]', m).addEventListener('click', () => abrirBonus(1));
  });
}

// Índice (120): busca por sintoma ou código e 8 blocos
let bloco = 'todos', termo = '';

// Aferidores vivos. Faixas com fonte: tensão ±10%, SH e ΔT (F14 Elgin), P-N (F20 Midea), NTC (F18/F24/F26), capacitor −5% (regra do Pedro).
const NTC_OPS = [['Samsung 10K (±2%)', 10, 2], ['Midea/Springer/Carrier 10K (±3%)', 10, 3], ['Daikin 10K (9,90 a 10,10 kΩ)', 10, 1]];

  cap: { tit: 'Aferidor de capacitor (µF)', campos: [['nom', 'µF da etiqueta', 'num'], ['med', 'µF medido', 'num']], calc: (v) => { const n = +v.nom, m = +v.med; if (!n || !m) return null; return { ok: m >= n * 0.95, txt: `Mínimo aceito: ${(n * 0.95).toFixed(1)} µF (−5% da etiqueta) · desvio ${((m - n) / n * 100).toFixed(1)}%` }; } },
  csr: { tit: 'Aferidor do compressor C-S-R', campos: [['cs', 'C-S (Ω)', 'num'], ['cr', 'C-R (Ω)', 'num'], ['sr', 'S-R (Ω)', 'num'], ['massa', 'Algum pino tem continuidade com a carcaça', 'chk']], calc: (v) => { if (v.massa) return { ok: false, txt: 'Compressor em massa: condenar com laudo' }; const cs = +v.cs, cr = +v.cr, sr = +v.sr; if (!cs || !cr || !sr) return null; return { ok: null, txt: `C-S + C-R = ${(cs + cr).toFixed(2)} Ω · S-R medido = ${sr.toFixed(2)} Ω. Bateu a soma e sem massa: enrolamentos íntegros.` }; } },
  deltat: { tit: 'Aferidor ΔT retorno × insuflamento', campos: [['ret', 'Retorno (°C)', 'num'], ['ins', 'Insuflamento (°C)', 'num']], calc: (v) => { if (v.ret === '' || v.ins === '') return null; const d = +v.ret - +v.ins; return { ok: d >= 10 && d <= 15, txt: `ΔT = ${d.toFixed(1)} °C · faixa 10 a 15 °C (F14)` }; } },

  pn: { tit: 'Aferidor do barramento P-N', campos: [['med', 'Tensão P-N medida (V CC)', 'num']], calc: (v) => { const m = +v.med; if (!m) return null; return { ok: m >= 290 && m <= 330, txt: 'Espera: 290 a 330 V CC; cerca de 310 V CC em 208–230 V (F20)' }; } },
  ipm: { tit: 'Aferidor do módulo IPM', campos: ['P → N', 'P → U', 'P → V', 'P → W', 'U → N', 'V → N', 'W → N'].map((k, i) => ['p' + i, `${k}: leitura baixa (não deu infinito)`, 'chk']), calc: (v) => { const r = Object.values(v).filter(Boolean).length; return { ok: r === 0, txt: r ? `${r} par(es) com leitura baixa: IPM em curto (F20 p. 85)` : 'Todos os pares em infinito: IPM sem curto (F20 p. 85)' }; } },
  ntc: { tit: 'Aferidor de sensor NTC (a 25 °C)', campos: [['tipo', 'Sensor', 'sel', NTC_OPS.map((o, i) => [String(i), o[0]])], ['med', 'Resistência a 25 °C (kΩ)', 'num']], calc: (v) => { const o = NTC_OPS[+v.tipo], m = +v.med; if (!m) return null; const lo = o[1] * (1 - o[2] / 100), hi = o[1] * (1 + o[2] / 100); return { ok: m >= lo && m <= hi, txt: `Faixa a 25 °C: ${lo.toFixed(2)} a ${hi.toFixed(2)} kΩ. Em outra temperatura, compare na curva da marca (ferramenta Sensor NTC do app).` }; } },
  massa: { tit: 'Aferidor de isolamento C-S-R → carcaça', campos: ['C', 'S', 'R'].map(k => ['m' + k, `Pino ${k} tem continuidade com a carcaça`, 'chk']), calc: (v) => { const r = Object.values(v).filter(Boolean).length; return { ok: r === 0, txt: r ? 'Compressor em massa: não religar, condenar com laudo' : 'Sem fuga para a carcaça' }; } },

function abrirAferidor(f, k) {
  const c = f.causas[k - 1], a = AFERIDORES[c.aferidor];
  const campos = c.aferidor === 'lista' ? c.check.map((t, j) => ['c' + j, t, 'chk']) : a.campos;
  const html = campos.map(([id, rot, tipo, ops]) => tipo === 'chk' ? `<label class="chk"><input type="checkbox" data-id="${id}"> ${esc(rot)}</label>`
    : tipo === 'sel' ? `<label>${esc(rot)}<select data-id="${id}">${ops.map(o => `<option value="${o[0]}">${esc(o[1])}</option>`).join('')}</select></label>`
    : `<label>${esc(rot)}<input type="number" inputmode="decimal" step="any" data-id="${id}"></label>`).join('');
  abrir(`<h3>${esc(a.tit)}</h3><div class="sub">${f.id} · ponto ${nn(k)} · ${esc(c.nome)}</div><div class="form">${html}</div><div class="veredito neutro" aria-live="polite">Preencha a medição para ver o veredito.</div>${blocoServico(c.servico)}
    <div class="pilha">${teclaOrcar()}<button class="tecla clara" data-a="voltar"><span>Voltar à ficha</span></button></div>`, (m) => {
    const ver = $('.veredito', m);

  });
}

// Orçamento Nº 1001 com assinatura na tela e prévia do QR Pix (canvas)
function qrPrevia(cv, semente) {
  let h = 2166136261; for (const ch of semente) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; }
  const rnd = () => { h ^= h << 13; h >>>= 0; h ^= h >> 17; h ^= h << 5; h >>>= 0; return h / 4294967296; };
  const N = 25, x = cv.getContext('2d'); cv.width = N + 2; cv.height = N + 2;
  x.fillStyle = '#FFFFFF'; x.fillRect(0, 0, N + 2, N + 2); x.fillStyle = '#091E42';
  for (let y = 0; y < N; y++) for (let z = 0; z < N; z++) { const canto = (z < 8 && y < 8) || (z > 16 && y < 8) || (z < 8 && y > 16); if (!canto && rnd() > 0.52) x.fillRect(z + 1, y + 1, 1, 1); }
  [[0, 0], [18, 0], [0, 18]].forEach(([a, b]) => { x.fillStyle = '#091E42'; x.fillRect(a + 1, b + 1, 7, 7); x.fillStyle = '#FFFFFF'; x.fillRect(a + 2, b + 2, 5, 5); x.fillStyle = '#091E42'; x.fillRect(a + 3, b + 3, 3, 3); });
}

    requestAnimationFrame(() => { const r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1; cv.width = r.width * d; cv.height = r.height * d; const c = cv.getContext('2d'); c.scale(d, d); c.lineWidth = 2.4; c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = '#091E42'; });

    depois = (m) => { const cks = $$('[data-c]', m), bar = $('.progresso i', m), v = $('[data-v]', m); cks.forEach(c => c.addEventListener('change', () => { const n = cks.filter(x => x.checked).length; bar.style.width = (n / 7 * 100) + '%'; v.className = 'veredito ' + (n === 7 ? 'ok' : 'neutro'); v.textContent = n === 7 ? '7 de 7: pode condenar a peça com laudo' : `${n} de 7 conferidos`; })); }; }
  if (i === 4) { const f = fichaAtual(); html = `<div class="sub">Laudo em 1 toque quando o reparo não compensa: peça condenada, medições e recomendação, com a sua assinatura.</div><div class="orc"><div class="cab"><div><b>Laudo técnico</b><div style="font-size:12px;color:#475569">Condenação de componente</div></div><span>Nº 1001<br>${new Date().toLocaleDateString('pt-BR')}</span></div>
      <div class="item"><span>Ficha</span><b>${f.id} · ${esc(f.titulo)}</b></div><div class="item"><span>Medições anexadas</span><b>Pontos 01 a ${nn(f.causas.length)}</b></div><div class="item"><span>Recomendação</span><b>Troca do componente ou aparelho novo</b></div></div><div class="pilha">${teclaOrcar()}</div>`; }
  abrir(cab + html, (m) => {
    if (depois) depois(m);
    $$('[data-ir]', m).forEach(b => b.addEventListener('click', () => { fechar(); montarFicha(+b.dataset.ir); }));
    $$('[data-af]', m).forEach(b => b.addEventListener('click', () => { const [fi, k] = b.dataset.af.split(':').map(Number); abrirAferidor(F[fi], k); }));
    $$('[data-a=orc]', m).forEach(b => b.addEventListener('click', () => abrirOrcamento(servicoAtual())));
    $$('[data-b]', m).forEach(b => b.addEventListener('click', () => abrirBonus(+b.dataset.b)));
  });
}

// ───────────── Moldura: ícones, tema e dock ─────────────
$('#sel-seta').innerHTML = ic('baixo', '#67C6FF', 18);
$('#ic-sol').innerHTML = ic('sol', '#F5B800', 14); $('#ic-lua').innerHTML = ic('lua', '#CBD5E1', 14);
$('#ic-d1').innerHTML = ic('lista', '#FFFFFF', 20); $('#ic-d2').innerHTML = ic('presente', '#FFFFFF', 20); $('#ic-d3').innerHTML = ic('doc', '#FFFFFF', 20);
const aplicarTema = (t) => { document.documentElement.dataset.tema = t; guardar('guiapro.tema', t); };
aplicarTema(ler('guiapro.tema') === 'lua' ? 'lua' : 'sol');
$('#b-tema').addEventListener('click', () => aplicarTema(document.documentElement.dataset.tema === 'lua' ? 'sol' : 'lua'));
$('#b-ficha').addEventListener('click', abrirIndice);
$('#d-indice').addEventListener('click', abrirIndice);
$('#d-bonus').addEventListener('click', abrirMenuBonus);
$('#d-orcar').addEventListener('click', () => abrirOrcamento(servicoAtual()));

// Início: #D-001 (padrão) até #D-006 abrem a ficha direto.
function iniciar() { const m = location.hash.match(/D-00(\d)/); const i = m ? F.findIndex(f => f.id === 'D-00' + m[1]) : 0; montarFicha(i >= 0 ? i : 0); }
window.addEventListener('hashchange', iniciar);
iniciar();
</script>
