/* Só o que o estilo em linha do pacote não alcança: reinício do navegador, estados :active/:disabled/:focus do contrato de marcação,
   dock fixo de chapa opaca (some com gaveta ou teclado aberto), o rótulo curto do dock abaixo de 390 px e a trava de instrumento nativo
   do celular (sem pinça nem toque duplo de zoom, sem rolagem lateral; o único zoom é o 1,85× da ilustração; fundo do tema escolhido). */
html,body{margin:0;padding:0;background:#DBD8D1;-webkit-text-size-adjust:100%;touch-action:manipulation;width:100%}
html{overflow-x:hidden}
html[data-tema="claro"],html[data-tema="claro"] body{background:#DBD8D1;color-scheme:light}
html[data-tema="escuro"],html[data-tema="escuro"] body{background:#171B20;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:inherit}
img{display:block}
input{padding:0;margin:0;font:inherit}
[data-tecla]:active{transform:translateY(2px)}
[data-tecla]:disabled,button:disabled{opacity:.45;cursor:default}
input[type="number"]:focus,input[type="search"]:focus,input[type="text"]:focus,input[type="tel"]:focus{outline:3px solid #FFB020;outline-offset:2px}
input[aria-invalid="true"]{outline:3px solid #B91C1C;outline-offset:2px}
input[type="number"]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
#tela>[data-gaveta]{z-index:20}
[data-dc-host] input[type="range"]{touch-action:none}
.dk-curto{display:none}
@media (max-width:389px){.dk-longo{display:none}.dk-curto{display:inline}}
body[data-teclado] .dock-fixo{display:none}
/* Rolagem de instrumento (Pedro, 13/11/2026): sem o puxão elástico do arrasto vertical (o rastro fantasma atrás do dock e do cabeçalho);
   o dock de chapa opaca vai numa camada própria de GPU, então nunca repinta atrasado nem deixa vazar conteúdo por trás durante o scroll nativo. */
html,body{overscroll-behavior-y:none}
.dock-fixo{transform:translateZ(0);-webkit-backface-visibility:hidden;backface-visibility:hidden}
/* Fluidez manteiga dentro da L30 (só 200 ms e 300 ms ease): entrada da tela nova (opacidade + 8 px na GPU, o dock e a área segura não se
   movem), folha da gaveta subindo com o fundo escurecendo e dobra abrindo e fechando pela altura. As classes só existem durante o movimento
   (o JS tira ao fim); nunca entram com ?prancha=1 nem com movimento reduzido, e nenhum toque espera o movimento acabar. */
.mv-entra>:not(.dock-fixo):not([data-area-segura]):not([data-gaveta]){opacity:0;transform:translateY(8px)}
.mv-anda>:not(.dock-fixo):not([data-area-segura]):not([data-gaveta]){transition:opacity 200ms ease,transform 200ms ease}
.mv-gav-ini{opacity:0}
.mv-gav-ini>:first-child{transform:translateY(100%)}
.mv-gav{transition:opacity 300ms ease}
.mv-gav>:first-child{transition:transform 300ms ease}
@media (prefers-reduced-motion:reduce){.mv-anda>*,.mv-gav,.mv-gav>*,[data-dobra]{transition:none!important}}
/* Marca oficial final (design_handoff_marca_gelopro, VERSÃO FINAL · ESCOLHA DO PEDRO): marca.css do pacote, literal. 1em = altura da marca ÷ 10;
   no cabeçalho, 44 px (font-size 4.4px). Chapa titânio no Claro (#DBD8D1) e chapa grafite no Escuro (#171B20), gravadas pelo filtro SVG do pacote. */
.gp-marca{display:inline-flex;align-items:center;gap:.944em;line-height:1;white-space:nowrap;font-size:4.4px;color:var(--gp-gelo,#0C2747);filter:var(--gp-fx,none)}
.gp-marca__urso{position:relative;flex:none;width:10em;height:10em;overflow:hidden;border-radius:2.2em;background:var(--gp-tile,#0C2747);box-shadow:inset 0 0 0 max(1px,.12em) var(--gp-ring,transparent)}
.gp-marca__urso img{position:absolute;left:50%;top:.5em;height:13.2em;width:auto;transform:translateX(-50%)}
.gp-marca__texto{display:inline-grid;align-content:space-between;height:10em}
/* Régua: peça invisível de largura zero com a altura da letra maiúscula. Trava cada linha pela linha de base. Não remover. */
.gp-marca__regua{flex:none;width:0;height:.7em}
.gp-marca__linha{box-sizing:border-box;display:flex;align-items:baseline;width:0;min-width:calc(100% + .0726em);padding-left:.042em;font:700 2.6071em/0 'Barlow Semi Condensed',sans-serif}
.gp-marca__linha--mono{min-width:calc(100% + .0869em);padding-left:0;font-size:2.5em;font-family:'JetBrains Mono',monospace}
.gp-marca__linha--mono .gp-marca__regua{height:.73em}
.gp-marca__letras{flex:1;display:flex;align-items:baseline;justify-content:space-between}
.gp-marca__letras i{width:.12em}
.gp-marca__nome{font:italic 800 5.9em/0 'Barlow Semi Condensed',sans-serif;letter-spacing:-.005em}
.gp-marca__nome .gp-marca__regua{display:inline-block}
.gp-marca__nome b{font:inherit;color:var(--gp-pro,#0284C7)}
.gp-fundo-claro{--gp-gelo:#0C2747;--gp-pro:#0284C7}
.gp-fundo-marinho{--gp-gelo:#F1F5F9;--gp-pro:#38BDF8;--gp-ring:rgba(241,245,249,.32)}
.gp-chapa-titanio{--gp-gelo:#0C2747;--gp-pro:#0284C7;--gp-fx:url(#gp-gravado-claro)}
.gp-chapa-grafite{--gp-gelo:#F1F5F9;--gp-pro:#38BDF8;--gp-ring:rgba(241,245,249,.22);--gp-fx:url(#gp-gravado-escuro)}
/* Revelação suave das artes (Pedro, 13/11/2026, L30): ilustrações, recortes e os 48 tiles nascem na caixa exata do estilo do pacote (CLS 0),
   com o fundo suave do tema (titânio no Claro, grafite no Escuro) enquanto decodificam, e entram por opacidade em 200 ms ease. Arte já em
   memória ou no cache entra na hora (data-img="pronta"), sem piscar branco; nada disso com ?prancha=1 nem com movimento reduzido. */
#app img[data-img="carrega"]{background-color:#EFEDE8}
html[data-tema="escuro"] #app img[data-img="carrega"]{background-color:#262C34}
#app img[data-img="entra"]{opacity:0}
#app img[data-img="ok"]{opacity:1;transition:opacity 200ms ease}
@media (prefers-reduced-motion:reduce){#app img[data-img]{opacity:1!important;transition:none!important}}
#toast{position:fixed;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
