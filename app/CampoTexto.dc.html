<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<label style="display:flex;flex-direction:column;gap:6px;min-width:0;">
  <sc-if value="{{ temRotulo }}" hint-placeholder-val="{{ true }}"><span style="font:600 16px/22px 'Roboto',sans-serif;color:{{ corRotulo }};">{{ rotulo }}</span></sc-if>
  <span data-foco="{{ foco }}" data-campo="1" style="height:56px;box-sizing:border-box;padding:0 12px 0 14px;border-radius:16px;border:{{ borda }};background:{{ fundo }};box-shadow:{{ sombra }};display:flex;align-items:center;gap:10px;color:{{ corIcone }};--peca-hover:{{ hov }};" style-hover="box-shadow:var(--peca-hover);">
    <sc-if value="{{ eBusca }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="flex:none;display:inline-flex;align-items:center;"><dc-import name="IconeGP" nome="busca" tamanho="{{ 18 }}" hint-size="18px,18px"></dc-import></span></sc-if>
    <input aria-label="{{ ariaRot }}" value="{{ valor }}" onInput="{{ aoDigitar }}" placeholder="{{ placeholder }}" readOnly="{{ ro }}" disabled="{{ des }}" aria-invalid="{{ inval }}" aria-busy="{{ busy }}" aria-describedby="{{ descId }}" inputMode="{{ modo }}" style="flex:1;min-width:0;height:100%;border:0;outline:none;background:transparent;font:500 16px/24px 'Roboto',sans-serif;color:{{ corTexto }};--gp-on-surface-variant:{{ corPh }};font-variant-numeric:tabular-nums;">
    <sc-if value="{{ car }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="flex:none;display:inline-flex;align-items:center;"><dc-import name="IconeGP" nome="carregando" tamanho="{{ 18 }}" hint-size="18px,18px"></dc-import></span></sc-if>
    <sc-if value="{{ ro }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="flex:none;display:inline-flex;align-items:center;"><dc-import name="IconeGP" nome="cadeado" tamanho="{{ 18 }}" hint-size="18px,18px"></dc-import></span></sc-if>
    <sc-if value="{{ erro }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="flex:none;color:var(--gp-error);display:inline-flex;align-items:center;"><dc-import name="IconeGP" nome="erro" tamanho="{{ 18 }}" hint-size="18px,18px"></dc-import></span></sc-if>
  </span>
  <sc-if value="{{ temAjuda }}" hint-placeholder-val="{{ false }}"><span id="{{ descId }}" style="display:block;font:500 16px/22px 'Roboto',sans-serif;color:{{ corAjuda }};">{{ ajudaTxt }}</span></sc-if>
</label>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:340,&quot;height&quot;:110},&quot;rotulo&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;CPF ou CNPJ&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;valor&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;placeholder&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Somente números&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ajuda&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;erroMsg&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Dígito verificador não confere&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;estado&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;normal&quot;,&quot;hover&quot;,&quot;foco&quot;,&quot;erro&quot;,&quot;somente-leitura&quot;,&quot;desabilitado&quot;,&quot;carregando&quot;],&quot;default&quot;:&quot;normal&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;icone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;nenhum&quot;,&quot;busca&quot;],&quot;default&quot;:&quot;nenhum&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;aria&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;modo&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;aoDigitar&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(e) =&gt; void&quot;}}">
let SEQ = 0;
class Component extends DCLogic {
  id = 'gp-campo-' + (++SEQ);
  renderVals() {
    const e = this.props.estado || 'normal';
    const erro = e === 'erro', ro = e === 'somente-leitura', des = e === 'desabilitado', car = e === 'carregando';
    const ajuda = erro ? (this.props.erroMsg || 'Valor inválido') : ro ? (this.props.ajudaRO ?? 'Somente leitura') : (this.props.ajuda || '');
    const rec = 'var(--gp-well-shadow)';
    return {
      ariaRot: this.props.aria, rotulo: this.props.rotulo ?? '', temRotulo: !!this.props.rotulo, valor: this.props.valor ?? '', placeholder: this.props.placeholder ?? '',
      aoDigitar: this.props.aoDigitar, modo: this.props.modo, eBusca: this.props.icone === 'busca',
      ro, des, car, erro, inval: erro ? 'true' : undefined, busy: car ? 'true' : undefined, foco: e === 'foco' ? '1' : undefined,
      descId: ajuda ? this.id : undefined, temAjuda: !!ajuda, ajudaTxt: erro ? 'Erro: ' + ajuda : ajuda,
      borda: erro ? '2px solid var(--gp-error)' : des ? '1px dashed var(--gp-outline-variant)' : ro ? '1px solid var(--gp-outline-variant)' : e === 'foco' ? '1px solid var(--gp-primary)' : '1px solid transparent',
      fundo: des ? 'var(--gp-disabled)' : ro ? 'var(--gp-readonly)' : 'var(--gp-well)',
      sombra: des || ro ? 'none' : e === 'hover' ? rec + ',inset 0 0 0 999px var(--gp-state-hover)' : rec,
      hov: des || ro ? 'none' : rec + ',inset 0 0 0 999px var(--gp-state-hover)',
      corTexto: des ? 'var(--gp-on-disabled)' : 'var(--gp-on-surface)', corPh: des ? 'var(--gp-on-disabled)' : 'var(--gp-placeholder)', corIcone: des ? 'var(--gp-on-disabled)' : 'var(--gp-on-surface-variant)',
      corRotulo: des ? 'var(--gp-on-disabled)' : 'var(--gp-on-surface)', corAjuda: erro ? 'var(--gp-error)' : 'var(--gp-on-surface-variant)',
    };
  }
}
</script>
</body>
</html>
