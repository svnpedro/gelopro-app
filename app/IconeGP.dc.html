<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ gira }}" hint-placeholder-val="{{ false }}"><svg aria-hidden="{{ oculto }}" role="{{ papel }}" aria-label="{{ rotulo }}" width="{{ t }}" height="{{ t }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="display:block;flex:none;"><path d="M12 3a9 9 0 1 1-9 9"><animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="0.9s" repeatCount="indefinite"></animateTransform></path></svg></sc-if>
<sc-if value="{{ fixo }}" hint-placeholder-val="{{ true }}"><svg aria-hidden="{{ oculto }}" role="{{ papel }}" aria-label="{{ rotulo }}" width="{{ t }}" height="{{ t }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="display:block;flex:none;"><sc-for list="{{ tracos }}" as="d" hint-placeholder-count="1"><path d="{{ d }}"></path></sc-for></svg></sc-if>
<sc-if value="{{ cheio }}" hint-placeholder-val="{{ false }}"><svg aria-hidden="{{ oculto }}" role="{{ papel }}" aria-label="{{ rotulo }}" width="{{ t }}" height="{{ t }}" viewBox="0 0 24 24" fill="{{ corCheio }}" stroke="none" style="display:block;flex:none;"><sc-for list="{{ tracos }}" as="d" hint-placeholder-count="1"><path d="{{ d }}"></path></sc-for></svg></sc-if>
<sc-if value="{{ catalogo }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;flex-direction:column;gap:16px;">
  <sc-for list="{{ grupos }}" as="g" hint-placeholder-count="3">
    <div style="display:flex;flex-direction:column;gap:8px;">
      <span style="font:700 16px/22px 'Roboto',sans-serif;color:var(--gp-on-surface);">{{ g.t }}</span>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;">
        <sc-for list="{{ g.itens }}" as="i" hint-placeholder-count="8">
          <div style="min-width:0;box-sizing:border-box;padding:10px 4px 8px;border-radius:12px;border:2px solid var(--gp-outline);background:var(--gp-card-action);display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--gp-on-surface);box-shadow:0 2px 0 var(--gp-shadow-raise),inset 0 1px 0 var(--gp-highlight);">
            <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" style="color:var(--gp-primary);" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><sc-for list="{{ i.d }}" as="d" hint-placeholder-count="1"><path d="{{ d }}"></path></sc-for></svg>
            <span data-doc="" style="max-width:100%;font:600 14px/18px 'Roboto',sans-serif;color:var(--gp-on-surface-variant);text-align:center;overflow-wrap:normal;word-break:normal;">{{ i.n }}</span>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-for>
</div>
</sc-if>
</x-dc>
