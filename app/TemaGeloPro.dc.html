// PR #58 (Papel Técnico): um contêiner dentro do app com data-tema próprio (ex.: o Fechamento e os formulários de Laudo, PMOC e Recibo com
// data-tema="claro" quando o tema global é titânio) recebe a paleta inteira daquele tema por esta regra, gerada dos mesmos TEMAS e PECAS.
// Só vale para [data-tema] dentro de outro [data-tema]: o topo continua com as variáveis inline do componente.
// PR #62: TAGS[t] entra explícito no Object.assign, para os tokens .tag-* do tema aninhado nunca dependerem da fusão feita acima em TEMAS.
const ANINHADO = Object.keys(TEMAS).map(t => `[data-tema] [data-tema=${t}]{color:var(--gp-on-surface);` + Object.entries(Object.assign({}, aliases(), TEMAS[t], TAGS[t], PECAS[t])).map(([k, v]) => `${k}:${v};`).join('') + '}').join('\n');
// O template interpola texto em <span>, então a regra entra uma vez no <head> por um <style id="gp-tema-aninhado"> (CSS local, sem CDN).
if (typeof document !== 'undefined' && !document.getElementById('gp-tema-aninhado')) { const el = document.createElement('style'); el.id = 'gp-tema-aninhado'; el.textContent = ANINHADO; document.head.appendChild(el); }
// PR #79 (Pedro): no Titânio, a Home (abas Sintomas e Medições e Testes) sai no mesmo Titânio Acetinado do chassi de cima, em vez do visor safira.
// O token --gp-visor fica intacto (o escuro segue nas demais telas e no ataque-destrutivo.js); a regra só pega o [data-vis] que contém a Home.
// A barra das 2 abas vira um berço escuro embutido no metal (texto claro das abas segue > 7:1, sem mudar de cor) e o texto solto
// fora de cartão escuro passa a marinho #091e42 com gravado claro, igual ao topo do chassi.
const HOME = '[data-tema="titanio"] [data-vis]:has([data-home-inicio])';
const MED = `${HOME} :is(#painel-home-medicoes,[data-home-medicoes])`;
// PR #81: o [data-vis] da Home e a moldura em volta dele ficam transparentes (sem caixa cinza TITANIO no meio): a textura real do chassi
// ([data-chassi].gp-acetinado-sedoso: #c1c0c1 + ref/acetinado-sedoso.svg) aparece contínua do topo ao dock, nas 2 abas. A moldura (bezel) é o pai
// do invólucro [data-tema] com display:contents; o pai imediato do [data-vis] entra também, como pedido. A classe .gp-acetinado-sedoso segue só no chassi.
const BEZEL = '[data-tema="titanio"] :is(*:has(> [data-vis] [data-home-inicio]), *:has(> [data-tema] > [data-vis] [data-home-inicio]))';
const HOME_ACETINADO = `${HOME}{background:transparent !important;background-image:none !important;box-shadow:none !important;border-color:transparent !important;color:#091e42;}
${BEZEL}{background:transparent !important;background-image:none !important;box-shadow:none !important;border-color:transparent !important;}
${HOME} :is([role="tablist"][aria-label="Modo da tela inicial"],[role="tablist"][data-home-modo]){background:#1d2430 !important;border:1px solid #687280 !important;box-shadow:inset 0 2px 4px rgba(0,0,0,0.55), 0 1px 0 rgba(255,255,255,0.45) !important;border-radius:999px !important;padding:3px !important;}
${MED} :is(h2,h3,h4,h5,p,label,small,legend,[data-texto-solto]):not(button *,[role="button"] *,[data-atalho-medicao] *,[data-telemetria] *,[data-cartao-escuro] *){color:#091e42 !important;text-shadow:0 1px 0 rgba(255,255,255,0.65) !important;}`;
if (typeof document !== 'undefined' && !document.getElementById('gp-home-acetinado')) { const el = document.createElement('style'); el.id = 'gp-home-acetinado'; el.textContent = HOME_ACETINADO; document.head.appendChild(el); }

class Component extends DCLogic {
  static TEMAS = TEMAS;
  renderVals() {
    const t = NOME[this.props.tema] || 'titanio';
    return {
      tema: t,
      vars: Object.assign({ display: this.props.bloco ? 'block' : 'contents', color: 'var(--gp-on-surface)' }, this.props.style || {}, aliases(), TEMAS[t], PECAS[t], this.props.extra || {}),
      conteudo: this.props.children,
    };
  }
}
</script>
</body>
</html>
