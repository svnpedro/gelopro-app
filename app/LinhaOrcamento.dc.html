<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ editavel }}" hint-placeholder-val="{{ true }}">
<div style="display:flex;flex-direction:column;gap:4px;min-width:0;">
  <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;">
    <span data-campo="1" data-foco="{{ focoD }}" style="flex:1 1 100%;min-width:0;min-height:56px;box-sizing:border-box;padding:8px 12px;border-radius:16px;border:{{ bordaD }};background:{{ fundo }};box-shadow:{{ rec }};display:flex;align-items:center;">
      <textarea aria-label="{{ ariaD }}" rows="1" value="{{ descricao }}" onInput="{{ aoDescricao }}" placeholder="{{ phD }}" disabled="{{ des }}" aria-invalid="{{ invD }}" style="flex:1;min-width:0;min-height:24px;box-sizing:content-box;padding:0;border:0;outline:none;resize:none;overflow:hidden;field-sizing:content;background:transparent;font:500 16px/24px 'Roboto',sans-serif;color:{{ corTxt }};--gp-on-surface-variant:{{ corPh }};"></textarea>
    </span>
    <span data-campo="1" style="flex:1 1 96px;min-width:0;height:56px;box-sizing:border-box;padding:0 12px;border-radius:16px;border:{{ bordaV }};background:{{ fundo }};box-shadow:{{ rec }};display:flex;align-items:center;gap:6px;">
      <span style="flex:none;font:500 16px/22px 'Roboto',sans-serif;color:{{ corVar }};">R$</span>
      <input aria-label="{{ ariaV }}" inputMode="decimal" value="{{ valor }}" onInput="{{ aoValor }}" placeholder="0,00" disabled="{{ des }}" aria-invalid="{{ invV }}" style="flex:1;min-width:0;height:100%;border:0;outline:none;background:transparent;text-align:right;font:500 16px/24px 'Roboto',sans-serif;color:{{ corTxt }};--gp-on-surface-variant:{{ corPh }};font-variant-numeric:tabular-nums;">
    </span>
    <button type="button" aria-label="{{ ariaRem }}" onClick="{{ aoRemover }}" disabled="{{ des }}" style="flex:none;width:56px;height:56px;box-sizing:border-box;border-radius:16px;border:{{ bordaB }};background:{{ fundoB }};box-shadow:{{ sombraB }};color:{{ corIco }};display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:{{ pe }};transition:transform 120ms ease-out,box-shadow 180ms ease-out;" style-hover="box-shadow:var(--gp-mold-shadow),inset 0 0 0 999px var(--gp-state-hover);" style-active="transform:translateY(1px);background:var(--gp-mold-sunken);box-shadow:var(--gp-mold-shadow-pressed);"><span aria-hidden="true" style="display:inline-flex;align-items:center;"><dc-import name="IconeGP" nome="lixeira" tamanho="{{ 20 }}" hint-size="20px,20px"></dc-import></span></button>
  </div>
  <sc-if value="{{ erro }}" hint-placeholder-val="{{ false }}"><span role="alert" style="font:500 16px/22px 'Roboto',sans-serif;color:var(--gp-error);">{{ erroTxt }}</span></sc-if>
</div>
</sc-if>
<sc-if value="{{ ro }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;min-height:44px;box-sizing:border-box;padding:12px 0;border-bottom:1px solid var(--gp-outline-variant);">
  <span style="flex:1;min-width:0;font:500 16px/20px 'Roboto',sans-serif;color:var(--gp-on-surface);overflow-wrap:anywhere;">{{ descricaoTxt }}</span>
  <span style="flex:none;font:600 16px/20px 'Roboto',sans-serif;color:var(--gp-on-surface);font-variant-numeric:tabular-nums;">{{ valorFmt }}</span>
</div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:340,&quot;height&quot;:120},&quot;n&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1,&quot;tsType&quot;:&quot;number&quot;},&quot;descricao&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Limpeza da condensadora&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;valor&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;180,00&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;placeholder&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Descreva o item&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;estado&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;normal&quot;,&quot;foco&quot;,&quot;erro&quot;,&quot;somente-leitura&quot;,&quot;desabilitado&quot;],&quot;default&quot;:&quot;normal&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;campoErro&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;valor&quot;,&quot;descricao&quot;],&quot;default&quot;:&quot;valor&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;erroMsg&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;aoDescricao&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(e) =&gt; void&quot;},&quot;aoValor&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(e) =&gt; void&quot;},&quot;aoRemover&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
const BRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const num = (v) => { const n = parseFloat(String(v ?? '').replace(/\./g, '').replace(',', '.')); return isFinite(n) ? n : null; };
class Component extends DCLogic {
  renderVals() {
    const e = this.props.estado || 'normal';
    const des = e === 'desabilitado', ro = e === 'somente-leitura', erro = e === 'erro';
    const campo = this.props.campoErro || 'valor';
    const rec = des ? 'none' : 'var(--gp-well-shadow)';
    const bN = '1px solid transparent', bE = '2px solid var(--gp-error)', bD = '1px dashed var(--gp-outline-variant)';
    const v = num(this.props.valor);
    const d = this.props.descricao ?? '';
    return {
      editavel: !ro, ro, des, erro, erroTxt: 'Erro: ' + (this.props.erroMsg || 'informe o valor'),
      descricao: d, descricaoTxt: d || 'Item sem descrição', valor: this.props.valor ?? '', valorFmt: v === null ? '—' : BRL.format(v),
      aoDescricao: this.props.aoDescricao, aoValor: this.props.aoValor, aoRemover: this.props.aoRemover,
      phD: this.props.placeholder || 'Descreva o item', ariaD: 'Descrição do item ' + (this.props.n || ''), ariaV: 'Valor do item ' + (this.props.n || '') + ' em reais', ariaRem: 'Remover item ' + (this.props.n || ''),
      focoD: e === 'foco' ? '1' : undefined, invD: erro && campo === 'descricao' ? 'true' : undefined, invV: erro && campo === 'valor' ? 'true' : undefined,
      bordaD: des ? bD : erro && campo === 'descricao' ? bE : bN, bordaV: des ? bD : erro && campo === 'valor' ? bE : bN,
      fundo: des ? 'var(--gp-disabled)' : 'var(--gp-well)', rec,
      bordaB: des ? bD : '1px solid transparent', fundoB: des ? 'var(--gp-disabled)' : 'var(--gp-mold-raised)', sombraB: des ? 'none' : 'var(--gp-mold-shadow)',
      corTxt: des ? 'var(--gp-on-disabled)' : 'var(--gp-on-surface)', corPh: des ? 'var(--gp-on-disabled)' : 'var(--gp-placeholder)', corVar: des ? 'var(--gp-on-disabled)' : 'var(--gp-on-surface-variant)', corIco: des ? 'var(--gp-on-disabled)' : 'var(--gp-on-surface)', pe: des ? 'none' : 'auto',
    };
  }
}
</script>
</body>
</html>
