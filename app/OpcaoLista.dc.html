<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<button type="button" ref="{{ ref }}" role="option" aria-selected="{{ selTxt }}" aria-disabled="{{ ariaDes }}" disabled="{{ des }}" data-foco="{{ foco }}" onClick="{{ acao }}" style="width:100%;min-width:0;min-height:56px;box-sizing:border-box;padding:0 12px 0 16px;border-radius:16px;border:{{ borda }};background:{{ fundo }};box-shadow:{{ sombra }};transform:{{ desloc }};display:flex;align-items:center;gap:8px;cursor:{{ cursor }};pointer-events:{{ pe }};text-align:left;transition:transform 120ms ease-out,box-shadow 180ms ease-out;--peca-hover:{{ hov }};--peca-press-bg:{{ actBg }};--peca-press:{{ act }};" style-hover="box-shadow:var(--peca-hover);" style-active="transform:translateY(1px);background:var(--peca-press-bg);box-shadow:var(--peca-press);">
  <span style="flex:1;min-width:0;font-family:'Roboto',sans-serif;font-weight:{{ peso }};font-size:{{ fs }};line-height:20px;color:{{ cor }};font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ rotulo }}</span>
  <sc-if value="{{ sel }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="flex:none;color:var(--gp-on-selected);display:inline-flex;align-items:center;"><dc-import name="IconeGP" nome="sucesso" tamanho="{{ 20 }}" hint-size="20px,20px"></dc-import></span></sc-if>
</button>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:170,&quot;height&quot;:64},&quot;rotulo&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Electrolux&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sel&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;estado&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;normal&quot;,&quot;hover&quot;,&quot;foco&quot;,&quot;pressionado&quot;,&quot;selecionado&quot;,&quot;desabilitado&quot;],&quot;default&quot;:&quot;normal&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;acao&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
const RAISE = 'var(--gp-mold-shadow)';
const HOV = RAISE + ',inset 0 0 0 999px var(--gp-state-hover)', HOV_SEL = 'var(--gp-feature-shadow),inset 0 0 0 999px var(--gp-state-hover)';
const ACT = 'var(--gp-mold-shadow-pressed)', ACT_SEL = 'var(--gp-mold-shadow-pressed),inset 0 0 0 999px var(--gp-state-pressed)';
class Component extends DCLogic {
  state = { w: 0 };
  ref = React.createRef();
  componentDidMount() {
    const el = this.ref.current;
    if (el && window.ResizeObserver) { this.ro = new ResizeObserver(() => { const w = el.offsetWidth; if (w && w !== this.state.w) this.setState({ w }); }); this.ro.observe(el); }
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => this.forceUpdate());
  }
  componentWillUnmount() { if (this.ro) this.ro.disconnect(); }
  renderVals() {
    const e = this.props.estado || 'normal';
    const rotulo = this.props.rotulo ?? '', sel = !!this.props.sel || e === 'selecionado', des = e === 'desabilitado';
    let fs = 16;
    if (this.state.w) {
      if (!this._c) this._c = document.createElement('canvas').getContext('2d');
      this._c.font = '600 16px Roboto';
      const tw = this._c.measureText(rotulo).width, avail = this.state.w - 30 - (sel ? 28 : 0);
      if (tw > avail) fs = Math.max(14, Math.floor(16 * avail / tw * 2) / 2);
    }
    return {
      ref: this.ref, rotulo, sel, selTxt: sel ? 'true' : 'false', acao: this.props.acao, fs: fs + 'px', des, ariaDes: des ? 'true' : undefined,
      foco: e === 'foco' ? '1' : undefined, peso: sel ? 700 : 600,
      borda: des ? '1px dashed var(--gp-outline-variant)' : '1px solid var(--gp-sec-edge)',
      fundo: sel ? 'var(--gp-mold-selected)' : des ? 'var(--gp-disabled)' : e === 'pressionado' ? 'var(--gp-mold-sunken)' : 'var(--gp-mold-raised)',
      sombra: des ? 'none' : sel ? 'var(--gp-feature-shadow)' : e === 'hover' ? RAISE + ',inset 0 0 0 999px var(--gp-state-hover)' : e === 'pressionado' ? 'var(--gp-mold-shadow-pressed)' : RAISE,
      hov: sel ? HOV_SEL : HOV, actBg: sel ? 'var(--gp-mold-selected)' : 'var(--gp-mold-sunken)', act: sel ? ACT_SEL : ACT,
      desloc: e === 'pressionado' ? 'translateY(1px)' : 'none', cursor: des ? 'not-allowed' : 'pointer', pe: des ? 'none' : 'auto',
      cor: des ? 'var(--gp-on-disabled)' : sel ? 'var(--gp-on-selected)' : 'var(--gp-on-surface)',
    };
  }
}
</script>
</body>
</html>
