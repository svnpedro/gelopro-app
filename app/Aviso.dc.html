<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div role="{{ papel }}" style="box-sizing:border-box;border-radius:16px;border:1px solid {{ borda }};background:{{ fundo }};color:{{ cor }};overflow:hidden;">
  <sc-if value="{{ dobra }}" hint-placeholder-val="{{ false }}">
    <button type="button" aria-expanded="{{ abertoAttr }}" onClick="{{ alternar }}" style="width:100%;min-height:56px;box-sizing:border-box;padding:8px 8px 8px 12px;border:0;background:transparent;color:inherit;display:flex;align-items:center;gap:8px;text-align:left;cursor:pointer;" style-active="background:var(--gp-alert-press);">
      <span aria-hidden="true" style="flex:none;display:inline-flex;align-items:center;"><dc-import name="IconeGP" nome="{{ icoNome }}" tamanho="{{ 20 }}" hint-size="20px,20px"></dc-import></span>
      <span style="flex:1;min-width:0;font:700 16px/20px 'Roboto',sans-serif;text-wrap:pretty;">{{ titulo }}</span>
      <span aria-hidden="true" style="flex:none;width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;transform:{{ seta }};transition:transform 150ms ease-out;"><dc-import name="IconeGP" nome="abrir" tamanho="{{ 20 }}" hint-size="20px,20px"></dc-import></span>
    </button>
    <sc-if value="{{ aberto }}" hint-placeholder-val="{{ false }}">
      <div style="padding:0 12px 10px 40px;font:500 16px/22px 'Roboto',sans-serif;text-wrap:pretty;">{{ texto }}</div>
    </sc-if>
  </sc-if>
  <sc-if value="{{ fixo }}" hint-placeholder-val="{{ true }}">
    <div style="min-height:48px;box-sizing:border-box;padding:8px 12px;display:flex;align-items:flex-start;gap:8px;">
      <span aria-hidden="true" style="flex:none;margin-top:2px;display:inline-flex;align-items:center;"><dc-import name="IconeGP" nome="{{ icoNome }}" tamanho="{{ 20 }}" hint-size="20px,20px"></dc-import></span>
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;">
        <span style="font:700 16px/22px 'Roboto',sans-serif;text-wrap:pretty;">{{ titulo }}</span>
        <sc-if value="{{ temTexto }}" hint-placeholder-val="{{ false }}"><span style="font:500 16px/22px 'Roboto',sans-serif;text-wrap:pretty;">{{ texto }}</span></sc-if>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:340,&quot;height&quot;:120},&quot;tipo&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;info&quot;,&quot;aviso&quot;,&quot;erro&quot;,&quot;sucesso&quot;],&quot;default&quot;:&quot;aviso&quot;,&quot;tsType&quot;:&quot;'info' | 'sucesso' | 'erro' | 'aviso'&quot;},&quot;titulo&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;O código aponta o circuito a investigar&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;texto&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Sozinho, não confirma a peça com defeito.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;aberto&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;fixo&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
// Alerta compacto: 1 linha com ícone e título; o texto abre ao toque (aria-expanded).
// info e aviso = faixa amarela CAT com texto escuro; erro = vermelho, aberto; sucesso = verde.
const COR = {
  info:    ['var(--gp-alert)', 'var(--gp-on-alert)', 'var(--gp-alert-edge)'],
  aviso:   ['var(--gp-alert)', 'var(--gp-on-alert)', 'var(--gp-alert-edge)'],
  erro:    ['var(--gp-error-container)', 'var(--gp-on-error-container)', 'var(--gp-error)'],
  sucesso: ['var(--gp-success-container)', 'var(--gp-on-success-container)', 'var(--gp-success)'],
};
const ICONE = { info: 'info', sucesso: 'sucesso', erro: 'erro', aviso: 'alerta' };
class Component extends DCLogic {
  state = { aberto: null };
  renderVals() {
    const t = COR[this.props.tipo] ? this.props.tipo : 'info';
    const [fundo, cor, borda] = COR[t];
    const texto = this.props.texto ?? '';
    const temTexto = !!texto;
    const padrao = this.props.aberto ?? (t === 'erro');
    const aberto = this.state.aberto ?? padrao;
    const dobra = temTexto && !this.props.fixo;
    return {
      titulo: this.props.titulo ?? '', texto, temTexto, icoNome: ICONE[t], fundo, cor, borda,
      papel: t === 'erro' || t === 'aviso' ? 'alert' : 'status',
      dobra, fixo: !dobra, aberto: dobra && aberto, abertoAttr: aberto ? 'true' : 'false',
      seta: aberto ? 'rotate(180deg)' : 'none',
      alternar: () => this.setState({ aberto: !aberto }),
    };
  }
}
</script>
</body>
</html>
