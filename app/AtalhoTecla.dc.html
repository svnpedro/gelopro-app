<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ pilula }}" hint-placeholder-val="{{ false }}">
  <button type="button" ref="{{ ref }}" aria-label="{{ ariaTxt }}" disabled="{{ des }}" data-foco="{{ foco }}" onClick="{{ acao }}" style="width:100%;height:48px;box-sizing:border-box;padding:1px 0;border:0;border-radius:999px;background:transparent;transform:{{ desloc }};display:flex;color:{{ corP }};cursor:{{ cursor }};pointer-events:{{ pe }};transition:transform 120ms ease-out;" style-hover="filter:brightness(1.12);" style-active="transform:translateY(2px);filter:brightness(.95);">
   <span style="flex:1;min-width:0;height:46px;box-sizing:border-box;padding:0 18px;border:2px solid var(--gp-bar-edge);border-radius:999px;background:var(--gp-bar);box-shadow:{{ sombraP }};display:flex;align-items:center;justify-content:center;gap:8px;">
    <span style="min-width:0;font-family:'Roboto',sans-serif;font-weight:700;font-size:17px;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ rotulo }}</span>
    <sc-if value="{{ lock }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="flex:none;display:inline-flex;align-items:center;"><dc-import name="IconeGP" nome="cadeado" tamanho="{{ 16 }}" hint-size="16px,16px"></dc-import></span></sc-if>
    <sc-if value="{{ seta }}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="flex:none;font-family:'Roboto',sans-serif;font-weight:700;font-size:17px;line-height:20px;">&gt;</span></sc-if>
   </span>
  </button>
</sc-if>
<sc-if value="{{ tecla }}" hint-placeholder-val="{{ true }}">
<div data-chanfro="" style="box-sizing:border-box;padding:6px;border-radius:22px;background:var(--gp-chanfro);">
  <button type="button" ref="{{ ref }}" aria-label="{{ ariaTxt }}" disabled="{{ des }}" data-foco="{{ foco }}" onClick="{{ acao }}" style="width:100%;min-height:56px;box-sizing:border-box;padding:8px 14px 8px 16px;border:1px solid var(--gp-sec-edge);border-radius:16px;background:var(--gp-sec-key);box-shadow:{{ sombra }};transform:{{ desloc }};display:flex;align-items:center;gap:12px;color:{{ cor }};cursor:{{ cursor }};pointer-events:{{ pe }};transition:transform 120ms ease-out;" style-hover="box-shadow:var(--gp-key-raise),inset 0 0 0 999px var(--gp-key-hover);" style-active="transform:translateY(2px);box-shadow:var(--gp-key-sunk);">
    <span aria-hidden="true" style="flex:none;display:inline-flex;align-items:center;"><dc-import name="IconeGP" nome="{{ icoNome }}" tamanho="{{ 20 }}" hint-size="20px,20px"></dc-import></span>
    <span style="flex:1;min-width:0;text-align:left;font-family:'Roboto',sans-serif;font-weight:600;font-size:16px;line-height:20px;text-wrap:pretty;">{{ rotulo }}</span>
    <sc-if value="{{ lock }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="flex:none;display:inline-flex;align-items:center;"><dc-import name="IconeGP" nome="cadeado" tamanho="{{ 18 }}" hint-size="18px,18px"></dc-import></span></sc-if>
    <sc-if value="{{ seta }}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="flex:none;display:inline-flex;align-items:center;"><dc-import name="IconeGP" nome="avancar" tamanho="{{ 20 }}" hint-size="20px,20px"></dc-import></span></sc-if>
  </button>
</div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:64},&quot;rotulo&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Consultar fichas&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;icone&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;busca&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;lock&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;pilula&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;estado&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;normal&quot;,&quot;hover&quot;,&quot;foco&quot;,&quot;pressionado&quot;,&quot;desabilitado&quot;],&quot;default&quot;:&quot;normal&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;aria&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;acao&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
const BASE = 'var(--gp-sec-raise)';
class Component extends DCLogic {
  state = { w: 0 };
  ref = React.createRef();
  componentDidMount() {
    const el = this.ref.current;
    if (el && window.ResizeObserver) { this.ro = new ResizeObserver(() => { const w = el.offsetWidth; if (w && w !== this.state.w) this.setState({ w }); }); this.ro.observe(el); }
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => this.forceUpdate());
  }
  componentWillUnmount() { if (this.ro) this.ro.disconnect(); }
  renderVals() {
    const rotulo = this.props.rotulo ?? '', lock = !!this.props.lock;
    const e = this.props.estado || 'normal', des = e === 'desabilitado';
    let fs = 16;
    if (this.state.w) {
      if (!this._c) this._c = document.createElement('canvas').getContext('2d');
      this._c.font = '600 16px Roboto';
      const tw = this._c.measureText(rotulo).width, avail = this.state.w - 30 - 20 - 20 - 24;
      
    }
    return {
      ref: this.ref, rotulo, acao: this.props.acao, pilula: !!this.props.pilula, tecla: !this.props.pilula, ariaTxt: (this.props.aria ?? rotulo) + (lock ? ', função bônus bloqueada' : ''),
      icoNome: this.props.icone === 'doc' ? 'documento' : (this.props.icone || 'busca'), lock, seta: !lock, fs: fs + 'px', des, foco: e === 'foco' ? '1' : undefined,
      cor: des ? 'var(--gp-on-key-disabled)' : 'var(--gp-on-sec)', corP: des ? 'var(--gp-on-disabled)' : 'var(--gp-on-bar)',
      sombraP: e === 'pressionado' ? 'inset 0 2px 5px var(--gp-key-shadow)' : 'var(--gp-bar-shadow)',
      sombra: e === 'hover' ? BASE + ',inset 0 0 0 999px var(--gp-key-hover)' : e === 'pressionado' ? 'var(--gp-sec-sunk)' : des ? '0 0 0 1px var(--gp-key-edge)' : BASE,
      desloc: e === 'pressionado' ? 'translateY(2px)' : 'none', cursor: des ? 'not-allowed' : 'pointer', pe: des ? 'none' : 'auto',
    };
  }
}
</script>
</body>
</html>
