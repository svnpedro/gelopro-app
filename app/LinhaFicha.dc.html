<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<button type="button" data-foco="{{ foco }}" disabled="{{ des }}" aria-busy="{{ busy }}" onClick="{{ acao }}" style="width:100%;min-width:0;min-height:64px;box-sizing:border-box;padding:12px 12px 12px 16px;border-radius:16px;border:{{ borda }};background:{{ fundo }};box-shadow:{{ sombra }};transform:{{ desloc }};display:flex;align-items:center;gap:12px;cursor:{{ cursor }};pointer-events:{{ pe }};text-align:left;transition:transform 120ms ease-out,box-shadow 180ms ease-out;" style-hover="box-shadow:var(--gp-mold-shadow),inset 0 0 0 999px var(--gp-state-hover);" style-active="transform:translateY(1px);background:var(--gp-mold-sunken);box-shadow:var(--gp-mold-shadow-pressed);">
  <span style="flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:4px;">
    <span style="display:inline-flex;align-items:center;height:22px;box-sizing:border-box;padding:0 8px;border-radius:9999px;border:1px solid {{ seloBorda }};background:{{ seloFundo }};font:700 14px/1 'Roboto',sans-serif;letter-spacing:.01em;color:{{ seloCor }};white-space:nowrap;max-width:18ch;overflow:hidden;text-overflow:ellipsis;pointer-events:none;">{{ tipo }}</span>
    <span style="width:100%;font:600 16px/20px 'Roboto',sans-serif;color:{{ corT }};overflow-wrap:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">{{ titulo }}</span>
    <sc-if value="{{ temExtra }}" hint-placeholder-val="{{ false }}"><span data-ficha-extra="" style="width:100%;font:600 16px/22px 'Roboto',sans-serif;color:{{ corS }};overflow-wrap:anywhere;">{{ extra }}</span></sc-if>
    <span style="width:100%;font:500 16px/22px 'Roboto',sans-serif;color:{{ corS }};overflow-wrap:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">{{ sub }}</span>
  </span>
  <span aria-hidden="true" style="flex:none;color:{{ corS }};display:inline-flex;align-items:center;"><dc-import name="IconeGP" nome="avancar" tamanho="{{ 20 }}" hint-size="20px,20px"></dc-import></span>
</button>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:340,&quot;height&quot;:96},&quot;titulo&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Sensor NTC de degelo&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tipo&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Componente&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sub&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Curva de resistência e temperatura&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;extra&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;estado&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;normal&quot;,&quot;hover&quot;,&quot;foco&quot;,&quot;pressionado&quot;,&quot;carregando&quot;,&quot;desabilitado&quot;],&quot;default&quot;:&quot;normal&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;acao&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
const RAISE = 'var(--gp-mold-shadow)';
class Component extends DCLogic {
  renderVals() {
    const e = this.props.estado || 'normal';
    const des = e === 'desabilitado', car = e === 'carregando';
    const tp = (this.props.tipo || '').toLowerCase(), cat = /^sintoma/.test(tp) ? 'sintoma' : /^c[óo]digo|^piscada|^led/.test(tp) ? 'codigo' : /^componente|^cofre/.test(tp) ? 'componente' : /^teste|^fechamento/.test(tp) ? 'teste' : /^b[ôo]nus|^adicional/.test(tp) ? 'codigo' : 'neutro';
    return {
      titulo: this.props.titulo ?? '', tipo: this.props.tipo ?? '', sub: car ? 'Carregando ficha…' : this.props.sub ?? '', acao: this.props.acao,
      // Linha extra opcional, sem corte (PR #22: aparelho Marca + BTU/h no cartão do Cofre).
      temExtra: !!this.props.extra, extra: this.props.extra || '',
      des, busy: car ? 'true' : undefined, foco: e === 'foco' ? '1' : undefined,
      borda: des ? '1px dashed var(--gp-outline-variant)' : '1px solid var(--gp-sec-edge)',
      fundo: des ? 'var(--gp-disabled)' : e === 'pressionado' ? 'var(--gp-mold-sunken)' : 'var(--gp-mold-raised)',
      sombra: des ? 'none' : e === 'hover' ? RAISE + ',inset 0 0 0 999px var(--gp-state-hover)' : e === 'pressionado' ? 'var(--gp-mold-shadow-pressed)' : RAISE,
      desloc: e === 'pressionado' ? 'translateY(1px)' : 'none', cursor: des ? 'not-allowed' : car ? 'progress' : 'pointer', pe: des || car ? 'none' : 'auto',
      seloFundo: des ? 'transparent' : `var(--gp-tag-${cat})`, seloCor: des ? 'var(--gp-on-disabled)' : `var(--gp-on-tag-${cat})`, seloBorda: des ? 'var(--gp-outline-variant)' : 'transparent',
      corT: des ? 'var(--gp-on-disabled)' : 'var(--gp-on-surface)', corS: des ? 'var(--gp-on-disabled)' : 'var(--gp-on-surface-variant)',
    };
  }
}
</script>
</body>
</html>
