<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<button type="button" ref="{{ ref }}" disabled="{{ des }}" aria-disabled="{{ ariaDes }}" aria-busy="{{ busy }}" data-foco="{{ foco }}" onClick="{{ acao }}" style="width:100%;height:100%;min-width:0;min-height:0;box-sizing:border-box;padding:{{ pad }};border-radius:{{ rad }};border:{{ borda }};background:{{ fundo }};box-shadow:{{ sombra }};transform:{{ desloc }};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:{{ vao }};cursor:{{ cursor }};pointer-events:{{ pe }};transition:transform 120ms ease-out,box-shadow 180ms ease-out;" style-hover="filter:brightness(1.08);" style-active="transform:translateY(3px);box-shadow:var(--gp-tile-relief-pressed);">
  <sc-if value="{{ comIcone }}" hint-placeholder-val="{{ true }}"><span style="flex:none;width:{{ poco }}px;height:{{ poco }}px;box-sizing:border-box;border-radius:16px;background:{{ pocoFundo }};border:{{ pocoBorda }};box-shadow:{{ pocoSombra }};display:flex;align-items:center;justify-content:center;color:{{ corIcone }};">
    <sc-if value="{{ car }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="display:inline-flex;align-items:center;"><dc-import name="IconeGP" nome="carregando" tamanho="{{ ico }}" hint-size="48px,48px"></dc-import></span></sc-if>
    <sc-if value="{{ icoNome }}" hint-placeholder-val="{{ false }}"><dc-import name="IconeGP" nome="{{ icoNome }}" tamanho="{{ ico }}" hint-size="48px,48px"></dc-import></sc-if><sc-if value="{{ icoNo }}" hint-placeholder-val="{{ false }}">{{ icoNo }}</sc-if>
  </span></sc-if>
  <span data-placa-texto="" style="flex:none;width:100%;min-height:{{ minT }};box-sizing:border-box;padding-bottom:{{ tpb }};font-family:'Roboto',sans-serif;font-weight:700;font-size:{{ fs }};line-height:{{ lh }};color:{{ corTexto }};text-shadow:{{ gravado }};text-align:center;overflow-wrap:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">{{ nome }}</span>
</button>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:110,&quot;height&quot;:130},&quot;nome&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Código no display&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;canto&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;nenhum&quot;,&quot;esq&quot;,&quot;dir&quot;],&quot;default&quot;:&quot;esq&quot;,&quot;tsType&quot;:&quot;'nenhum' | 'esq' | 'dir'&quot;},&quot;estado&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;normal&quot;,&quot;hover&quot;,&quot;foco&quot;,&quot;pressionado&quot;,&quot;carregando&quot;,&quot;desabilitado&quot;],&quot;default&quot;:&quot;normal&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;icone&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;ReactNode&quot;},&quot;acao&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
// 26/10 (referência 1. TITÂNIO): as nove placas são quadrados arredondados iguais; "canto" fica só por compatibilidade.
// Base com 6 px de folga garantida (item 8 do Pedro): o texto nunca encosta nem é cortado na borda de baixo.
const PAD = { esq: '8px 4px 6px', dir: '8px 4px 6px', nenhum: '8px 4px 6px' };
const LH = 17, FOLGA_TXT = 2;
// Placa muito baixa (abaixo de 56 px, telas de 640 px com faixa de diagnóstico): o respiro de cima cai para 4 px; o de baixo (6 px) não muda.
const padTopo = (h) => h && h < 56 ? 4 : 8;
// PR #46: placa compacta (62 a 79 px de altura, telas de 667 a 740 px): respiro de cima de 4 px, nome em 14 px com linha de 14 px (as 2 linhas
// reservadas cabem em 30 px) e ícone de 20 a 28 px (24 px a partir de 66 px); os 6 px de folga na base não mudam. Abaixo de 62 px, só o nome.
const COMPACTA = { de: 62, ate: 80, lh: 14, fsMax: 14 };
// PR #58: placa mínima (48 a 61 px, faixa "Atendimento em andamento" aberta): o ícone não some mais. Fica em porte compacto de 18 a 22 px,
// vão de 0 a 2 px, nome em 14 px com linha de 14 px (o piso G-L1 do GeloProPortao é 14 px), respiro de 1 px em cima e os 6 px de folga
// do nome na base (item 8 do Pedro). Cabe inteiro de 54 px para cima; a grade de Medições e Testes nunca deixa o cartão abaixo de 54 px.
// Assim os 9 cartões de Sintomas e os 6 de Medições e Testes mantêm sempre o ícone e a mesma distribuição (ícone em cima, nome embaixo).
const MINI = { de: 48, lh: 14, fsMax: 14, icoMin: 18, icoMax: 22 };
const PADX = { esq: 8, dir: 8, nenhum: 8 };
const RAD = { esq: '20px', dir: '20px', nenhum: '20px' };
const RAISE = 'var(--gp-tile-relief)';

class Component extends DCLogic {
  state = { w: 0, h: 0 };
  ref = React.createRef();
  componentDidMount() {
    const el = this.ref.current;
    if (el && window.ResizeObserver) {
      this.ro = new ResizeObserver(() => { const w = el.offsetWidth, h = el.offsetHeight; if ((w && w !== this.state.w) || (h && h !== this.state.h)) this.setState({ w, h }); });
      this.ro.observe(el);
    }
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => this.forceUpdate());
  }
  componentWillUnmount() { if (this.ro) this.ro.disconnect(); }
  renderVals() {
    const canto = PAD[this.props.canto] ? this.props.canto : 'nenhum';
    const nome = this.props.nome ?? '';
    const e = this.props.estado || 'normal';
    const des = e === 'desabilitado', car = e === 'carregando', h = this.state.h;
    let fs = 16;
    if (this.state.w) {
      if (!this._ctx) this._ctx = document.createElement('canvas').getContext('2d');
      this._ctx.font = '700 16px Roboto';
      const maior = Math.max(...nome.split(' ').map(p => this._ctx.measureText(p).width));
      const avail = this.state.w - PADX[canto] - 4;
      if (maior > avail) fs = Math.max(14, Math.floor(16 * avail / maior * 2) / 2);
    }
    // Ícone calculado pela altura real da placa, descontando a camada de texto e o respiro de cima (8 px) e de baixo (6 px).
    // A camada reserva sempre 2 linhas de 17 px + 2 px (o clamp nunca passa de 2): as nove placas têm a mesma altura e,
    // assim, todas ficam com o mesmo ícone, inclusive "Desliga sozinho" e "Código no display", que quebram em 2 linhas.
    // Sem medida ainda (primeiro desenho), vale o tamanho cheio. Poço abaixo de 28 px: o ícone sai e fica só o nome.
    const mini = !!h && h >= MINI.de && h < COMPACTA.de, compacta = !!h && h >= COMPACTA.de && h < COMPACTA.ate, lh = mini ? MINI.lh : compacta ? COMPACTA.lh : LH;
    if (compacta) fs = Math.min(fs, COMPACTA.fsMax);
    if (mini) fs = Math.min(fs, MINI.fsMax);
    const topo = mini ? 1 : compacta ? 4 : padTopo(h), base = 6, texto = 2 * lh + (mini ? 0 : FOLGA_TXT), livre = h ? h - topo - base - texto : Infinity;
    let vao, poco, comIcone, ico;
    if (mini) { vao = livre >= MINI.icoMin + 2 ? 2 : livre >= MINI.icoMin + 1 ? 1 : 0; ico = Math.max(MINI.icoMin, Math.min(MINI.icoMax, Math.floor(livre - vao))); poco = ico; comIcone = true; }
    else if (compacta) { vao = 2; ico = Math.min(28, Math.floor(livre - vao)); poco = ico; comIcone = ico >= 20; }
    else { vao = livre >= 58 ? 6 : 2; poco = Math.min(52, Math.floor(livre - vao)); comIcone = poco >= 28; ico = Math.min(48, poco - 4); }
    return {
      ref: this.ref, nome, icoNome: !car && typeof this.props.icone === 'string' ? this.props.icone : null, icoNo: !car && this.props.icone && typeof this.props.icone !== 'string' ? this.props.icone : null, acao: this.props.acao, pad: `${topo}px 4px ${base}px`, tpb: mini ? '0px' : '2px',
      // PR #64: o nome reserva sempre as 2 linhas (a mesma conta do ícone): nome de 1 linha não desce mais, ícones e títulos ficam na mesma
      // altura em todos os cartões da linha.
      minT: (2 * lh + (mini ? 0 : FOLGA_TXT)) + 'px', rad: RAD[canto], fs: fs + 'px', lh: lh + 'px',
      des, ariaDes: des ? 'true' : undefined, busy: car ? 'true' : undefined, car, semCar: !car, foco: e === 'foco' ? '1' : undefined,
      fundo: des ? 'var(--gp-disabled)' : 'var(--gp-tile)',
      borda: des ? '1px dashed var(--gp-outline-variant)' : 'var(--gp-tile-border)', gravado: des ? 'none' : 'var(--gp-on-tile-shadow)',
      sombra: des ? 'none' : e === 'pressionado' ? 'var(--gp-tile-relief-pressed)' : RAISE,
      desloc: e === 'pressionado' ? 'translateY(3px)' : 'none',
      cursor: des ? 'not-allowed' : car ? 'progress' : 'pointer', pe: des || car ? 'none' : 'auto',
      pocoFundo: des ? 'transparent' : 'var(--gp-tile-well)',
      // Placa baixa (telas de 667 px): o ícone encolhe e, no limite, sai; o nome do sintoma fica sempre visível e inteiro.
      comIcone, ico: comIcone ? ico : 24, poco: comIcone ? poco : 28, vao: comIcone ? vao + 'px' : '0px', pocoBorda: des ? '1px dashed var(--gp-outline-variant)' : '0',
      pocoSombra: 'none',
      corIcone: des ? 'var(--gp-on-disabled)' : 'var(--gp-on-tile-icon)', corTexto: des ? 'var(--gp-on-disabled)' : 'var(--gp-on-tile)',
    };
  }
}
</script>
</body>
</html>
