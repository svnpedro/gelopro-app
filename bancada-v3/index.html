<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#DBD8D1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171B20" media="(prefers-color-scheme: dark)">
<title>Bancada GeloPRO · Split &amp; Inverter</title>
<!--
  Bancada GeloPRO v3 (bancada-v3/, 12/11/2026). Jurisdição decidida pelo Pedro:
  · PELE VISUAL = Design System v4 (claude-design/pacote-final-ds/design_handoff_bancada_v4): layout sem buraco, Barlow Semi Condensed e
    JetBrains Mono locais, chapa titânio quente, teclas marinho em domo, visor champanhe, modo escuro automático, gavetas, multímetro
    ilustrado com a chave de escala (MM11) e botija ilustrada. Contrato de marcação data-* do pacote (contratos/marcacao.md), para os
    portões do pacote (comportamento, buraco e respiro) medirem o app pronto.
  · DADOS, FÓRMULAS, OFERTA, TEXTOS LITERAIS, LICENÇA, PIX REAL e PROIBIÇÕES do CLAUDE.md = motor soberano da bancada-v2: os CSVs de
    ../base-tecnica/, curvas NTC ponto a ponto, P-T, Tabela Oficial 2026 por porte com PECA_PEDRO, 411 códigos e 152 piscadas, Paywall
    Essencial × Completo PRO × Bumps, gelopro.sessao.v1, GeloProPix com QR real, PDF Nº 1001 e licenca-gelopro.js.
  · Laudo com até 6 serviços somados (mínimo, referência, máximo e custo da peça por porte), causa principal 1 por visita e âncora
    "Referência Regional Auditada 2026" no Modo: Laudo (sem custo, sem lucro e sem as palavras mínimo/máximo para o cliente).
  Modo avião: sw.js próprio (escopo ./, cache bancada-v3-offline-v1). A bancada/ e a bancada-v2/ seguem congeladas.
-->
<style>
/* Bancada GeloPRO v3 · pele do Design System v4 (claude-design/pacote-final-ds/design_handoff_bancada_v4): chapa titânio quente, teclas
   marinho em domo, visor champanhe, botão âmbar, WhatsApp oficial e modo escuro automático (prefers-color-scheme). Letra Barlow Semi
   Condensed (texto) e JetBrains Mono (número), locais em ./fontes, sem CDN. Escalas da pele: letra 11·12·14·15·17·20·24·38·48 px,
   espaço 4·8·12·16·20·24·32·40·48 px, tecla 44·52·56 px, raio 2·6·8·10·12·18 px ou pílula. Transição só de 140, 200, 300 ou 600 ms.
   Cor de SVG (logo, ícone, instrumento) sai sempre em hexadecimal cravado no atributo, escolhida pelo JS conforme o modo. */
@font-face{font-family:'Barlow Semi Condensed';font-style:normal;font-display:swap;font-weight:500;src:url(./fontes/barlow-semi-condensed-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Semi Condensed';font-style:normal;font-display:swap;font-weight:600;src:url(./fontes/barlow-semi-condensed-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Semi Condensed';font-style:normal;font-display:swap;font-weight:700;src:url(./fontes/barlow-semi-condensed-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Barlow Semi Condensed';font-style:normal;font-display:swap;font-weight:800;src:url(./fontes/barlow-semi-condensed-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-display:swap;font-weight:500;src:url(./fontes/jetbrains-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-display:swap;font-weight:700;src:url(./fontes/jetbrains-mono-latin-700-normal.woff2) format('woff2')}
:root{
  color-scheme:light dark;
  --f-txt:'Barlow Semi Condensed',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;--f-tit:var(--f-txt);--f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --chapa-a:#E6E3DD;--chapa-b:#CCC8BF;--chapa:#DBD8D1;
  --tinta:#0C2747;--linha:#1E293B;--apoio:#334155;--destaque:#0B5976;
  --cartao:#FFFFFF;--cartao-bd:#94A3B8;--int:#E2E8F0;--campo:#FFFFFF;--campo-bd:#5A6A7E;
  --faixa:#EFEDE8;--faixa-bd:#CFCBC2;
  --visor-a:#F1EAD8;--visor-b:#FFFEFA;--visor-c:#FAF5E8;--visor-bd:#7A6A3A;--visor-num:#0C2747;--visor-rot:#3F3210;--visor-sombra:rgba(63,50,16,.24);
  --tecla-a:#31639A;--tecla-b:#2A5C8F;--tecla-c:#0F2B4C;--tecla-bd:#081B33;--tecla-tx:#FFFFFF;--tecla-luz:rgba(190,235,255,.55);--tecla-num:#BAE6FD;
  --clara-a:#FFFFFF;--clara-b:#F3F5F7;--clara-c:#E8EBEF;--clara-d:#D5DBE3;--clara-bd:#5A6A7E;--clara-tx:#0C2747;
  --sel-a:#FFFFFF;--sel-b:#F2FAFC;--sel-c:#DDF3F9;--sel-tx:#0C2747;
  --bom-bg:#DCFCE7;--bom-bd:#15803D;--bom-tx:#14532D;--erro-bg:#FEE2E2;--erro-bd:#B91C1C;--erro-tx:#7F1D1D;
  --aten-bg:#FEF3C7;--aten-bd:#B45309;--aten-tx:#78350F;--info-bg:#E0F2FE;--info-bd:#0284C7;--info-tx:#0C4A6E;
  --destr-bg:#FFFFFF;--destr-tx:#991B1B;--sombra-cartao:0 1px 3px rgba(9,30,66,.14);--fundo-gaveta:rgba(9,30,66,.45);
}
@media (prefers-color-scheme:dark){:root{
  --chapa-a:#1C2127;--chapa-b:#12161A;--chapa:#171B20;
  --tinta:#E8EDF2;--linha:#E8EDF2;--apoio:#AEB8C2;--destaque:#5BE3FF;
  --cartao:#1E242B;--cartao-bd:#05070A;--int:#2A3138;--campo:#0A0D10;--campo-bd:#3A424C;
  --faixa:#262C34;--faixa-bd:#3A424C;
  --visor-a:#071216;--visor-b:#071216;--visor-c:#071216;--visor-bd:#05070A;--visor-num:#5BE3FF;--visor-rot:#6FA3B3;--visor-sombra:rgba(0,0,0,.6);
  --tecla-a:#262C34;--tecla-b:#20262D;--tecla-c:#12161A;--tecla-bd:#05070A;--tecla-tx:#E8EDF2;--tecla-luz:rgba(255,255,255,.08);--tecla-num:#6FA3B3;
  --clara-a:#3A424C;--clara-b:#323942;--clara-c:#323942;--clara-d:#1E242B;--clara-bd:#05070A;--clara-tx:#E8EDF2;
  --sel-a:#1B2B33;--sel-b:#13202A;--sel-c:#13202A;--sel-tx:#5BE3FF;
  --bom-bg:#06140C;--bom-bd:#4AF08A;--bom-tx:#4AF08A;--erro-bg:#3A1210;--erro-bd:#FF8A80;--erro-tx:#FF8A80;
  --aten-bg:#2A1F05;--aten-bd:#FFC044;--aten-tx:#FFC044;--info-bg:#0A1C2A;--info-bd:#8EC5FF;--info-tx:#8EC5FF;
  --destr-bg:#1E242B;--destr-tx:#FF8A80;--sombra-cartao:0 1px 3px rgba(0,0,0,.5);--fundo-gaveta:rgba(0,0,0,.6);
}}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-padding-top:72px;background:var(--chapa)}
body{min-height:100vh;background-color:var(--chapa);background-image:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,.35) 0%,rgba(255,255,255,0) 58%),linear-gradient(180deg,var(--chapa-a) 0%,var(--chapa-b) 100%);background-attachment:fixed;font:500 15px/1.4 var(--f-txt);color:var(--tinta)}
img{max-width:100%}
button,select,input{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid #FFB020;outline-offset:2px}
.ic{display:block;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.trilho{width:min(calc(100% - 32px),640px);margin:0 auto}
/* Moldura: a tela ocupa o celular de ponta a ponta, sem buraco entre o conteúdo e o dock (B1). */
#app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
#visor{flex:1 0 auto;display:flex;flex-direction:column;padding:8px 0 12px}
#tela{flex:1 0 auto;display:flex;flex-direction:column}

/* Topo: ‹ Voltar no canto superior esquerdo, título sempre no mesmo lugar e Início à direita. */
#topo{position:sticky;top:0;z-index:30;background:var(--chapa)}
.topo-in{min-height:56px;display:flex;align-items:center;gap:8px}
.topo-home{min-height:44px;display:flex;align-items:center;gap:8px;flex:1;min-width:0;text-align:left;padding:0;border-radius:10px}
.topo-home>img{width:36px;height:36px;flex:none;object-fit:contain}
.marca-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;line-height:1}
.marca-tx b{font:700 20px/1 var(--f-txt);letter-spacing:.14em;color:var(--tinta)}
.marca-tx span{font:600 12px/1 var(--f-txt);letter-spacing:.2em;color:var(--destaque);white-space:nowrap}
.topo-titulo{flex:1;min-width:0;font:700 17px/1.1 var(--f-txt);letter-spacing:.08em;text-transform:uppercase;color:var(--tinta);overflow-wrap:anywhere}
#topo.fora .topo-home{display:none}
#topo:not(.fora) .topo-titulo{display:none}
.topo-nav{display:contents}
.topo-bt{flex:none;min-height:44px;min-width:44px;padding:0 12px;font:700 15px/1 var(--f-txt);white-space:nowrap}

/* Chave Modo: Laudo / Modo: Técnico */
#modo{flex:none;min-height:44px;padding:0 12px;font:700 15px/1 var(--f-txt);white-space:nowrap}

/* Corpo: blocos soltos sobre a chapa, 12 px entre eles; o último cresce até o dock (C28). */
.folha{flex:1 0 auto;display:flex;flex-direction:column;gap:12px}
.folha>.cresce{flex-grow:1}
.cartao{background:var(--cartao);border:1px solid var(--cartao-bd);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--sombra-cartao)}
h1{font:700 20px/1.2 var(--f-txt);color:var(--tinta);overflow-wrap:anywhere}
h2{font:700 17px/1.25 var(--f-txt);color:var(--tinta)}
h3{font:700 14px/1.25 var(--f-txt);letter-spacing:.08em;text-transform:uppercase;color:var(--tinta)}
.tx{font-size:15px;color:var(--linha)}
.sub{font-size:14px;color:var(--apoio)}
.linha{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cab-sec{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.grade2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grade4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.grade3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.bt[data-t]{white-space:nowrap}
.grade2>.campo{justify-content:flex-end}
.opcoes{display:flex;flex-wrap:wrap;gap:8px}
.opcoes .bt{flex:1 1 auto}
.nw{white-space:nowrap}

/* Teclas (roupagem Domo): luz de cima no próprio preenchimento, brilho de 1 px e base de 2 px por dentro. Nada sai da caixa. */
.bt{min-height:44px;border-radius:10px;padding:8px 12px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 15px/1.25 var(--f-txt);text-align:center;overflow-wrap:anywhere;transition:transform .14s linear}
.bt:active,[data-tecla]:active{transform:translateY(2px)}
.bt:disabled,[data-tecla]:disabled,[data-tecla][aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.largo{width:100%}
.bt-cobalto,.tecla{background:radial-gradient(140% 130% at 50% -10%,var(--tecla-a) 0%,var(--tecla-b) 45%,var(--tecla-c) 100%);border:1px solid var(--tecla-bd);box-shadow:inset 0 1px 1px var(--tecla-luz),inset 0 -2px 0 var(--tecla-bd);color:var(--tecla-tx)}
.bt-sel{background:radial-gradient(140% 130% at 50% -10%,var(--clara-a) 0%,var(--clara-b) 40%,var(--clara-c) 75%,var(--clara-d) 100%);border:1px solid var(--clara-bd);box-shadow:inset 0 1px 1px rgba(255,255,255,.65),inset 0 -2px 0 var(--clara-bd);color:var(--clara-tx)}
.bt-sel[aria-pressed="true"]{background:radial-gradient(140% 130% at 50% -10%,var(--sel-a) 0%,var(--sel-b) 40%,var(--sel-c) 100%);border:3px solid #FFB020;box-shadow:inset 0 0 0 1px var(--tecla-bd);color:var(--sel-tx)}
.bt-cat{background:radial-gradient(140% 130% at 50% -10%,#FFD477 0%,#FFC044 45%,#E08F00 100%);border:1px solid #7A4E00;box-shadow:inset 0 1px 1px rgba(255,255,255,.65),inset 0 -2px 0 #5C3A00;color:#1A1203;letter-spacing:.04em;text-transform:uppercase}
.bt-cat[aria-pressed="true"]{border:3px solid #7A4E00}
.bt-verde{background:radial-gradient(140% 130% at 50% -10%,#3BE07A 0%,#25D366 45%,#18B052 100%);border:1px solid #075E54;box-shadow:inset 0 1px 1px rgba(255,255,255,.55),inset 0 -2px 0 #075E54;color:#FFFFFF;min-height:52px}
.bt-grande{min-height:52px}
.bt-sel.bt-destr{background:var(--destr-bg);border:1.5px solid #B91C1C;box-shadow:none;color:var(--destr-tx)}
.bt-sel.bt-destr[data-etapa="confirmar"]{background:radial-gradient(140% 130% at 50% -10%,#D43A3A 0%,#A61919 100%);border:1px solid #7F1D1D;color:#FFFFFF}
.bt-sel[data-r="ok"][aria-pressed="true"],.bt-sel[data-s="ok"][aria-pressed="true"]{background:radial-gradient(140% 130% at 50% -10%,#1A8642 0%,#126B34 100%);border:3px solid #FFB020;color:#FFFFFF}
.bt-sel[data-r="def"][aria-pressed="true"],.bt-sel[data-s="fo"][aria-pressed="true"]{background:radial-gradient(140% 130% at 50% -10%,#D43A3A 0%,#A61919 100%);border:3px solid #FFB020;color:#FFFFFF}
.escolha{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left}
.escolha .seletor-val{flex:1;min-width:0}
.eq-seta{flex:none;font:700 15px/1 var(--f-txt)}

/* Visor champanhe (instrumento, mostrador, pílula): cavidade por dentro e fio claro embaixo. */
.visor-ch,.poco{background:linear-gradient(180deg,var(--visor-a) 0%,var(--visor-b) 34%,var(--visor-c) 100%);border:1.5px solid var(--visor-bd);border-radius:12px;box-shadow:inset 0 2px 6px var(--visor-sombra),0 1px 0 rgba(255,255,255,.7);color:var(--visor-num);min-width:0}
.visor-ch{padding:12px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.vs-rot{font:600 12px/1.2 var(--f-txt);letter-spacing:.14em;text-transform:uppercase;color:var(--visor-rot)}
.vs-num{font:700 48px/1 var(--f-mono);font-variant-numeric:tabular-nums;color:var(--visor-num);white-space:nowrap}
.vs-num small{font:700 17px var(--f-mono);color:var(--visor-rot);margin-left:4px}
.vs-sub{font:600 14px/1.35 var(--f-txt);color:var(--visor-rot);font-variant-numeric:tabular-nums}
.vs-sub b{color:var(--visor-num)}
.vs-legenda{display:flex;justify-content:space-between;gap:8px;font:600 12px/1.25 var(--f-txt);color:var(--visor-rot);white-space:nowrap}
.vs-topo{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0}
.vs-leitura{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.vs-graf{display:block;width:100%;height:auto;overflow:visible}
.pocos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.poco{padding:8px 12px;display:flex;flex-direction:column;gap:4px}
.poco .pr{font:600 12px/1.2 var(--f-txt);letter-spacing:.1em;text-transform:uppercase;color:var(--visor-rot)}
.poco .val{font:700 24px/1.1 var(--f-mono);color:var(--visor-num);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.poco .val small{font:700 15px var(--f-mono);color:var(--visor-rot);margin-left:4px}
.poco.ok{border-color:#15803D}.poco.def{border-color:#B91C1C}.poco.alerta{border-color:#B45309}
.vs-lucro-val{font:700 38px/1 var(--f-mono);font-variant-numeric:tabular-nums;color:var(--visor-num);white-space:nowrap}
/* Ilustrações de objeto real (botija e multímetro): cores físicas, iguais no claro e no escuro (C51, G7). */
.ilustracao{flex:none;display:block;height:auto}
.botija{width:39%;max-width:132px}
.multimetro{width:118px}
.vs-trava{display:flex;flex-direction:column;gap:4px}
.vs-trava li{list-style:none;display:flex;align-items:center;gap:8px;font:600 14px/1.35 var(--f-txt);color:var(--visor-num)}
.vs-trava li i{font-style:normal;flex:none;width:20px;text-align:center}
.vs-trava li span{flex:1;min-width:0}
.vs-trava li em{font-style:normal;white-space:nowrap}
.vs-led{flex-direction:row;align-items:center;gap:12px}
.led-casa{position:relative;flex:none;width:72px;height:72px;display:flex;align-items:center;justify-content:center}
.led-halo{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,var(--led) 0%,transparent 70%);opacity:0}
.led-bulbo{position:relative;width:32px;height:32px;border-radius:50%;background:#3F4854;border:2px solid #23272E;box-shadow:inset 0 2px 4px rgba(0,0,0,.5)}
.vs-led[data-aceso] .led-bulbo{background:var(--led);border-color:#FFFFFF}
.vs-led[data-aceso] .led-halo{opacity:.45}
.vs-led-tx{display:flex;flex-direction:column;gap:8px;min-width:0}
.selo-led{display:inline-flex;align-items:center;align-self:flex-start;min-height:32px;border-radius:999px;padding:4px 12px;background:var(--bom-bg);border:1px solid var(--bom-bd);color:var(--bom-tx);font:700 14px/1.2 var(--f-txt)}

/* Selos de estado e veredito: palavra + símbolo + cor (L20). */
.veredito{border-radius:10px;padding:12px;font:700 15px/1.3 var(--f-txt);border:1px solid}
.veredito small{display:block;font:500 14px/1.5 var(--f-txt);margin-top:4px}
.veredito.ok{background:var(--bom-bg);border-color:var(--bom-bd);color:var(--bom-tx)}
.veredito.def{background:var(--erro-bg);border-color:var(--erro-bd);color:var(--erro-tx)}
.veredito.alerta{background:var(--aten-bg);border-color:var(--aten-bd);color:var(--aten-tx)}
.veredito.neutro{background:var(--cartao);border-style:dashed;border-color:var(--cartao-bd);color:var(--apoio);font-weight:600}
.veredito.ok::before{content:'✓ '}.veredito.def::before{content:'✗ '}.veredito.alerta::before{content:'⚠ '}.veredito.neutro::before{content:'▸ '}
.cmp25{display:flex;flex-direction:column;gap:4px;border-radius:8px;padding:8px;border:1px solid;font:600 14px/1.3 var(--f-txt);min-width:0}
.cmp25 b{font:700 14px/1.25 var(--f-txt)}
.cmp25.cego{background:var(--erro-bg);border-color:var(--erro-bd);color:var(--erro-tx)}
.cmp25.real{background:var(--bom-bg);border-color:var(--bom-bd);color:var(--bom-tx)}
.queda{font:700 15px/1.2 var(--f-mono);color:var(--visor-num)}

/* Tokens de texto inline (grandeza, temperatura, dinheiro, pontas, bornes, energia, código). */
.tk{display:inline-block;padding:0 4px;border-radius:6px;font:700 14px/1.3 var(--f-txt);vertical-align:baseline}
.tk-ponta-v{background:#B91C1C;color:#FFFFFF;white-space:nowrap}
.tk-ponta-v::before,.tk-ponta-p::before{content:'● '}
.tk-ponta-p{background:#0B0B0C;color:#FFFFFF;white-space:nowrap}
.tk-borne{background:#1E3A8A;color:#FFFFFF;font-family:var(--f-mono);white-space:nowrap}
.tk-medida,.tk-temp,.tk-dinheiro,.tk-cod{background:var(--faixa);color:var(--tinta);border:1px solid var(--faixa-bd);font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tk-off{background:var(--bom-bg);color:var(--bom-tx);border:1px solid var(--bom-bd)}
.tk-on{background:var(--erro-bg);color:var(--erro-tx);border:1px solid var(--erro-bd)}
.ref-faixa{background:var(--faixa);border:1px solid var(--faixa-bd);border-left:4px solid var(--destaque);border-radius:8px;padding:8px 12px;font:500 14px/1.6 var(--f-txt);color:var(--linha)}
.ref-faixa b{color:var(--tinta)}

/* Etiquetas e crachás (12 px, caixa alta). */
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-flex;align-items:center;gap:4px;font:700 12px/1.2 var(--f-txt);letter-spacing:.06em;padding:4px 8px;border-radius:6px;border:1px solid;white-space:nowrap}
.tag-verm{background:#B91C1C;color:#FFFFFF;border-color:#7F1D1D}
.tag-preta{background:#0B0B0C;color:#FFFFFF;border-color:#3F3F3F}
.tag-escala,.tag-alvo,.tag-info,.tag-sis,.tag-fer{background:var(--faixa);color:var(--tinta);border-color:var(--faixa-bd)}
.tag-alvo{font-family:var(--f-mono)}
.tag-bonus{background:var(--aten-bg);color:var(--aten-tx);border-color:var(--aten-bd)}
.tag-margem{background:var(--bom-bg);color:var(--bom-tx);border-color:var(--bom-bd);font-variant-numeric:tabular-nums}
.p1,.p2,.p3{background:var(--faixa);color:var(--tinta);border-color:var(--faixa-bd)}
.p1{background:var(--erro-bg);color:var(--erro-tx);border-color:var(--erro-bd)}
.p2{background:var(--aten-bg);color:var(--aten-tx);border-color:var(--aten-bd)}
.p3{background:var(--info-bg);color:var(--info-tx);border-color:var(--info-bd)}
.cod-badge{background:var(--faixa);border:1px solid var(--faixa-bd);color:var(--tinta);font:700 12px/1.2 var(--f-mono);padding:4px 8px;border-radius:6px;white-space:nowrap}

/* Seletor Global (pílula de equipamento) no visor champanhe. */
.eq-pilula{display:grid;grid-template-columns:1fr 1.25fr 1fr;border-radius:8px;padding:0;align-items:stretch}
.eq-bt{min-height:56px;min-width:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:8px;padding:8px 12px;text-align:left;border-left:1px solid rgba(63,50,16,.25);transition:background-color .2s ease}
.eq-bt:first-child{border-left:0}
.eq-bt:active{transform:translateY(2px)}
.eq-rot{font:600 11px/1 var(--f-txt);letter-spacing:.14em;color:var(--visor-rot);white-space:nowrap}
.eq-val{display:flex;align-items:center;gap:4px;min-width:0;font:700 17px/1 var(--f-mono);color:var(--visor-num);white-space:nowrap}
.wordmark{display:inline-flex;align-items:center;justify-content:center;flex:none;min-width:28px;height:28px;padding:0 4px;border-radius:6px;background:#FFFFFF;border:1px solid #94A3B8;font:700 12px/1 Arial,Helvetica,sans-serif;color:#0C2747}

/* Campo: rebaixo por dentro, foco com aro âmbar de 3 px, valor inválido com borda vermelha (L25). */
.campo{display:flex;flex-direction:column;gap:8px;min-width:0}
.campo>.rot{font:600 12px/1.2 var(--f-txt);letter-spacing:.1em;text-transform:uppercase;color:var(--apoio)}
.campo .poco-in{min-height:52px;border-radius:10px;border:1px solid var(--campo-bd);background:var(--campo);display:flex;align-items:center;gap:8px;padding:0 12px;box-shadow:inset 0 2px 4px rgba(9,30,66,.18),0 1px 0 rgba(255,255,255,.7)}
.campo .poco-in:focus-within{box-shadow:inset 0 0 0 1px var(--campo-bd),0 0 0 3px #FFB020}
.campo input{flex:1;min-width:0;min-height:44px;border:0;outline:none;background:transparent;font:600 17px/1.3 var(--f-mono);color:var(--tinta);font-variant-numeric:tabular-nums}
.campo input[type="text"],.campo input[type="tel"],.campo input[type="search"]{font-family:var(--f-txt)}
.campo input:focus,.campo input[data-numero]:focus{outline:3px solid #FFB020;outline-offset:4px;border-radius:2px}
.campo input[aria-invalid="true"],.campo input[data-numero][aria-invalid="true"]{color:#B91C1C}
.campo .poco-in:has(input[aria-invalid="true"]){border:1.5px solid #B91C1C}
.campo-erro{font:600 14px/1.3 var(--f-txt);color:var(--erro-tx)}

/* Tecla 1 · Sintomas: 8 teclas de bloco em grade que preenche a tela (L16: altura livre, mínimo 96 px). */
.placas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(96px,1fr);gap:8px;flex-grow:1}
.bt.placa{position:relative;min-height:96px;padding:12px 8px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
.placa-n{position:absolute;top:8px;left:12px;font:500 11px/1 var(--f-mono);color:var(--tecla-num)}
.placa-nome{display:flex;flex-direction:column;align-items:center;gap:4px}
.placa-nome b{font:700 20px/1 var(--f-txt);letter-spacing:.05em;text-transform:uppercase}
.placa-sep{display:none}
.placa-badge{font:600 12px/1.2 var(--f-txt);letter-spacing:.06em;color:var(--tecla-num);white-space:nowrap}
.bt.placa[aria-pressed="true"]{border:3px solid #FFB020}
.capsula{width:100%;min-height:52px;letter-spacing:.08em;text-transform:uppercase}
.lista{display:flex;flex-direction:column;gap:8px}
.lista-casos{display:flex;flex-direction:column;gap:8px}
.opcao{width:100%;flex-direction:column;align-items:flex-start;gap:4px;text-align:left}
.opcao b{font:700 15px/1.25 var(--f-txt)}
.opcao span{font:500 14px/1.3 var(--f-txt)}
.bt.bt-sel.item-caso{display:grid;grid-template-columns:56px minmax(0,1fr);grid-template-areas:'img meio' 'img tags';align-items:center;gap:4px 12px;padding:8px 12px;width:100%;text-align:left}
.item-caso .meio{grid-area:meio;display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0}
.item-caso img{grid-area:img;width:56px;height:56px;object-fit:contain}
.item-caso .tags{grid-area:tags}
.item-caso .linha-cod{display:flex;align-items:flex-start;gap:8px;min-width:0;width:100%}
.item-caso .linha-cod b{flex:1;min-width:0;font:700 17px/1.2 var(--f-txt);overflow-wrap:anywhere}
.item-caso .meio .s{font:500 14px/1.3 var(--f-txt);color:var(--apoio)}
.bt-sel[aria-pressed="true"] .s{color:inherit}

/* Diagnóstico em 7 camadas. */
.c1{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--faixa);border:1px solid var(--faixa-bd);border-radius:10px;padding:8px 12px}
.c1 span{font:600 12px/1.25 var(--f-txt);letter-spacing:.1em;text-transform:uppercase;color:var(--apoio);min-width:0}
.c1 b{font:700 14px/1.25 var(--f-mono);color:var(--tinta);text-align:right;min-width:0}
.c2 p{font:500 15px/1.35 var(--f-txt);color:var(--apoio)}
.c3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:stretch}
.chip{background:var(--cartao);border:1px solid var(--cartao-bd);border-radius:10px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}
.chip img{width:40px;height:40px;object-fit:contain}
.chip-k{font:600 11px/1.2 var(--f-txt);letter-spacing:.1em;text-transform:uppercase;color:var(--apoio)}
.chip .v{font:600 14px/1.2 var(--f-txt);color:var(--tinta);overflow-wrap:break-word}
.ilustra{position:relative;overflow:hidden;border-radius:12px;border:1px solid var(--cartao-bd);background:#FFFFFF}
.ilustra-in{position:relative;transform-origin:var(--zx,50%) var(--zy,50%);transition:transform .3s ease}
.ilustra.zoom .ilustra-in{transform:scale(1.85)}
.ilustra-z{position:absolute;right:8px;bottom:8px;z-index:3}
.ilustra img{display:block;width:100%;height:auto}
.alvo{position:absolute;width:44px;height:44px;transform:translate(-50%,-50%);border-radius:50%}
.alvo::before{content:'';position:absolute;inset:5px;border-radius:50%;border:3px solid #0B5976;background:rgba(255,255,255,.35)}
.alvo.sel::before{border-color:#FFB020}
.quadro .passo-cab{grid-template-columns:76px minmax(0,1fr)}
.quadro .passo-tile{width:76px;height:76px}
.c5{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media (min-width:720px){.c5{grid-template-columns:repeat(2,minmax(0,1fr))}}
.causa,.verif{width:100%;justify-content:flex-start;text-align:left;gap:12px;padding:8px 12px}
.causa .t,.verif .t{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.causa .nm,.verif .tt{font:700 15px/1.25 var(--f-txt)}
.verif .ln{font:500 14px/1.4 var(--f-txt)}
.verif .num,.causa-tile .num{flex:none;width:28px;height:28px;border-radius:6px;background:#0C2747;color:#FFFFFF;font:700 12px/28px var(--f-mono);text-align:center}
.causa-tile{position:relative;width:52px;height:52px;flex:none}
.causa-tile img{display:block;width:52px;height:52px;object-fit:contain}
.causa-tile .num{position:absolute;top:-4px;left:-4px}
.bloco-h{background:var(--faixa);border:1px solid var(--faixa-bd);color:var(--tinta);padding:8px 12px;border-radius:8px;font:700 14px/1.2 var(--f-txt);letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between;gap:8px}
.bloco-h span{flex:none}
.bt.bt-sel.verif.ok{border-color:#15803D}
.bt.bt-sel.verif.def,.bt.bt-sel.causa.conf{border-color:#B91C1C}
.bt.bt-sel.causa.sel,.bt.bt-sel.verif.sel{border:3px solid #FFB020}
.lupa{position:relative;width:100%;aspect-ratio:16/10;background-size:175% auto;background-repeat:no-repeat;border-radius:12px;border:1px solid var(--cartao-bd);background-color:#FFFFFF}
.lupa span{position:absolute;left:8px;top:8px;font:700 14px/1 var(--f-txt);background:#FFFFFF;color:#0C2747;border:1px solid #94A3B8;border-radius:999px;padding:8px 12px}
.cab-tile{display:flex;align-items:center;gap:12px;min-width:0}
.cab-tile img{width:40px;height:40px;flex:none;object-fit:contain}
.passo-cab{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:center}
.passo-tile{width:64px;height:64px;object-fit:contain}
[data-l="srv-sec"] .passo-cab{grid-template-columns:56px minmax(0,1fr)}
[data-l="srv-sec"] .passo-tile{width:56px;height:56px}
.passo-tx{display:flex;flex-direction:column;gap:4px;min-width:0}
.quadro{border:3px solid #FFB020}
.prox{width:100%;flex-direction:column;align-items:flex-start;gap:8px;text-align:left}
.prox .se{font:500 14px/1.3 var(--f-txt)}
.se-b{background:var(--aten-bg);color:var(--aten-tx);padding:0 8px;border-radius:6px;font-weight:700}
.prox .entao{font:700 15px/1.3 var(--f-txt)}
.prox .acao{background:var(--bom-bg);color:var(--bom-tx);border:1px solid var(--bom-bd);border-radius:999px;padding:4px 12px;font:700 14px/1.25 var(--f-txt)}
.c7{display:flex;gap:12px;align-items:flex-start;background:#FFB020;border-radius:10px;padding:12px;color:#1A1203}
.c7 p{font:500 15px/1.5 var(--f-txt)}
.c7 b{font-weight:800}
.navc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

/* Tecla 3 · Códigos */
.codigo .cd{font:700 17px/1.2 var(--f-mono);background:var(--faixa);color:var(--tinta);border:1px solid var(--faixa-bd);border-radius:6px;padding:4px 8px;display:inline-block;white-space:nowrap;max-width:100%}
.mk-marca{display:inline-flex;align-items:center;gap:8px;font:700 14px/1.2 var(--f-txt);color:var(--tinta)}
.codigo .mk{font:500 14px/1.3 var(--f-txt);color:var(--apoio)}
.selo-ok{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;background:var(--bom-bg);border:1px solid var(--bom-bd);color:var(--bom-tx);font:700 14px/1.25 var(--f-txt);border-radius:8px;padding:8px}
.faca{background:var(--faixa);border:1px solid var(--faixa-bd);border-left:4px solid #15803D;color:var(--linha);font-weight:600;border-radius:8px;padding:8px 12px;font-size:14px;line-height:1.6}
.marcas{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}
.marcas .bt{justify-content:flex-start;padding:8px 12px}
.marcas.marcas-faixa{display:flex;overflow-x:auto;gap:8px;padding:4px 0 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.marcas.marcas-faixa::-webkit-scrollbar{display:none}
.marcas.marcas-faixa .bt{flex:0 0 auto;white-space:nowrap}
.marcas-faixa.rola:not(.fim){-webkit-mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 32px),transparent 100%);mask-image:linear-gradient(90deg,#000 0,#000 calc(100% - 32px),transparent 100%)}

/* Tecla 4 · Tabela & Laudo */
.laudo-hero{display:flex;flex-direction:column;gap:12px}
.orc-topo{display:flex;align-items:center;justify-content:space-between;gap:8px}
.orc-topo h2{white-space:nowrap;min-width:0}
.orc-estado{font:600 14px/1.35 var(--f-txt);color:var(--apoio)}
.orc-estado b{color:var(--tinta);font-family:var(--f-mono)}
[data-l=corpo]{flex:1 0 auto;display:flex;flex-direction:column;gap:12px}
.total{display:flex;flex-direction:column;gap:4px;padding:12px}
.total>span{font:600 12px/1.2 var(--f-txt);letter-spacing:.14em;text-transform:uppercase;color:var(--visor-rot)}
.total b{font:700 48px/1 var(--f-mono);font-variant-numeric:tabular-nums;color:var(--visor-num);white-space:nowrap}
.ancora{display:flex;align-items:center;gap:8px;font:700 14px/1.3 var(--f-txt);color:var(--visor-rot)}
.ancora b{font-family:var(--f-mono);color:var(--visor-num)}
.grade3-faixa{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grade3-faixa .bt{flex-direction:column;gap:4px;padding:8px;min-height:56px}
.grade3-faixa .bt span{font:600 12px/1.2 var(--f-txt);letter-spacing:.1em;text-transform:uppercase}
.grade3-faixa .bt b{font:700 15px/1.2 var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.bastidor-card{display:flex;flex-direction:column;gap:12px}
.placa-lucro{background:linear-gradient(180deg,#E8D9A8 0%,#F7EED3 34%,#E5DCC3 100%);border:1px solid #8A7440;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:inset 0 1px 0 #FFFFFF,inset 0 -2px 0 #8A7440,0 3px 8px rgba(63,50,16,.3);color:#3F3210}
.placa-lucro .vs-rot{color:#3F3210}
.placa-lucro .vs-lucro-val{color:#14532D}
.placa-lucro .vs-legenda{color:#3F3210}
.bast-linha{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 8px;min-width:0;padding-top:8px;border-top:1px solid var(--int)}
.bast-linha .pr{font:600 14px/1.2 var(--f-txt);color:var(--apoio)}
.bast-linha .val{margin-left:auto;font:700 20px/1.1 var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--tinta)}
.bast-linha s{font-size:15px;color:var(--apoio)}
.bast-nota{font:500 14px/1.45 var(--f-txt);color:var(--apoio)}
.degraus{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.degraus>div{display:flex;flex-direction:column;gap:4px;padding:8px;border-radius:8px;border:1px solid var(--visor-bd);background:linear-gradient(180deg,var(--visor-a) 0%,var(--visor-b) 34%,var(--visor-c) 100%);min-width:0}
.degraus span{font:600 12px/1.2 var(--f-txt);letter-spacing:.1em;text-transform:uppercase;color:var(--visor-rot)}
.degraus b{font:700 15px/1.2 var(--f-mono);color:var(--visor-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.degraus>.on{border:3px solid #FFB020}
.odometro{font:700 14px/1.3 var(--f-mono);color:var(--tinta);font-variant-numeric:tabular-nums}
.srv-lista{display:flex;flex-direction:column;gap:8px}
.srv-linha{display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;gap:12px;min-height:56px;padding:8px 0;border-top:1px solid var(--int)}
.srv-linha:first-child{border-top:0}
.srv-linha img{width:40px;height:40px;object-fit:contain}
.srv-linha .nm{font:700 17px/1.2 var(--f-txt);color:var(--tinta);overflow-wrap:anywhere}
.srv-linha .vl{font:700 15px/1.2 var(--f-mono);color:var(--tinta);font-variant-numeric:tabular-nums;white-space:nowrap}
.srv-linha .acoes{grid-column:2/4;display:flex;gap:8px;flex-wrap:wrap}
.vazio{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:12px 0}
.vazio b{font:600 17px/1.2 var(--f-txt)}
details.dobra>summary,.dobra-cab{min-height:44px;width:100%;display:flex;align-items:center;gap:8px;font:700 14px/1.3 var(--f-txt);letter-spacing:.08em;text-transform:uppercase;color:var(--tinta);cursor:pointer;list-style:none;text-align:left}
details.dobra>summary::-webkit-details-marker{display:none}
details.dobra>summary::after,.dobra-cab::after{content:'▾';margin-left:auto;font-size:15px;transition:transform .2s ease}
details.dobra[open]>summary::after,.dobra-cab[aria-expanded="true"]::after{transform:rotate(180deg)}
.dobra-n{font:600 14px/1.2 var(--f-mono);color:var(--apoio)}
.dobra-in{display:flex;flex-direction:column;gap:12px;padding-top:4px}
.cartao.dobra{padding-top:4px;padding-bottom:4px}
.cartao.dobra[open],.cartao.dobra:has(>.dobra-cab[aria-expanded="true"]){padding-bottom:12px}
.reg{display:flex;flex-direction:column;gap:4px;padding:8px 0;border-top:1px solid var(--int)}
.reg b{font:700 15px/1.25 var(--f-txt);color:var(--tinta)}
.ref-item{font-size:15px;line-height:1.6;color:var(--linha)}
.ref-item b{display:block;font:700 14px/1.3 var(--f-txt);color:var(--tinta)}
.leit .it{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--int);font-size:14px}
.leit .it span{flex:1;min-width:0}
.leit .it .bt{flex:none;width:44px;padding:0}
.selo-laudo-ok{background:var(--bom-bg);border:1px solid var(--bom-bd);color:var(--bom-tx);border-radius:10px;padding:8px 12px;min-height:40px;font:700 14px/1.3 var(--f-txt);display:flex;align-items:center;gap:8px}
.envio-sec{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.envio-sec:has(> [hidden]){grid-template-columns:minmax(0,1fr)}
.dupla{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.aviso{border-radius:10px;padding:8px 12px;font-size:14px;border:1px solid var(--cartao-bd);background:var(--cartao);color:var(--linha)}
.aviso.ok{border-color:var(--bom-bd);background:var(--bom-bg);color:var(--bom-tx)}
.aviso.def{border-color:var(--erro-bd);background:var(--erro-bg);color:var(--erro-tx)}
.zap-prev{white-space:pre-wrap;overflow-wrap:anywhere;font:500 14px/1.45 var(--f-txt);background:var(--faixa);border:1px solid var(--faixa-bd);border-radius:10px;padding:8px 12px;color:var(--linha)}
.pix-prev{display:flex;gap:12px;align-items:center}
.pix-prev svg{width:112px;height:112px;flex:none;background:#FFFFFF;border-radius:6px}
.pix-prev p{font-size:14px;overflow-wrap:anywhere}

/* Gaveta (de serviço, de equipamento e de escolha): 34 px livres embaixo, fecha no Fechar e no toque fora. */
#fundo{position:fixed;inset:0;background:var(--fundo-gaveta);z-index:40;display:none}
#fundo.on{display:block}
#gaveta{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:86vh;overflow-y:auto;background:var(--chapa);border-radius:18px 18px 0 0;padding:12px 0 34px;transform:translateY(16px);opacity:0;transition:transform .3s ease,opacity .3s ease;box-shadow:0 -8px 24px rgba(9,30,66,.25)}
#gaveta.on{transform:none;opacity:1}
#gaveta .trilho{display:flex;flex-direction:column;gap:12px}
#gaveta .trilho>.cab-sec:first-child{position:sticky;top:-12px;z-index:2;background:var(--chapa);padding:8px 0;margin-top:-8px}
.familias{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.familias .bt{flex-direction:column;gap:4px;padding:8px 4px;min-height:56px;font-size:14px;position:relative}
.familias .ponto{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:#A5F3FC}
.grade-srv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.srv-card{display:flex;flex-direction:column;gap:8px;padding:8px}
.srv-card[data-adicionado]{border:3px solid #FFB020}
.srv-card img{width:100%;max-width:112px;height:auto;aspect-ratio:1;object-fit:contain;align-self:center;border-radius:12px}
.srv-card .nm{font:700 14px/1.2 var(--f-txt);letter-spacing:.06em;text-transform:uppercase;color:var(--tinta);min-height:34px}
.srv-card .pr{font:700 20px/1 var(--f-mono);color:var(--tinta)}
.barra-total{position:sticky;bottom:-34px;display:flex;align-items:center;gap:12px;padding:8px 12px;margin-bottom:-34px;padding-bottom:42px;background:var(--chapa)}
.barra-total .visor-ch{flex:1;padding:8px 12px;gap:4px}
.barra-total .vs-rot{font-size:11px}

    q('salvar-cofre').addEventListener('click', () => { if (!L.itens.length) return msg('Adicione um serviço antes de guardar o laudo no Cofre.', 'def'); const n = fixarNumero(); arquivar(n); pintarEstado(); pulso(); toast(`Laudo Nº ${n} salvo no Cofre`); });
    q('excluir-atual').addEventListener('click', (e) => confirmar2(e.currentTarget, 'Confirmar: limpar o laudo atual', () => { S.origemCofre = null; Object.assign(L, novoLaudo({ mala: L.mala, pmoc: L.pmoc })); L.tecnico = true; S.leituras = []; S.casoLaudo = -1; S.srvSug = null; S.causaSug = null; S.numero = null; S.numeroGravado = false; salvarSessao(); pintarDock(); render(); toast('Laudo atual limpo'); }));
    q('limpar').addEventListener('click', (e) => confirmar2(e.currentTarget, `Toque de novo para limpar ${S.leituras.length} leitura${S.leituras.length === 1 ? '' : 's'}`, () => { S.leituras = []; S.casoLaudo = -1; S.srvSug = null; S.causaSug = null; S.trava = {}; S.inv = {}; pintarLeit(); pintarDock(); pintarTudo(); salvarSessao(); toast('Leituras limpas'); }));
    q('causa').addEventListener('click', () => { OPS = opcoesCausa(); escolher('Causa confirmada da visita', OPS.map(([c, s]) => [c, '→ ' + sv(s).servico, c === L.causa]), (k) => { const [c, s] = OPS[k]; L.causa = c; pontearServico(L, s); pintarTudo(); }); });
    q('v').addEventListener('input', () => { const i = L.itens[selIdx()]; if (!i) return; i.v = num(q('v').value) ?? 0; pintarServicos(); pintarValor(); });
    $$('[data-aj]', corpo).forEach(b => b.addEventListener('click', () => { const I = itensS(), i = I[selIdx()]; if (!i) return; L.itens[selIdx()].v = Math.max(0, valorDe(i) + Number(b.dataset.aj)); pintarTudo(); }));
    q('mala').addEventListener('click', () => { L.mala = !L.mala; pintarValor(); });
    ['cli', 'tel'].forEach(k => q(k).addEventListener('input', () => { L[k] = q(k).value; salvarSessao(); }));
    q('pmocv').addEventListener('input', () => { L.pmoc = q('pmocv').value; salvarSessao(); });
    $$('[data-t]', corpo).forEach(el => el.addEventListener('input', () => { guardar('bancada.titular', JSON.stringify(tDados())); pintarPix(); }));
    const leituras = () => S.leituras.length ? S.leituras.map(a => `• ${a.txt}`) : [`• ${f ? `Diagnóstico ${f.id} guiado pelas 5 verificações da bancada` : 'Inspeção técnica com aferição elétrica e frigorífica'}`];
    const sintoma = () => f ? limpa(`Diagnóstico ${f.id} · ${f.titulo} (${f.sub})`) : 'Diagnóstico instrumentado na bancada';
    // WhatsApp (S1 do pacote): cada serviço repete Serviço, Procedimento incluso, Valor do serviço e Prevenção; o Valor total vem 1 vez, com a
    // âncora regional logo abaixo. Nada de custo, lucro, mínimo ou máximo para o cliente.
    const montarTexto = (numero) => {
      const t = tDados(), pl = pixPayload(t, totalFinal(), numero), I = itensS();
      return limpa([`*LAUDO DE APROVAÇÃO Nº ${numero} — BANCADA GELOPRO 2026*`, `Data: ${dataBR(Date.now())}${L.cli ? ` · Cliente: ${L.cli}` : ''}`, '',
        `*Equipamento:* ${equipTx()}`, `*Sintoma:* ${sintoma()}`, '', '*Leituras aferidas na bancada:*', ...leituras(), '', `*Causa confirmada:* ${L.causa}`, '',
        ...I.flatMap(i => [`*Serviço:* ${i.s.servico}`, `*Procedimento incluso:* ${i.s.justificativa_tecnica}`, `*Valor do serviço:* ${brl(valorDe(i))}`, `*Prevenção:* ${i.s.economia_preventiva}`, '']),
        `*Valor total:* ${brl(totalFinal())}`, `_${ancora()}_`, '',
        `*Garantia de 90 dias:* _${CLAUSULA}_`, '', `*Pix (chave ${t.pix}${t.nome ? ' · ' + t.nome : ''}):*`, ...(pl ? [`Pix copia e cola: ${pl}`] : []), '', `*${ACEITE}*`].join('\n'));
    };
    const semPix = () => { if (tDados().pix) return false; q('tit').hidden = false; q('tit').open = true; $('[data-t=pix]', corpo).focus(); msg('Digite sua chave Pix em Seus dados: o laudo sai com o Pix copia e cola e o QR com o valor exato.', 'def'); return true; };
    const fixarNumero = () => { const n = numeroLaudo(true); q('num1').textContent = n; q('num2').textContent = n; return n; };
    const guardarCofre = () => guardar('bancada.cofre', JSON.stringify(S.cofre));
    const arquivar = (numero) => { const I = itensS(), it = { id: String(numero), num: String(numero), data: dataBR(Date.now()), equip: equipTx(), servico: I.map(i => NOME_CURTO[i.sid] || i.s.servico).join(' + '), itens: L.itens.map(i => ({ sid: i.sid, v: i.v })), causa: L.causa, valor: totalFinal(), cli: L.cli, tel: L.tel, leituras: S.leituras.slice(), caso: f ? f.n : -1 };
      const k = S.cofre.findIndex(x => x.id === it.id); if (k >= 0) S.cofre[k] = it; else S.cofre.unshift(it); guardarCofre(); pintarCofre(); };
    const pintarCofre = () => {
      q('cofre-n').textContent = S.cofre.length; const lc = q('lucro-cofre'); lc.hidden = !S.cofre.length; lc.textContent = `Acumulado no Cofre: ${brl(S.cofre.reduce((a, x) => a + (Number(x.valor) || 0), 0))}`; const lst = q('cofre-lista'); lst.hidden = !S.cofreAberto; $('[data-cofre-toggle]', corpo).setAttribute('aria-expanded', String(!!S.cofreAberto));
      lst.innerHTML = S.cofre.length ? S.cofre.map(it => `<div class="reg" data-cofre-item="${esc(it.id)}"><b>Nº ${esc(it.num)} · ${esc(it.data)}</b><span class="tx">${esc(it.servico)} — ${brl(it.valor)}</span><span class="sub">${esc(it.equip)}${it.cli ? ' · ' + esc(it.cli) : ''}</span>
        <div class="dupla"><button type="button" class="bt bt-sel" data-cofre-abrir="${esc(it.id)}" aria-label="Abrir o laudo Nº ${esc(it.num)} de ${esc(it.data)}">Abrir</button><button type="button" class="bt bt-sel bt-destr" data-cofre-del="${esc(it.id)}" data-confirmar-texto="Confirmar: excluir Nº ${esc(it.num)}" aria-label="Excluir o laudo Nº ${esc(it.num)} de ${esc(it.data)}">${ico('lixeira', '#B91C1C', 20)}<span>Excluir</span></button></div></div>`).join('')
        : '<p class="sub">Nenhum laudo salvo ainda. Toque em Salvar no Cofre para guardar este.</p>';
      $$('[data-cofre-del]', lst).forEach(b => b.addEventListener('click', () => { const it = S.cofre.find(x => x.id === b.dataset.cofreDel); if (!it) return;
        confirmar2(b, `Confirmar: excluir Nº ${it.num} de ${it.data}`, () => { S.cofre = S.cofre.filter(x => x.id !== it.id); guardarCofre(); pintarCofre(); pintarEstado(); toast(`Laudo Nº ${it.num} excluído do Cofre`); }); }));
      $$('[data-cofre-abrir]', lst).forEach(b => b.addEventListener('click', () => { const it = S.cofre.find(x => x.id === b.dataset.cofreAbrir); if (!it) return;
        Object.assign(L, novoLaudo(it.itens ? it : { sid: it.sid, v: it.vBase ?? it.valor, comboId: it.comboId, causa: it.causa, cli: it.cli, tel: it.tel }), { mala: L.mala, tecnico: L.tecnico }); S.leituras = Array.isArray(it.leituras) ? it.leituras : []; S.casoLaudo = Number.isInteger(it.caso) && it.caso < F.length ? it.caso : -1; S.numero = it.num; S.numeroGravado = true;
        S.origemCofre = { num: String(it.num), data: it.data }; S.cofreAberto = false; salvarSessao(); pintarDock(); render(); window.scrollTo(0, 0); toast(`Laudo Nº ${it.num} de ${it.data} aberto do Cofre`); }));
    };
    pintarCofre();
    q('zap').addEventListener('click', async () => {
      if (!L.itens.length) return; L.tecnico = false; pintarTudo(); if (semPix()) return;
      const numero = fixarNumero(), txt = montarTexto(numero); arquivar(numero);
      window.__ultimoLaudoZap = txt; q('prevzap').textContent = txt; q('prevzap').hidden = false;
      const fone = String(L.tel || '').replace(/\D/g, ''), url = `https://wa.me/${fone.length >= 10 ? '55' + fone.replace(/^55/, '') : ''}?text=${encodeURIComponent(txt)}`;
      window.__ultimoZapUrl = url; window.open(url, '_blank', 'noopener');
      let copiou = false; try { await navigator.clipboard.writeText(txt); copiou = true; pulso(); } catch (e) { /* o link do WhatsApp já leva o texto */ }
      msg(`Laudo Nº ${numero} disparado para o WhatsApp${copiou ? ' e copiado' : ''}. O cliente aprova respondendo APROVADO.`, 'ok');
    });
    const gerarPDF = async (b, montarDoc, rot) => {
      L.tecnico = false; pintarTudo();
      if (!window.GeloProPDF) return msg('O motor de PDF não carregou. Abra a bancada com sinal uma vez.', 'def');
      if (semPix()) return;
      b.disabled = true;
      try {
        const doc = montarDoc(), r = await window.GeloProPDF.gerar(doc);
        let texto = ''; try { texto = new TextDecoder('latin1').decode(r.bytes); } catch (e) {}
        window.__ultimoPdf = { nome: r.nome, paginas: r.paginas, bytes: r.bytes.length, tipo: doc.tipo, numero: doc.numero, qr: !!doc.pixQr, texto, doc };
        window.GeloProPDF.baixar(r.blob, r.nome);
        msg(`${rot} Nº ${doc.numero} gerado: ${r.nome} (${r.paginas} página${r.paginas > 1 ? 's' : ''}).`, 'ok');
      } catch (e) { msg('Não consegui gerar o PDF: ' + e.message + '. Confira seus dados e toque de novo.', 'def'); }
      b.disabled = !L.itens.length && b === q('pdf');
    };
    const base = (numero, t, total, pl) => ({ numero, atend: '', data: dataBR(Date.now()), base: 'Tabela Oficial 2026', via2: '', titular: { nome: t.nome, doc: t.doc, docTipo: t.docTipo, cidade: t.cidade, pix: t.pix },
      cliente: { nome: L.cli || 'Cliente', tel: L.tel, equip: equipTx() }, equipDet: null, limpo: true, bancada: null, matriz: [], foto: null, assinatura: null, assinaturaLegenda: '', assinaturaNota: '', preventiva: '',
      ...(pl ? (() => { const M = qrMatriz(pl); return M ? { pixQr: M, pixInfo: { copia: pl, valor: BRL.format(total), favorecido: t.nome, chave: t.pix } } : {}; })() : {}) });
    // PDF A4 Nº 1001 com QR Pix: um item por serviço (nome oficial, procedimento e prevenção), total 1 vez e a âncora regional no fechamento.
    q('pdf').addEventListener('click', (e) => { if (!L.itens.length) return; gerarPDF(e.currentTarget, () => {
      const numero = fixarNumero(), t = tDados(), total = totalFinal(), pl = pixPayload(t, total, numero), I = itensS(); arquivar(numero);
      return limparDoc({ ...base(numero, t, total, pl), tipo: 'laudo', titulo: 'Laudo de Aprovação', itensTitulo: I.length > 1 ? 'Serviços técnicos' : 'Serviço técnico', garSelo: 'GARANTIA 90 DIAS',
        itens: I.map(i => ({ q: 1, d: i.s.servico, v: BRL.format(valorDe(i)), j: i.s.justificativa_tecnica || '', faixa: '', eco: `Prevenção: ${i.s.economia_preventiva}`, condicao: '', escopo: '', resultado: '' })),
        fechamento: { bonif: '', linhas: [], total: [I.length > 1 ? 'Valor total' : 'Valor do serviço', BRL.format(total)], validade: `${ancora()}. Aprovação pelo WhatsApp: o cliente responde APROVADO na mensagem do laudo.` },
        blocos: [{ t: 'Sintoma', x: sintoma() }, { t: 'Leituras aferidas na bancada', x: leituras().join('\n') }, { t: 'Causa confirmada', x: L.causa }, { t: 'Garantia de 90 dias', x: CLAUSULA },
          ...(pl ? [{ t: 'Pagamento por Pix', x: `Chave ${t.pix}.\nCopia e cola: ${pl}` }] : []), { t: 'Aceite', x: ACEITE }],
        nome: window.GeloProPDF.nomeArquivo('laudo', numero, L.cli) });
    }, 'PDF'); });
    // Order Bump PMOC: as atividades vêm literais de pmoc_atividades.csv (grupo, atividade, fonte e referência).
    q('pmoc').addEventListener('click', (e) => gerarPDF(e.currentTarget, () => {
      const numero = fixarNumero(), t = tDados(), mens = num(L.pmoc), grupos = [...new Set(PM.map(a => a.grupo))];
      return limparDoc({ ...base(numero, t, mens || 0, mens ? pixPayload(t, mens, numero) : ''), tipo: 'pmoc', titulo: 'Contrato PMOC', itensTitulo: 'Plano de Manutenção, Operação e Controle', garSelo: 'PMOC',
        itens: [{ q: 1, d: `Contrato PMOC · ${equipTx()}`, v: mens ? BRL.format(mens) + ' por mês' : '___', j: `${PM.length} atividades de manutenção, operação e controle do PMOC`, faixa: '', eco: '', condicao: '', escopo: '', resultado: '' }],
        fechamento: { bonif: '', linhas: [], total: ['Mensalidade', mens ? BRL.format(mens) : '___'], validade: 'Aprovação pelo WhatsApp: o cliente responde APROVADO na mensagem do contrato.' },
        blocos: [...grupos.map(g => ({ t: g, x: PM.filter(a => a.grupo === g).map(a => `• ${a.atividade} (${a.fonte_id}, ${a.referencia})`).join('\n') })), { t: 'Aceite', x: 'Para contratar o PMOC, responda APROVADO.' }],
        nome: window.GeloProPDF.nomeArquivo('pmoc', numero, L.cli) });
    }, 'Contrato PMOC'));
  }).catch(e => { const c = $('[data-l=corpo]', tela); if (c) c.innerHTML = `<div class="aviso def" data-erro>Não consegui ler a Tabela Oficial 2026 (${esc(e.message)}). Abra a bancada com sinal uma vez.<button class="bt bt-cobalto largo" data-ir-af data-saida>Voltar ao Aferir Vivo</button></div>`; const b = $('[data-ir-af]', tela); if (b) b.addEventListener('click', () => irTecla('aferir')); });
}
// Nenhum texto que vai para o PDF carrega a palavra antiga da base.
const limparDoc = (o) => (typeof o === 'string' ? limpa(o) : Array.isArray(o) ? o.map(limparDoc) : o && typeof o === 'object' && !(o instanceof Uint8Array) ? Object.fromEntries(Object.entries(o).map(([k, v]) => [k, k === 'pixQr' ? v : limparDoc(v)])) : o);

// ───────────── Início ─────────────
$$('#dock [data-tecla-dock]').forEach(b => b.addEventListener('click', () => irTecla(b.dataset.teclaDock)));
// Mascote + nome: de qualquer tela, 1 toque volta à grade de Sintomas (sem bloco, busca ou caso aberto).
const irInicio = () => { fecharGaveta(); S.hist = []; S.tecla = 'sintomas'; S.caso = -1; S.sel = 0; S.bloco = null; S.termo = ''; S.todos = false; S.rolagemLista = null; render(); window.scrollTo(0, 0); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} };
$('[data-topo-inicio]').addEventListener('click', irInicio);
function iniciar() {
  $$('[data-ico]').forEach(s => { s.outerHTML = ico(s.dataset.ico, '#FFFFFF', 20); });
  carregarPrecos().catch(() => {});
  const m = location.hash.match(/D-\d{3}/), i = m ? F.findIndex(f => f.id === m[0]) : -1;
  if (ehEssencial() && S.equip.fluido === 'R32') S.equip.fluido = 'R410A'; // Contrato 11: o Essencial afere R22 e R410A
  if (i < 0 && S.teclaSalva) S.tecla = S.teclaSalva; // Contrato 11: reabre na mesma tecla depois de recarregar
  if (i >= 0) abrirCaso(i); else render();
}
// Link #D-xxx com a página já aberta também abre o caso.
window.addEventListener('hashchange', () => { const m = location.hash.match(/D-\d{3}/), i = m ? F.findIndex(f => f.id === m[0]) : -1; if (i >= 0 && !(S.tecla === 'sintomas' && S.caso === i)) abrirCaso(i); });
const prazo = (ms) => new Promise(ok => setTimeout(ok, ms));
Promise.race([Promise.allSettled(NOMES_DC.map(importarDC)), prazo(5000)]).then(() => { window.__dcImportados = Object.keys(DC); iniciar(); });
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('./sw.js').catch(() => {});
</script>
